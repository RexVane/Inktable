[project]
name = "inktable-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "jieba>=0.42.1",
    "model2vec>=0.8.2",
    "pydantic>=2",
    "pymupdf>=1.28.2",
    "python-docx>=1.2.0",
    "sqlite-vec>=0.1.9",
    "uvicorn[standard]>=0.52.1",
    "watchdog>=6.0.0",
]

[project.scripts]
inktable-api = "inktable_api:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.10.0",
    "pillow>=12.3.0",
    "pyinstaller>=6.22.0",
    "pytest>=9.1.1",
]
