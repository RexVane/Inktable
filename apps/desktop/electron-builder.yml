appId: com.ordo.app
productName: Ordo
copyright: Copyright © 2026 RexVane

directories:
  output: ../../dist
  buildResources: build

files:
  - electron/**/*
  - renderer/**/*
  - package.json

# PyInstaller 产物作为额外资源打进 Contents/Resources/sidecar/
# 嵌入模型不再随包分发：语义检索用本机 Ollama bge-m3（未装自动降级）
extraResources:
  - from: ../../services/api/dist
    to: sidecar
    filter:
      - ordo-sidecar
      - ordo-sidecar.exe
  # buildResources are consumed by electron-builder but are not automatically
  # copied into app.asar.  The main process needs these two files at runtime
  # for the Linux/Windows window and tray icons.
  - from: build/brand-mark.png
    to: brand/brand-mark.png
  - from: build/icon.png
    to: brand/icon.png

win:
  icon: icon.ico
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-${version}-Setup-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false
  runAfterFinish: false

mac:
  icon: icon.icns
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64]
  # 无开发者证书时不签名，本地自用可行（首次打开需右键→打开）
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false

linux:
  icon: icon.png
  category: Office
  maintainer: RexVane
  synopsis: Local-first personal knowledge base
  desktop:
    StartupWMClass: ordo
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  artifactName: ${productName}-${version}-${arch}.${ext}

dmg:
  title: Ordo
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
