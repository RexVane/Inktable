appId: com.inktable.app
productName: 墨桌
copyright: 墨桌

directories:
  output: ../../dist
  buildResources: assets

files:
  - electron/**/*
  - renderer/**/*
  - package.json

# PyInstaller 产物作为额外资源打进 Contents/Resources/sidecar/
# 嵌入模型不再随包分发：语义检索用本机 Ollama bge-m3（未装自动降级）
extraResources:
  - from: ../../services/api/dist/inktable-sidecar
    to: sidecar/inktable-sidecar

mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64]
  # 无开发者证书时不签名，本地自用可行（首次打开需右键→打开）
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false

dmg:
  title: 墨桌
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
