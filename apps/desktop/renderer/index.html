<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>Inktable</title>
<style>
  /* 设计 Token —— PLAN §15 A8 */
  :root {
    --bg-app: #ffffff;
    --bg-sidebar: #f5f5f7;
    --bg-card: #f7f7f8;
    --bg-hover: rgba(0,0,0,.05);
    --text-primary: #1d1d1f;
    --text-secondary: #6e6e73;
    --separator: rgba(0,0,0,.1);
    --accent: #1DB954;
    --warn: #ff9f0a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg-app: #1e1e1e; --bg-sidebar: #252525; --bg-card: #2a2a2c;
      --bg-hover: rgba(255,255,255,.05);
      --text-primary: #f5f5f7; --text-secondary: #98989d;
      --separator: rgba(255,255,255,.1);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font: 13px -apple-system, "SF Pro Text", "PingFang SC", sans-serif;
    background: var(--bg-app); color: var(--text-primary);
    -webkit-user-select: none; height: 100vh; display: flex; flex-direction: column;
  }
  .titlebar { height: 38px; -webkit-app-region: drag; flex-shrink: 0; }
  .wrap { flex: 1; overflow-y: auto; padding: 0 32px 32px; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 6px; }
  .sub { color: var(--text-secondary); margin-bottom: 24px; font-size: 13px; }

  .list { border-top: 1px solid var(--separator); }
  .item {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 4px; border-bottom: 1px solid var(--separator);
  }
  .item:hover { background: var(--bg-hover); }
  .cb { width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer; flex-shrink: 0; }
  .info { flex: 1; min-width: 0; }
  .name { font-weight: 500; display: flex; align-items: center; gap: 6px; }
  .badge {
    font-size: 10px; padding: 1px 5px; border-radius: 3px;
    background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn);
  }
  .path {
    color: var(--text-secondary); font-size: 11px; margin-top: 3px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .meta { color: var(--text-secondary); font-size: 11px; text-align: right; flex-shrink: 0; }
  .cnt { color: var(--accent); font-weight: 600; font-size: 14px; }

  .foot { margin-top: 24px; display: flex; align-items: center; gap: 12px; }
  button {
    font: inherit; padding: 6px 16px; border-radius: 6px; border: none;
    background: var(--accent); color: #fff; font-weight: 500; cursor: pointer;
  }
  button:disabled { opacity: .4; cursor: default; }
  button.ghost { background: transparent; color: var(--text-secondary); border: 1px solid var(--separator); }
  .hint { color: var(--text-secondary); font-size: 11px; }
  .loading { color: var(--text-secondary); padding: 40px 0; text-align: center; }
</style>
</head>
<body>
  <div class="titlebar"></div>
  <div class="wrap">
    <h1>发现文件来源</h1>
    <div class="sub" id="sub">正在扫描本机…</div>
    <div id="list" class="loading">扫描中…</div>
    <div class="foot" id="foot" style="display:none">
      <button id="enable">启用选中的来源</button>
      <button class="ghost" id="skip">全不选</button>
      <span class="hint" id="hint"></span>
    </div>
  </div>

<script>
let sources = [];

async function api(path, opts = {}) {
  const info = await window.inktable.getSidecarInfo();
  if (!info) throw new Error('sidecar 未就绪');
  const r = await fetch(`http://127.0.0.1:${info.port}${path}`, {
    ...opts,
    headers: { ...(opts.headers || {}), Authorization: `Bearer ${info.token}` },
  });
  return r.json();
}

function fmtDate(ts) {
  if (!ts) return '';
  const d = new Date(ts * 1000);
  const days = Math.floor((Date.now() / 1000 - ts) / 86400);
  if (days <= 0) return '今天';
  if (days === 1) return '昨天';
  if (days < 30) return days + ' 天前';
  return (d.getMonth() + 1) + '月' + d.getDate() + '日';
}

function shortPath(p) {
  return p.replace(new RegExp('^/Users/[^/]+'), '~');
}

function render() {
  const listEl = document.getElementById('list');
  listEl.className = 'list';
  listEl.innerHTML = sources.map(function (s, i) {
    return '<div class="item">' +
      '<input class="cb" type="checkbox" data-i="' + i + '"' + (s.doc_count > 0 ? ' checked' : '') + '>' +
      '<div class="info">' +
        '<div class="name">' + s.name + (s.volatile ? '<span class="badge">易失</span>' : '') + '</div>' +
        '<div class="path">' + shortPath(s.path) + '</div>' +
      '</div>' +
      '<div class="meta">' +
        (s.doc_count ? '<div><span class="cnt">' + s.doc_count + '</span> 个文档</div>' : '<div>暂无文档</div>') +
        '<div>' + fmtDate(s.recent_mtime) + '</div>' +
      '</div>' +
    '</div>';
  }).join('');

  document.getElementById('sub').textContent =
    '找到 ' + sources.length + ' 个来源。勾选后才会开始索引 —— 未勾选的目录不会被访问。';
  document.getElementById('foot').style.display = 'flex';
  updateHint();
  listEl.querySelectorAll('.cb').forEach(function (cb) {
    cb.addEventListener('change', updateHint);
  });
}

function updateHint() {
  const checked = [].slice.call(document.querySelectorAll('.cb:checked'));
  const vol = checked.filter(function (cb) { return sources[cb.dataset.i].volatile; }).length;
  document.getElementById('enable').disabled = checked.length === 0;
  document.getElementById('hint').textContent = checked.length === 0 ? '' :
    '已选 ' + checked.length + ' 个' + (vol ? '，其中 ' + vol + ' 个可能被应用自动清理' : '');
}

document.getElementById('skip').onclick = function () {
  document.querySelectorAll('.cb').forEach(function (cb) { cb.checked = false; });
  updateHint();
};

(async function () {
  try {
    const d = await api('/sources/discover', { method: 'POST' });
    sources = d.sources;
    render();
  } catch (e) {
    document.getElementById('list').textContent = '扫描失败：' + e.message;
  }
})();
</script>
</body>
</html>
