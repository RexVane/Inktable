});
// 发现固定盘：只列出盘根，真正递归扫描在用户启用后后台执行。
document.getElementById('btnDeepScan').onclick = async function () {
  var btn = this;
  btn.disabled = true;
  btn.textContent = '正在查找…';
  var hint = document.getElementById('setupHint');
  hint.textContent = '只查找固定磁盘，不读取盘内文件';
  try {
    // 保留用户当前的勾选状态，重渲染后按路径还原
    var checked = {};
    document.querySelectorAll('.src input').forEach(function (cb) {
      checked[sources[cb.dataset.i].path] = cb.checked;
    });
    var r = await api('/sources/discover_deep', { method: 'POST' });
    var known = {};
    try {
      (await api('/sources')).sources.forEach(function (s) { known[s.path] = 1; });
    } catch (e2) {}
    var seen = {};
    sources.forEach(function (s) { seen[s.path] = 1; });
    var added = 0;
    (r.sources || []).forEach(function (s) {
      if (!seen[s.path] && !known[s.path]) { seen[s.path] = 1; sources.push(s); added++; }
    });
    renderSetup();
    document.querySelectorAll('.src input').forEach(function (cb) {
      var p = sources[cb.dataset.i].path;
      // 已有条目还原用户勾选；新发现的文档目录默认全选 ——
      // 目标是"文档应收尽收"，不想要的由用户反选剔除
      if (p in checked) cb.checked = checked[p];
    });
    updateSetupHint();
    hint.textContent = added ? '发现 ' + added + ' 个固定盘' : '没有发现新的固定盘';
  } catch (e) {
    hint.textContent = '发现固定盘失败：' + e.message;
  }
  btn.textContent = '发现固定盘';
  btn.disabled = false;
};

async function previewAndConfirmSource(source, hintEl) {
  var path = String(source.path || '');
  if (source.is_drive_root || /^[A-Za-z]:[\\/]?$/.test(path) ||
      path === '/' || /^\/Volumes\/[^/]+\/?$/.test(path)) return true;
  if (hintEl) hintEl.textContent = '正在预扫描…';
  let p;
  try {
    p = await api('/sources/preview', { method: 'POST', body: JSON.stringify({
      path: source.path,
    }) });
  } catch (e) {
    if (hintEl) hintEl.textContent = '预扫描失败：' + e.message;
    return false;
  }

  const total = p.truncated ? ('至少 ' + safeNumber(p.total_files)) : safeNumber(p.total_files);
  const ok = confirm(
    '准备启用「' + (source.name || '所选目录') + '」\n\n' +
    source.path + '\n\n' +
    '预计文件：' + total + '\n' +
    '可收录文件：' + safeNumber(p.will_index) + '\n' +
    '按类型忽略：' + safeNumber(p.ignored_by_ext) + '\n' +
    '排除目录：' + safeNumber(p.excluded_dirs) + '\n\n' +
    '继续启用并扫描？'
  );
  if (!ok && hintEl) hintEl.textContent = '已取消启用';
  return ok;
}

document.getElementById('btnEnable').onclick = async function () {
  const btn = this;
  btn.disabled = true;
  const hint = document.getElementById('setupHint');
  const chosen = [].slice.call(document.querySelectorAll('.src input:checked'))
    .map(function (cb) { return sources[cb.dataset.i]; });
  let enabled = 0;
  let skipped = 0;
  let scanJobs = [];
  const failures = [];
  for (let i = 0; i < chosen.length; i++) {
    const s = chosen[i];
    btn.textContent = '正在预扫描 ' + (i + 1) + '/' + chosen.length + '…';
    if (!await previewAndConfirmSource(s, hint)) {
      skipped += 1;
      if (hint.textContent.startsWith('预扫描失败')) failures.push(hint.textContent);
      continue;
    }
    btn.textContent = '正在扫描 ' + (i + 1) + '/' + chosen.length + '…';
    try {
      const enabledResult = await api('/sources/enable', { method: 'POST', body: JSON.stringify({
        name: s.name, path: s.path, kind: s.kind,
        discovered_by: s.discovered_by, volatile: s.volatile }) });
      if (enabledResult.job_id) scanJobs.push(enabledResult.job_id);
      enabled += 1;
    } catch (e) {
      skipped += 1;
      const message = '启用「' + String(s.name || '') + '」失败：' + e.message;
      failures.push(message);
      hint.textContent = message;
    }
  }
  if (!enabled) {
    btn.textContent = '启用并开始索引';
    updateSetupHint();
    hint.textContent = failures.length
      ? failures[failures.length - 1]
      : (skipped ? '没有启用来源，可重新选择后再试' : '');
    return;
  }
  // 固定盘扫描已进入后台，先关闭引导并让用户继续使用界面。
  btn.textContent = '已开始后台扫描';
  document.getElementById('setup').style.display = 'none';
  await boot(true);
  try { await api('/watch/start', { method: 'POST' }); } catch (e) {}
  startWatchPolling();
  runIndexing(true);
};

/* 后台索引：解析正文并建全文索引，完成前顶部显示进度 */
let indexingPromise = null;
let indexingRerunRequested = false;

function runIndexing(forceAfterCurrent = false) {
  if (indexingPromise) {
    indexingRerunRequested = indexingRerunRequested || forceAfterCurrent;
    return indexingPromise;
  }
  indexingPromise = drainIndexQueue().finally(function () {
    const rerun = indexingRerunRequested;
    indexingRerunRequested = false;
    indexingPromise = null;
    if (rerun && lastSidecarState === 'ready') runIndexing();
  });
  return indexingPromise;
}

/* 语义向量补齐：模型晚于内容入库时，旧分片没有向量，语义检索
   覆盖不到 —— 解析队列排空后按批补课，补完为止 */
async function drainEmbedBackfill(countEl) {
  // 单批 256：bge-m3 经 Ollama 编码约百级/秒，批太大单个请求拖太久
  let total = 0;
  try {
    let r = await api('/index/embed_backfill', { method: 'POST', body: JSON.stringify({ limit: 256 }) });
    if (r.available === false) return 0;
    total += safeNumber(r.embedded);
    while (safeNumber(r.remaining) > 0 && safeNumber(r.embedded) > 0) {
      countEl.textContent = '正在补齐语义索引，剩余 ' + safeNumber(r.remaining) + ' 片…';
      r = await api('/index/embed_backfill', { method: 'POST', body: JSON.stringify({ limit: 256 }) });
      total += safeNumber(r.embedded);
    }
  } catch (e) { /* 语义补齐失败不阻塞常规使用，下次启动会重试 */ }
  return total;
}

async function drainIndexQueue() {
  const countEl = document.getElementById('count');
  try {
    let st = await api('/index/status');
    let completed = 0;
    while (safeNumber(st.pending) > 0) {
      const pendingBefore = safeNumber(st.pending);
      countEl.textContent = '正在解析 ' + pendingBefore + ' 个文档…';
      const r = await api('/index/run', { method: 'POST', body: JSON.stringify({ limit: 2000 }) });
      completed += safeNumber(r.total);
      const next = await api('/index/status');
      const pendingAfter = safeNumber(next.pending);
      if (pendingAfter >= pendingBefore) {
        countEl.textContent = '索引已暂停：仍有 ' + pendingAfter + ' 个文档待处理';
        toast('索引没有进展，已停止重试');
        return;
      }
      st = next;
    }
    const embedded = await drainEmbedBackfill(countEl);
    if (!completed && !embedded) return;
    const parts = [];
    if (completed) parts.push('已处理 ' + completed + ' 个文档');
    if (embedded) parts.push('补齐语义向量 ' + embedded + ' 片');
    countEl.textContent = parts.join('，') + '，可搜索内容了';
    setTimeout(function () {
      if (!document.getElementById('q').value) load('');
    }, 2500);
  } catch (e) {
    countEl.textContent = '索引暂停，可稍后重试';
    toast('索引失败：' + e.message);
  }
}

/* ---------- 实时监听 ----------
   后端 watcher 在文件落地后自动入库索引（§11.1）。前端做两件事：
   ① 让"它在盯着"这件事可见 —— 顶栏一个常驻小圆点
   ② 新文件进来时刷新列表，并提示一句，不打断当前操作
*/
let liveSeen = 0;          // 上次看到的已入库计数
let livePollTimer = null;
let lastSidecarState = 'starting';
let lastSidecarRevision = -1;
let applicationStarted = false;
let applicationResumePromise = null;
let applicationResumeRequested = false;
let recoveryNoticePending = false;

function setLive(state, text, title) {
  const el = document.getElementById('live');
  el.className = 'live' + (state ? ' ' + state : '');
  document.getElementById('liveText').textContent = text || '';
  el.title = title || '';
}

function setSidecarStatus(info) {
  const el = document.getElementById('sidecarStatus');
  const textEl = document.getElementById('sidecarStatusText');

  // 兼容旧 preload 首次直接给 sidecar:info（{ port, token }）的形式；
  // 新版首次回调来自主进程缓存的 sidecar 状态。
  let state = 'starting';
  if (info && Number.isInteger(Number(info.port)) && Number(info.port) > 0) {
    state = 'ready';
  } else if (info && typeof info.state === 'string') {
    state = info.state;
  }

  const attempt = safeNumber(info && info.attempt);
  const labels = {
    starting: ['正在连接…', '正在启动本地服务'],
    restarting: [attempt > 0 ? ('正在重启（第 ' + attempt + ' 次）…') : '正在重启…', '本地服务正在重启'],
    ready: ['服务已连接', '本地服务运行正常'],
    stopped: ['服务已停止', '本地服务已停止，正在尝试恢复'],
    failed: ['服务不可用', String((info && info.error) || '本地服务启动失败')],
  };
  const entry = labels[state] || ['服务状态未知', '无法识别本地服务状态'];
  const classState = labels[state] ? state : 'stopped';
  if (!el || !textEl) return classState;
  el.className = 'sidecar-status ' + classState;
  textEl.textContent = entry[0];
  el.title = entry[1];
  el.setAttribute('aria-label', entry[1]);
  return classState;
}

function handleSidecarStatus(info) {
  const revision = safeNumber(info && info.revision);
  if (revision > 0 && revision < lastSidecarRevision) return;
  if (revision > 0) lastSidecarRevision = revision;

  const previous = lastSidecarState;
  const state = setSidecarStatus(info);
  lastSidecarState = state;

  if (state === 'ready') {
    if (previous !== 'ready' || (!applicationStarted && !applicationResumePromise)) {
      const recovering = applicationStarted ||
        previous === 'restarting' || previous === 'stopped' || previous === 'failed';
      requestApplicationResume(recovering);
    }
    return;
  }

  // 旧 sidecar 的请求结果不能在断线后覆盖界面；恢复后 boot() 会重新取数。
  loadVersion += 1;
  searchVersion += 1;
  stopWatchPolling();
  liveSeen = 0;
  setLive('off', state === 'starting' ? '等待服务' : '服务中断',
          state === 'failed' ? '本地服务不可用' : '等待本地服务恢复');
}

let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { el.classList.remove('show'); }, 3200);
}

async function pollWatch() {
  try {
    const st = await api('/watch/status');
    const scans = (st.source_scans || []).filter(function (job) {
      return ['queued', 'scanning', 'indexing', 'embedding'].indexOf(job.state) >= 0;
    });
    const progressEl = document.getElementById('count');
    if (scans.length && progressEl) {
      const job = scans[0];
      const phase = job.phase === 'indexing' ? '解析' :
        (job.phase === 'embedding' ? '补齐向量' : '扫描');
      progressEl.textContent = phase + ' ' + safeNumber(job.scanned) +
        ' 个文件，已登记 ' + safeNumber(job.registered) + ' 个';
    }
    const n = st.watched.length;
    if (!st.running || !n) {
      setLive('off', '未监听', '没有已启用的来源');
    } else {
      setLive('', '监听中', n + ' 个目录 · 已自动入库 ' + st.counters.indexed + ' 个文件');
    }

    const done = st.counters.indexed;
    if (liveSeen !== 0 && done > liveSeen) {
      // 有新文件被自动索引了 —— 刷新当前视图并提示
      const latest = st.activity[0];
      const added = done - liveSeen;
      toast(latest && added === 1
        ? '已收录「' + latest.name + '」'
        : '已收录 ' + added + ' 个新文件');

      await runAutoExtClassify(true);
      stats = await api('/stats');
      invalidateTree();
      renderNav();
      const q = document.getElementById('q').value.trim();
      if (q) { doSearch(q); } else { load(''); }
    }
    if (!scans.length && progressEl && progressEl.textContent.indexOf('扫描') === 0) {
      stats = await api('/stats');
      invalidateTree();
      renderNav();
      load(document.getElementById('q').value.trim());
    }
    liveSeen = done;
  } catch (e) {
    setLive('off', '', '监听状态获取失败');
  }
}

function startWatchPolling() {
  if (livePollTimer) return;
  pollWatch();
  livePollTimer = setInterval(pollWatch, 3000);
}

function stopWatchPolling() {
  if (!livePollTimer) return;
  clearInterval(livePollTimer);
  livePollTimer = null;
}

/* 主题化下拉：保留隐藏的原生 <select> 给既有 value/onchange，弹出层自己画。 */
function closeThemedSelects(remove) {
  var open = document.querySelectorAll('.tsel.open');
  for (var i = 0; i < open.length; i++) open[i].classList.remove('open');
  var menus = document.querySelectorAll('body > .tsel-menu');
  for (var j = 0; j < menus.length; j++) {
    menus[j].classList.remove('open');
    if (remove) menus[j].parentNode.removeChild(menus[j]);
  }
}

var themedSelectDismissBound = false;
function mountThemedSelect(select) {
  if (!select || select.dataset.themed === '1') return;
  select.dataset.themed = '1';
  select.classList.add('tsel-native');
  var wrap = document.createElement('div');
  wrap.className = 'tsel';
  select.parentNode.insertBefore(wrap, select);
  wrap.appendChild(select);

  var btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'tsel-btn';
  btn.setAttribute('aria-haspopup', 'listbox');
  wrap.appendChild(btn);

  var menuId = 'tsel-menu-' + (select.id || Math.random().toString(36).slice(2));
  var stale = document.getElementById(menuId);
  if (stale && stale.parentNode) stale.parentNode.removeChild(stale);
  var menu = document.createElement('div');
  menu.id = menuId;
  menu.className = 'tsel-menu';
  menu.setAttribute('role', 'listbox');
  document.body.appendChild(menu);

  function currentLabel() {
    var opt = select.options[select.selectedIndex];
    return opt ? opt.textContent : '';
  }
  function syncBtn() {
    btn.textContent = currentLabel();
  }
  function placeMenu() {
    var r = btn.getBoundingClientRect();
    menu.style.left = r.left + 'px';
    menu.style.width = r.width + 'px';
    var below = window.innerHeight - r.bottom;
    if (below < 168 && r.top > below) {
      menu.style.top = 'auto';
      menu.style.bottom = (window.innerHeight - r.top + 4) + 'px';
    } else {
      menu.style.bottom = 'auto';
      menu.style.top = (r.bottom + 4) + 'px';
    }
  }
  function closeMenu() {
    wrap.classList.remove('open');
    menu.classList.remove('open');
  }
  function rebuild() {
    menu.textContent = '';
    for (var i = 0; i < select.options.length; i++) {
      (function (opt) {
        var item = document.createElement('button');
        item.type = 'button';
        item.className = 'tsel-opt' + (opt.selected ? ' on' : '');
        item.setAttribute('role', 'option');
        item.textContent = opt.textContent;
        item.onclick = function (ev) {
          ev.stopPropagation();
          select.value = opt.value;
          syncBtn();
          closeMenu();
          if (typeof select.onchange === 'function') select.onchange();
        };
        menu.appendChild(item);
      })(select.options[i]);
    }
  }
  function openMenu() {
    closeThemedSelects(false);
    rebuild();
    placeMenu();
    wrap.classList.add('open');
    menu.classList.add('open');
  }
  btn.onclick = function (ev) {
    ev.stopPropagation();
    if (wrap.classList.contains('open')) closeMenu();
    else openMenu();
  };
  var valueDesc = Object.getOwnPropertyDescriptor(HTMLSelectElement.prototype, 'value');
  if (valueDesc && valueDesc.set) {
    Object.defineProperty(select, 'value', {
      configurable: true,
      enumerable: true,
      get: function () { return valueDesc.get.call(select); },
      set: function (v) {
        valueDesc.set.call(select, v);
        syncBtn();
      },
    });
  }
  if (!themedSelectDismissBound) {
    themedSelectDismissBound = true;
    document.addEventListener('click', function (e) {
      var menus = document.querySelectorAll('body > .tsel-menu.open');
      for (var i = 0; i < menus.length; i++) {
        if (!menus[i].contains(e.target)) closeThemedSelects(false);
      }
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') closeThemedSelects(false);
    });
    window.addEventListener('scroll', function () { closeThemedSelects(false); }, true);
  }
  syncBtn();
}

document.getElementById('sheet').addEventListener('keydown', function (event) {
  if (event.key === 'Escape') {
    event.preventDefault();
    // 先关最内层：下拉开着时 Esc 只收下拉，不顺手把整个设置页也关掉
    if (document.querySelector('body > .tsel-menu.open')) {
      closeThemedSelects(false);
      return;
    }
    sheetOpen(false);
    return;
  }
  if (event.key !== 'Tab') return;
  const focusable = [].slice.call(this.querySelectorAll(
    'button:not([disabled]), input:not([disabled]), select:not([disabled]), ' +
    'textarea:not([disabled]), [tabindex]:not([tabindex="-1"])'))
    .filter(function (el) { return el.getClientRects().length > 0; });
  if (!focusable.length) return;
  const first = focusable[0];
  const last = focusable[focusable.length - 1];
  if (event.shiftKey && document.activeElement === first) {
    event.preventDefault();
    last.focus();
  } else if (!event.shiftKey && document.activeElement === last) {
    event.preventDefault();
    first.focus();
  }
});

// 每套主题是一个"家族成员"：跟随系统时在同家族的亮/暗成员之间折算，
// 而不是把用户的选择改掉。Nebula 是刻意独立的深色主题，系统转浅色时
// 借用 Silver 作最接近的中性对偶，但偏好本身仍记为 nebula —— 系统转回
// 深色时会恢复，不会悄悄把用户的选择变成 Steel。
var THEMES = [
  { id: 'nebula', label: 'Nebula', shell: '#222630', card: '#0f111a', accent: '#52a8ff', ink: '#e2e8f0' },
  { id: 'steel', label: 'Steel', shell: '#16181e', card: '#1a1c24', accent: '#94a3b8', ink: '#e2e8f0' },
  { id: 'coal', label: 'Coal', shell: '#161616', card: '#171717', accent: '#d4d4d4', ink: '#e2e8f0' },
  { id: 'moss', label: 'Moss', shell: '#191c19', card: '#1e211e', accent: '#a3b3a3', ink: '#e2e8f0' },
  { id: 'silver', label: 'Silver', shell: '#f3f4f6', card: '#ffffff', accent: '#495057', ink: '#334155' },
  { id: 'limestone', label: 'Limestone', shell: '#f0efeb', card: '#ffffff', accent: '#58554c', ink: '#334155' },
  { id: 'linen', label: 'Linen', shell: '#f2f2ec', card: '#ffffff', accent: '#5f635f', ink: '#334155' }
];
var LIGHT_THEMES = { silver: 1, limestone: 1, linen: 1 };
// 家族对偶表：[浅色成员, 深色成员]
var THEME_PAIRS = {
  nebula: ['silver', 'nebula'],
  silver: ['silver', 'steel'],
  steel: ['silver', 'steel'],
  limestone: ['limestone', 'coal'],
  coal: ['limestone', 'coal'],
  linen: ['linen', 'moss'],
  moss: ['linen', 'moss']
};

function themePref() {
  var v = localStorage.getItem('uiTheme') || 'system';
  // 迁移旧的三档取值：system/light/dark 不再是主题名。
  if (v === 'system') { return 'nebula'; }
  if (v === 'light') { return 'silver'; }
  if (v === 'dark') { return 'nebula'; }
  return THEME_PAIRS[v] ? v : 'nebula';
}

function themeFollowsSystem() {
  var raw = localStorage.getItem('uiTheme');
  // 旧值 'system' 是用户**显式**选过的"跟随系统"，保留该选择。
  // 而从未设置过（raw === null）时不跟随：nebula 自己的
  // follow_system_theme 默认就是 0，首启一律是 Nebula 深蓝旗舰。
  if (raw === 'system') { return true; }
  var f = localStorage.getItem('uiFollowSystem');
  return f === null ? false : f === '1';
}

function resolveTheme(pref, follow, systemIsLight) {
  if (!follow) { return pref; }
  var pair = THEME_PAIRS[pref] || THEME_PAIRS.nebula;
  return systemIsLight ? pair[0] : pair[1];
}

// 主进程只接受 #rrggbb（它会验形后才交给 Electron）。token 本身是 hex
// 字面量，但 getComputedStyle 对某些形式会返回 rgb()，两种都归一化。
function hexFromCss(value) {
  var v = String(value || '').trim();
  if (/^#[0-9a-fA-F]{6}$/.test(v)) { return v.toLowerCase(); }
  if (/^#[0-9a-fA-F]{3}$/.test(v)) {
    return '#' + v.slice(1).split('').map(function (c) { return c + c; }).join('').toLowerCase();
  }
  var m = v.match(/^rgba?\(\s*([\d.]+)[,\s]+([\d.]+)[,\s]+([\d.]+)/);
  if (m) {
    return '#' + [m[1], m[2], m[3]].map(function (n) {
      var i = Math.max(0, Math.min(255, Math.round(parseFloat(n))));
      return (i < 16 ? '0' : '') + i.toString(16);
    }).join('');
  }
  return '';
}

function applyTheme() {
  var systemIsLight = !window.matchMedia('(prefers-color-scheme: dark)').matches;
  var id = resolveTheme(themePref(), themeFollowsSystem(), systemIsLight);
  document.documentElement.setAttribute('data-theme', id);
  // 原生 chrome（右键菜单、原生滚动条）跟着走深浅，否则深色主题下会露出
  // 一圈浅色系统控件。Windows 的窗口控件叠加层还需要**确切颜色** —— 从
  // CSS 现场读出，这样 CSS 始终是唯一颜色来源，加主题不必改主进程。
  if (window.ordo.setTheme) {
    var cs = getComputedStyle(document.documentElement);
    window.ordo.setTheme({
      mode: LIGHT_THEMES[id] ? 'light' : 'dark',
      color: hexFromCss(cs.getPropertyValue('--shell')),
      symbolColor: hexFromCss(cs.getPropertyValue('--ink')),
    });
  }
  return id;
}

function themeCardsHtml(pref, follow) {
  var cards = THEMES.map(function (t) {
    var on = t.id === pref;
    return '<button class="theme-card' + (on ? ' on' : '') + '" type="button" data-theme-id="' +
      t.id + '" title="' + esc(t.label) + '" aria-pressed="' + (on ? 'true' : 'false') + '">' +
      // 迷你预览用该主题**自己**的颜色画：这样选择器回答的是"底色、
      // 文字和高亮怎么搭在一起"，而不只是"面板是什么颜色"。
      '<span class="theme-chip" style="background:' + t.shell + '">' +
        '<span class="theme-chip-card" style="background:' + t.card + '">' +
          '<span class="theme-chip-line" style="background:' + t.ink + '"></span>' +
          '<span class="theme-chip-line short" style="background:' + t.accent + '"></span>' +
        '</span></span>' +
      '<span class="theme-card-name">' + esc(t.label) + '</span></button>';
  }).join('');
  return '<div class="theme-grid' + (follow ? ' follows' : '') + '">' + cards + '</div>';
}

  bindSeg('zoomSeg', function (v) {
    localStorage.setItem('uiZoom', v);
    if (window.ordo.setZoom) window.ordo.setZoom(parseFloat(v));
  });
  bindSeg('followSeg', function (v) {
    localStorage.setItem('uiFollowSystem', v);
    // 首次从旧的 'system' 迁移过来时把偏好落成具体主题名，
    // 否则关掉"跟随"后 themePref() 仍读到旧值。
    localStorage.setItem('uiTheme', themePref());
    applyTheme();
    var grid = pane.querySelector('.theme-grid');
    if (grid) grid.classList.toggle('follows', v === '1');
  });
  Array.prototype.forEach.call(pane.querySelectorAll('.theme-card'), function (btn) {
    btn.addEventListener('click', function () {
      var id = btn.getAttribute('data-theme-id');
      localStorage.setItem('uiTheme', id);
      applyTheme();
      Array.prototype.forEach.call(pane.querySelectorAll('.theme-card'), function (b) {
        var on = b === btn;
        b.classList.toggle('on', on);
        b.setAttribute('aria-pressed', on ? 'true' : 'false');
      });
    });
  });
  bindSeg('autoSeg', function (v) {
    localStorage.setItem('autoClassify', v);
    if (v === '1') runAutoExtClassify(true);
  });
  bindSeg('ocrSeg', async function (v) {
    try {
      await api('/settings/ocr', { method: 'POST',
        body: JSON.stringify({ enabled: v === '1' }) });
      renderSettings();
    } catch (e) { toast('设置失败：' + e.message); }
  });
  bindSeg('ansSeg', async function (v) {
    try {
      await api('/settings/qa', { method: 'POST',
        body: JSON.stringify({ answer_max_tokens: v }) });
    } catch (e) { toast('设置失败：' + e.message); }
  });
  var ocrRetry = document.getElementById('ocrRetry');
  if (ocrRetry) ocrRetry.onclick = async function () {
    ocrRetry.disabled = true;
    try {
      var r = await api('/index/retry_scanned', { method: 'POST' });
      toast(r.requeued ? '已重新排队 ' + r.requeued + ' 个扫描件，正在解析' : '没有待重试的扫描件');
      if (r.requeued) runIndexing(true);
    } catch (e) { toast('失败：' + e.message); }
    ocrRetry.disabled = false;
  };
  bindDataDirRow();
}

async function bindDataDirRow() {
  var label = document.getElementById('dataDirLabel');
  var btn = document.getElementById('dataDirChange');
  if (!label || !btn) return;
  if (!window.ordo.dataGet) {
    label.textContent = '~/Library/Application Support/Ordo';
    btn.style.display = 'none';
    return;
  }
  try {
    var info = await window.ordo.dataGet();
    label.textContent = String(info.dir || '').replace(new RegExp('^/Users/[^/]+'), '~') +
      (info.isDefault ? '（默认）' : '');
  } catch (e) { label.textContent = '读取失败'; }
  btn.onclick = async function () {
    var ok = confirm('更改数据位置？\n\n将把索引数据库、备份和保全副本整体搬到新目录，' +
      '期间本地服务会重启（约几秒）。\n原始文件不受影响。');
    if (!ok) return;
    btn.disabled = true;
    var hint = document.getElementById('sheetHint');
    if (hint) hint.textContent = '正在迁移数据…';
    try {
      var r = await window.ordo.dataChange();
      if (r.canceled) { if (hint) hint.textContent = ''; return; }
      if (r.ok) {
        if (hint) hint.textContent = '';
        toast('数据已迁移到 ' + r.dir);
        bindDataDirRow();
      } else {
        if (hint) hint.textContent = r.error || '迁移失败';
      }
    } catch (e) {
      if (hint) hint.textContent = '迁移失败：' + e.message;
    } finally {
      btn.disabled = false;
    }
  };
}

async function renderSourcesPane(pane) {
  clearTimeout(sourcePaneTimer);
  pane.innerHTML = '<div class="empty" style="padding:30px">加载中…</div>';
  let list;
  try {
    list = (await api('/sources')).sources;
  } catch (e) {
    pane.innerHTML = '<div class="empty" style="padding:30px">加载失败：' + esc(e.message) + '</div>';
    return;
  }

  const on = list.filter(function (s) { return s.enabled; }).length;
  document.getElementById('sheetSub').textContent =
    list.length + ' 个来源 · ' + on + ' 个正在监听';

  if (!list.length) {
    pane.innerHTML = '<div class="empty" style="padding:30px">还没有来源<br>' +
      '<span style="font-size:11px">点「重新发现」自动查找，或手动添加目录</span></div>';
    return;
  }
  pane.innerHTML = list.map(function (s) {
    const tags = [];
    if (s.scan && ['queued', 'scanning', 'indexing'].indexOf(s.scan.state) >= 0) {
      tags.push('<span class="tag">' + (s.scan.phase === 'indexing' ? '解析中' :
        (s.scan.phase === 'embedding' ? '补齐向量中' : '扫描中')) +
        ' · ' + safeNumber(s.scan.scanned) + ' 个</span>');
    } else if (!s.exists) tags.push('<span class="tag gone">目录不存在</span>');
    else if (s.watching) tags.push('<span class="tag live">监听中</span>');
    else if (s.enabled) tags.push('<span class="tag">已启用</span>');
    else tags.push('<span class="tag">已停用</span>');
    if (s.volatile) tags.push('<span class="badge">易失</span>');

    const preserveBtns = s.volatile && s.enabled
      ? '<button class="mini" data-act="autopreserve" data-id="' + esc(s.id) + '" data-on="' + (s.auto_preserve ? 1 : 0) + '">' +
          (s.auto_preserve ? '自动保全:开' : '自动保全:关') + '</button>' +
        '<button class="mini" data-act="preserveall" data-id="' + esc(s.id) + '">立即保全</button>'
      : '';
    const acts = preserveBtns + (s.enabled
      ? '<button class="mini" data-act="disable" data-id="' + esc(s.id) + '">停用</button>'
      : '<button class="mini" data-act="enable" data-id="' + esc(s.id) +
        '" data-path="' + encodedData(s.path) + '" data-name="' + esc(s.name) + '">启用</button>');

    return '<div class="srow">' +
      '<div class="info">' +
        '<div class="nm">' + esc(s.name) + tags.join('') + '</div>' +
        '<div class="pth">' + esc(String(s.path || '').replace(new RegExp('^/Users/[^/]+'), '~')) +
          ' · ' + esc(s.file_count) + ' 个文件</div>' +
      '</div>' +
      '<div class="acts">' + acts +
        '<button class="mini danger" data-act="remove" data-id="' + esc(s.id) +
        '" data-name="' + esc(s.name) + '">移除</button>' +
      '</div></div>';
  }).join('');

  pane.querySelectorAll('button[data-act]').forEach(function (b) {
    b.onclick = function () { onSourceAction(b); };
  });
  if (list.some(function (s) { return s.scan && ['queued', 'scanning', 'indexing'].indexOf(s.scan.state) >= 0; })) {
    sourcePaneTimer = setTimeout(function () {
      if (settingsTab === 'sources' && document.getElementById('sheet').classList.contains('show')) {
        renderSettings();
      }
    }, 1200);
  }
}

var modelPaneGen = 0;
async function renderModelPane(pane) {
  var gen = ++modelPaneGen;
  document.getElementById('sheetSub').textContent = '模型配置：问答 / 知识馆整理 / 向量';
  var savedAll = await window.ordo.llmGet();
  var slots = (savedAll && savedAll.slots) || {};
  // 空表单的 Ollama 预填地址由**后端探测**给出（见 app/config/models.py）：
  // 11434 是官方默认，但 Windows 上常被保留端口段占掉而改口。界面不再自己
  // 猜一个常量，否则 Mac 能拉到模型列表、Windows 静默拉不到。
  var defaultOllama = 'http://127.0.0.1:11434';
  try {
    var probed = await api('/settings/models');
    var anySlot = (probed && probed.slots)
      ? (probed.slots.embedding || probed.slots.library) : null;
    if (anySlot && anySlot.default_ollama) defaultOllama = anySlot.default_ollama;
  } catch (e) {}
  if (gen !== modelPaneGen) return;
  var qa = slots.qa || { provider: 'openai', endpoint: '', model: '', has_key: false };
  var lib = slots.library || { provider: 'ollama', endpoint: '', model: '', has_key: false };
  var emb = slots.embedding || { provider: 'ollama', endpoint: '', model: '', has_key: false };

  function selectHtml(id, options, current) {
    return '<select id="' + id + '">' + options.map(function (opt) {
      return '<option value="' + esc(opt.value) + '"' +
        (current === opt.value ? ' selected' : '') + '>' +
        esc(opt.label) + '</option>';
    }).join('') + '</select>';
  }
  function fieldRow(label, desc, control, extra) {
    extra = extra || {};
    return '<div class="set-row"' +
      (extra.id ? ' id="' + extra.id + '"' : '') +
      (extra.hidden ? ' hidden' : '') + '>' +
      '<div class="set-info"><div class="set-label">' + label + '</div>' +
      (desc ? '<div class="set-desc">' + desc + '</div>' : '') +
      '</div><div class="set-ctl">' + control + '</div></div>';
  }
  function sourceOf(provider, slot) {
    if (provider === 'ollama') return 'ollama';
    if (provider === 'openai' || provider === 'anthropic' || provider === 'responses') return 'api';
    return slot === 'qa' ? 'api' : 'ollama';
  }
  function protocolOf(provider) {
    return (provider === 'anthropic' || provider === 'responses') ? provider : 'openai';
  }
  function sectionHtml(slot, title, desc, cfg, opts) {
    var source = sourceOf(cfg.provider, slot);
    var proto = protocolOf(cfg.provider);
    var api = source === 'api';
    var rows = '';
    if (opts.sourceSelect) {
      rows += fieldRow('来源', opts.sourceDesc || '',
        selectHtml('src_' + slot, [
          { value: 'ollama', label: '本地 Ollama' },
          { value: 'api', label: '云端 / 中转 API' }
        ], source));
    }
    rows += fieldRow('接口地址', '',
      '<input id="ep_' + slot + '" placeholder="' +
        esc(opts.epPlaceholder || '接口地址，如 https://api.xxx.com/v1') +
        '" value="' + esc(cfg.endpoint) + '">');
    if (opts.protocolSelect) {
      rows += fieldRow('协议', '',
        selectHtml('proto_' + slot, [
          { value: 'openai', label: 'Chat Completions' },
          { value: 'responses', label: 'Responses' },
          { value: 'anthropic', label: 'Anthropic Messages' }
        ], proto), { id: 'protoRow_' + slot, hidden: !api });
    }
    if (opts.keyed) {
      rows += fieldRow('API 密钥',
        cfg.has_key ? '当前：已保存' : '当前：未填写',
        '<input id="key_' + slot + '" type="password" placeholder="' +
          (cfg.has_key ? 'API 密钥（已保存，留空表示不变）' : 'API 密钥') + '">',
        { id: 'keyRow_' + slot, hidden: opts.sourceSelect && !api });
    }
    rows += fieldRow('模型', '',
      '<input id="model_' + slot + '" placeholder="模型名" value="' + esc(cfg.model) + '">');
    return '<div class="set-section"><div class="set-title">' + title + '</div>' +
      (desc ? '<div class="set-desc" style="margin:2px 0 8px">' + desc + '</div>' : '') +
      '<div class="llm-form">' + rows +
      '<div class="llm-actions">' +
      '<span class="hint" id="hint_' + slot + '">' + (opts.hint || '') + '</span>' +
      '<button class="mini" id="list_' + slot + '">发现模型</button>' +
      '<button class="mini" id="test_' + slot + '">检测连接</button>' +
      '<button class="mini danger" id="clear_' + slot + '">清除</button>' +
      '<button class="mini" id="save_' + slot + '">保存</button>' +
      '</div><div id="listBox_' + slot + '"></div></div></div>';
  }

  pane.innerHTML =
    sectionHtml('qa', '知识问答',
      '先选本地或云端，再填写接口地址与模型。云端需选择协议并填写密钥',
      qa, { keyed: true, sourceSelect: true, protocolSelect: true,
        sourceDesc: '本地免密钥；云端/中转需填写协议与密钥',
        epPlaceholder: '接口地址，如 https://api.xxx.com/v1',
        hint: llmInfo.configured ? '已保存，检测后即可确认模型可用' : '未配置时问答不可用，其余功能不受影响' }) +
    '<div class="set-section"><div class="set-title">从 cc-switch 导入</div>' +
    '<div class="set-desc" style="margin:4px 0 8px">读取本机 cc-switch 的供应商配置，' +
    '点选一项即可填入上方问答表单（填入后仍需保存并检测连接）</div>' +
    '<div id="ccList"><button class="mini" id="ccLoad">读取 cc-switch 配置</button></div></div>' +
    sectionHtml('library', '知识馆整理（摘要 / 卡片 / 标签 / 文档主题摘要）',
      '选云端即表示允许文档正文发往该服务',
      lib, { keyed: true, sourceSelect: true,
        sourceDesc: '本地 Ollama 或云端 OpenAI 兼容接口',
        epPlaceholder: '接口地址（Ollama 如 ' + defaultOllama + '）' }) +
    sectionHtml('embedding', '向量模型（语义检索 · 本地 Ollama）',
      '嵌入模型输出维度需与向量表 1024 维一致（检测连接会显示维度）；换模型后向量将全量重建',
      emb, { keyed: false, epPlaceholder: 'Ollama 地址，如 ' + defaultOllama });

  if (gen !== modelPaneGen) return;
  ['src_qa', 'proto_qa', 'src_library'].forEach(function (id) {
    mountThemedSelect(document.getElementById(id));
  });
  var ccLoad = document.getElementById('ccLoad');
  if (ccLoad) ccLoad.onclick = loadCcswitchProviders;

  // ---- 通用槽位行为 ----
  function cfgOf(slot) {
    var src = document.getElementById('src_' + slot);
    var proto = document.getElementById('proto_' + slot);
    var provider;
    if (!src) {
      provider = slot === 'qa' ? 'openai' : 'ollama';
    } else if (src.value === 'ollama') {
      provider = 'ollama';
    } else if (proto) {
      provider = proto.value || 'openai';
    } else {
      provider = 'openai';
    }
    return {
      slot: slot,
      provider: provider,
      endpoint: document.getElementById('ep_' + slot).value,
      model: document.getElementById('model_' + slot).value,
      api_key: document.getElementById('key_' + slot)
        ? document.getElementById('key_' + slot).value : '',
    };
  }
  function providerOf(slot) {
    return cfgOf(slot).provider;
  }
  function setHint(slot, text) {
    var el = document.getElementById('hint_' + slot);
    if (el) el.textContent = text;
  }

  // 来源/协议切换：本地隐藏协议与密钥；云端按协议更新地址占位
  function applySourceUi(slot) {
    var src = document.getElementById('src_' + slot);
    if (!src) return;
    var local = src.value === 'ollama';
    var ep = document.getElementById('ep_' + slot);
    var key = document.getElementById('key_' + slot);
    var protoRow = document.getElementById('protoRow_' + slot);
    var keyRow = document.getElementById('keyRow_' + slot);
    var proto = document.getElementById('proto_' + slot);
    if (protoRow) protoRow.hidden = local;
    if (keyRow) keyRow.hidden = local;
    if (local) {
      if (ep && !ep.value) ep.value = defaultOllama;
      if (ep) ep.placeholder = 'Ollama 地址，如 ' + defaultOllama;
      if (key) { key.disabled = true; key.placeholder = '本地 Ollama 无需密钥'; }
      fillModelList(slot, true);
      return;
    }
    var kind = proto ? proto.value : 'openai';
    if (ep) {
      ep.placeholder = kind === 'anthropic'
        ? 'Anthropic 地址，如 https://api.anthropic.com/v1'
        : '接口地址，如 https://api.xxx.com/v1';
    }
    if (key) {
      key.disabled = false;
      key.placeholder = key.dataset.hasKey === '1'
        ? 'API 密钥（已保存，留空表示不变）' : 'API 密钥';
    }
  }
  ['qa', 'library'].forEach(function (slot) {
    var src = document.getElementById('src_' + slot);
    if (!src) return;
    var key = document.getElementById('key_' + slot);
    if (key) key.dataset.hasKey = key.placeholder.indexOf('已保存') >= 0 ? '1' : '0';
    src.onchange = function () { applySourceUi(slot); };
    var proto = document.getElementById('proto_' + slot);
    if (proto) proto.onchange = function () { applySourceUi(slot); };
    applySourceUi(slot);
  });

  async function fillModelList(slot, auto) {
    var box = document.getElementById('listBox_' + slot);
    if (!box) return;
    if (!auto) box.innerHTML = '<span class="hint">拉取中…</span>';
    var cfg = cfgOf(slot);
    try {
      var r = await api('/settings/models/list', {
        method: 'POST',
        body: JSON.stringify({ slot: slot, provider: providerOf(slot),
                               endpoint: cfg.endpoint, api_key: cfg.api_key }) });
      if (!r.models || !r.models.length) {
        if (!auto) box.innerHTML = '<span class="hint">服务端没有返回任何模型</span>';
        return;
      }
      var sel = '<select id="pick_' + slot + '" style="margin-top:8px">' +
        '<option value="">— 选择模型（共 ' + r.models.length + ' 个）—</option>' +
        r.models.map(function (m) {
          return '<option value="' + esc(m) + '"' +
            (m === cfg.model ? ' selected' : '') + '>' + esc(m) + '</option>';
        }).join('') + '</select>';
      box.innerHTML = sel;
      var picker = document.getElementById('pick_' + slot);
      picker.onchange = function () {
        if (this.value) document.getElementById('model_' + slot).value = this.value;
      };
      mountThemedSelect(picker);
    } catch (e) {
      if (!auto) box.innerHTML = '<span class="hint">拉取失败：' + esc(e.message) + '</span>';
    }
  }

  function bindClick(id, fn) {
    var el = document.getElementById(id);
    if (el) el.onclick = fn;
  }
  for (var s = 0; s < 3; s++) {
    (function () {
      var slot = ['qa', 'library', 'embedding'][s];
      bindClick('save_' + slot, async function () {
        var cfg = cfgOf(slot);
        setHint(slot, '保存中…');
        try {
          await window.ordo.llmSet(slot, cfg);
        } catch (e) {
          setHint(slot, '保存失败：' + e.message);
          return;
        }
        if (slot === 'qa') {
          try { updateModelState(await api('/settings/llm')); } catch (e) {}
          setHint('qa', llmInfo.configured ? '已保存，请检测连接' : '配置不完整（地址/密钥/模型都要填）');
        } else {
          setHint(slot, '已保存，请检测连接');
        }
      });
      bindClick('test_' + slot, async function () {
        setHint(slot, '正在检测…');
        try {
          var r = await api('/settings/models/test', {
            method: 'POST', body: JSON.stringify({ slot: slot }) });
          if (slot === 'embedding' && r.dim) {
            setHint(slot, (r.ok ? '✓ ' : '✗ ') + (r.message || '') +
              (r.model ? ' · ' + r.model : '') + ' · ' + r.latency_ms + 'ms');
          } else if (slot === 'qa' && r.available !== undefined) {
            setHint(slot, r.message || (r.available ? '模型连接正常' : '模型不可用'));
            updateModelState(r);
          } else {
            setHint(slot, (r.ok ? '✓ ' : '✗ ') + (r.message || ''));
          }
        } catch (e) {
          setHint(slot, '检测失败：' + e.message);
        }
      });
      bindClick('list_' + slot, function () {
        return fillModelList(slot, false);
      });
      bindClick('clear_' + slot, async function () {
        await window.ordo.llmSet(slot, { clear: true });
        if (slot === 'qa') {
          try { updateModelState(await api('/settings/llm')); } catch (e) {}
        }
        await renderSettings();
      });
    })();
  }

  try {
    // 向量分区：本机 Ollama 自动识别 —— 地址默认值 + 自动拉模型列表
    var embEp = document.getElementById('ep_embedding');
    if (embEp && !embEp.value) embEp.value = defaultOllama;
    fillModelList('embedding', true);
  } catch (e) {}

  try {
    // 启动健康检查里就带本地探测结果（bge-m3 是否在跑），直接展示
    var health = await api('/health');
    var embCheck = (health && health.checks && health.checks.embedding) || {};
    var ok = embCheck.available !== false && embCheck.ok !== false;
    setHint('embedding', ok
      ? '✓ 已检测到 ' + (embCheck.model || 'bge-m3') + '（语义检索开启）'
      : (embCheck.note || '本机 Ollama 未检测到嵌入模型 —— 从上方列表选一个并保存'));
  } catch (e) {}
}

/* cc-switch 导入：列出它管理的供应商，点一项填进 LLM 表单 */
async function loadCcswitchProviders() {
  var box = document.getElementById('ccList');
  if (!box) return;
  box.innerHTML = '<span class="hint">读取中…</span>';
  var r;
  try {
    r = await api('/integrations/ccswitch');
  } catch (e) {
    box.innerHTML = '<span class="hint">读取失败：' + esc(e.message) + '</span>';
    return;
  }
  if (!r.available) {
    box.innerHTML = '<span class="hint">没有找到 cc-switch 配置（~/.cc-switch/cc-switch.db）</span>';
    return;
  }
  if (!r.providers.length) {
    box.innerHTML = '<span class="hint">cc-switch 里没有可转换的供应商</span>';
    return;
  }
  // 按来源应用分组展示，别把几十个供应商糊成一列
  var groupLabels = {
    codex: 'Codex（OpenAI 协议）',
    opencode: 'OpenCode（OpenAI 协议）',
    grokbuild: 'Grok Build（OpenAI 协议）',
    gemini: 'Gemini（按 OpenAI 兼容中转导入）',
    claude: 'Claude Code（Anthropic 协议）',
    'claude-desktop': 'Claude 桌面端（Anthropic 协议）',
  };
  var groupOrder = ['codex', 'opencode', 'grokbuild', 'gemini', 'claude', 'claude-desktop'];
  var grouped = {};
  r.providers.forEach(function (p, i) {
    (grouped[p.app_type] = grouped[p.app_type] || []).push([p, i]);
  });
  var keys = groupOrder.filter(function (k) { return grouped[k]; })
    .concat(Object.keys(grouped).filter(function (k) { return groupOrder.indexOf(k) === -1; }));
  box.innerHTML = keys.map(function (k) {
    return '<div class="cc-group">' + esc(groupLabels[k] || k) +
      ' <span class="gn">' + grouped[k].length + '</span></div>' +
      grouped[k].map(function (entry) {
        var p = entry[0];
        return '<div class="cc-item" data-i="' + entry[1] + '">' +
          '<div class="cc-main"><span class="cc-name">' + esc(p.name) +
            (p.is_current ? ' <span class="tag live">当前</span>' : '') + '</span>' +
          '<span class="cc-meta">' + esc(p.endpoint) +
            (p.model ? ' · ' + esc(p.model) : '') + '</span></div></div>';
      }).join('');
  }).join('');
  var skipped = r.skipped || [];
  if (skipped.length) {
    box.insertAdjacentHTML('beforeend',
      '<div class="set-desc" style="margin-top:8px">另有 ' + skipped.length +
      ' 个未导入：' + skipped.map(function (s) {
        return esc(s.name || '') + '（' + esc(s.app_type || '') + '，' +
          esc(s.reason || '') + '）';
      }).join('；') + '</div>');
  }
  function markSelected(target) {
    box.querySelectorAll('.cc-item.on').forEach(function (x) { x.classList.remove('on'); });
    if (target) target.classList.add('on');
  }

  box.querySelectorAll('.cc-item').forEach(function (it) {
    it.onclick = function () {
      var p = r.providers[+it.dataset.i];
      if (!p) return;
      markSelected(it);
      var format = p.api_format || (p.openai_native ? 'openai' : 'anthropic');
      var src = document.getElementById('src_qa');
      if (src) {
        src.value = 'api';
        if (typeof src.onchange === 'function') src.onchange();
      }
      var proto = document.getElementById('proto_qa');
      if (proto) {
        proto.value = format === 'anthropic' ? 'anthropic' : 'openai';
        if (typeof proto.onchange === 'function') proto.onchange();
      }
      document.getElementById('ep_qa').value = p.endpoint;
      if (p.model) document.getElementById('model_qa').value = p.model;
      // cc-switch secrets never cross the sidecar HTTP boundary. Fill only
      // non-secret metadata; the user pastes the key into Electron's encrypted
      // settings flow explicitly.
      document.getElementById('key_qa').value = '';
      var hint = document.getElementById('hint_qa');
      if (hint) hint.textContent = '已填入「' + p.name + '」（' + format + '）；' +
        '出于密钥安全，请手动粘贴 API Key 后保存并检测连接';
    };
  });

  // 打开列表时自动标出与当前表单一致的供应商，一眼知道现在用的是谁
  var currentEp = (document.getElementById('ep_qa').value || '').trim().replace(/\/+$/, '');
  var currentModel = (document.getElementById('model_qa').value || '').trim();
  if (currentEp) {
    var matched = r.providers.findIndex(function (p) {
      if (p.endpoint.replace(/\/+$/, '') !== currentEp) return false;
      return !p.model || !currentModel || p.model === currentModel;
    });
    if (matched >= 0) {
      markSelected(box.querySelector('.cc-item[data-i="' + matched + '"]'));
    }
  }
}

async function onSourceAction(btn) {
  const act = btn.dataset.act;
  const hint = document.getElementById('sheetHint');
  let sourcePath = null;

  if (act === 'remove') {
    // 破坏性操作要说清后果：会清索引，但不会动磁盘上的文件
    const ok = confirm('移除「' + btn.dataset.name + '」？\n\n' +
      '将清除它的文件记录与搜索索引。\n磁盘上的原文件不会被删除。');
    if (!ok) return;
  }

  btn.disabled = true;
  if (act === 'enable') {
    sourcePath = decodeURIComponent(btn.dataset.path);
    const ok = await previewAndConfirmSource({ name: btn.dataset.name, path: sourcePath }, hint);
    if (!ok) {
      btn.disabled = false;
      return;
    }
  }
  hint.textContent = '处理中…';
  try {
    if (act === 'autopreserve') {
      await api('/sources/auto_preserve', { method: 'POST', body: JSON.stringify({
        source_id: +btn.dataset.id, enabled: btn.dataset.on !== '1' }) });
      hint.textContent = '';
      await renderSettings();
      return;
    } else if (act === 'preserveall') {
      hint.textContent = '正在复制…';
      const r = await api('/sources/preserve_all', { method: 'POST', body: JSON.stringify({
        source_id: +btn.dataset.id }) });
      hint.textContent = '已保全 ' + r.preserved + ' 个' + (r.failed ? '，失败 ' + r.failed : '');
      btn.disabled = false;
      return;
    } else if (act === 'disable') {
      await api('/sources/disable', { method: 'POST', body: JSON.stringify({ source_id: +btn.dataset.id }) });
    } else if (act === 'remove') {
      await api('/sources/remove', { method: 'POST', body: JSON.stringify({ source_id: +btn.dataset.id }) });
    } else if (act === 'enable') {
      await api('/sources/enable', { method: 'POST', body: JSON.stringify({
        name: btn.dataset.name, path: sourcePath }) });
      runIndexing();
    }
    hint.textContent = '';
    await renderSettings();
    stats = await api('/stats');
    await refreshCats();
    invalidateTree();
    renderNav();
    await runAutoExtClassify(true);
    await load(document.getElementById('q').value.trim());
    pollWatch();
  } catch (e) {
    hint.textContent = '失败：' + e.message;
    btn.disabled = false;
  }
}

document.getElementById('gear').onclick = function () { sheetOpen(true); };
document.getElementById('backToList').onclick = function () { showListPage(); };
document.getElementById('qaClear').onclick = function () { resetQaThread(); };
document.getElementById('qaJournal').onclick = function () {
  journalOpen = !journalOpen;
  if (journalOpen) renderJournal('');
  else renderQaThread();
};
document.getElementById('modelState').onclick = function () {
  if (!llmInfo.configured) return sheetOpen(true, 'model');
  return testModelConnection();
};
document.getElementById('querySubmit').onclick = function () {
  executeQuery(document.getElementById('q').value.trim());
};
document.getElementById('askSubmit').onclick = function () {
  runAsk(document.getElementById('askQ').value);
};
/* 回答档位：快速 = 单轮轻量管线（确定性引用校验、无模型重试）；
   深度 = 全量检索 + 逐条引用校验（默认）。选择存 localStorage */
var qaMode = localStorage.getItem('qaMode') === 'quick' ? 'quick' : 'deep';
function applyQaMode() {
  document.getElementById('qaModeQuick').classList.toggle('active', qaMode === 'quick');
  document.getElementById('qaModeDeep').classList.toggle('active', qaMode === 'deep');
  document.getElementById('composerHint').textContent = qaMode === 'quick'
    ? 'Enter 发送 · Shift+Enter 换行 · 单轮回答（保留确定性引用校验）'
    : 'Enter 发送 · Shift+Enter 换行 · 带可溯源引用（逐条校验）';
  localStorage.setItem('qaMode', qaMode);
}
document.getElementById('qaModeQuick').onclick = function () { qaMode = 'quick'; applyQaMode(); };
document.getElementById('qaModeDeep').onclick = function () { qaMode = 'deep'; applyQaMode(); };
applyQaMode();
document.getElementById('askQ').onkeydown = function (event) {
  if (event.key === 'Enter' && !event.shiftKey) {
    event.preventDefault();
    if (!document.getElementById('askSubmit').disabled) runAsk(event.target.value);
  }
};
document.getElementById('askQ').oninput = function (event) {
  // 输入框随内容自动长高，上限 140px
  var box = event.target;
  box.style.height = 'auto';
  box.style.height = Math.min(box.scrollHeight, 140) + 'px';
};
document.getElementById('btnClose').onclick = function () { sheetOpen(false); };
document.getElementById('sheet').onclick = function (e) {
  if (e.target.id === 'sheet') sheetOpen(false);   // 点遮罩关闭
};

async function addDirectorySource(nameHint) {
  const dir = await window.ordo.pickDirectory();
  if (!dir) return;
  const hint = document.getElementById('sheetHint');
  const base = dir.split(/[\\/]/).filter(Boolean).slice(-1)[0] || '所选目录';
  const source = { name: nameHint || base, path: dir };
  if (!await previewAndConfirmSource(source, hint)) return;
  hint.textContent = '正在扫描…';
  try {
    await api('/sources/add', { method: 'POST',
      body: JSON.stringify({ path: dir, name: nameHint || null }) });
    hint.textContent = '';
    await renderSettings();
    stats = await api('/stats');
    invalidateTree();
    renderNav();
    await runAutoExtClassify(true);
    await load('');
    runIndexing();
    pollWatch();
  } catch (e) {
    hint.textContent = '添加失败：' + e.message;
  }
}

document.getElementById('btnAdd').onclick = function () { addDirectorySource(null); };

document.getElementById('btnRescan').onclick = async function () {
  const hint = document.getElementById('sheetHint');
  hint.textContent = '正在查找…';
  try {
    const found = (await api('/sources/discover', { method: 'POST' })).sources;
    const known = new Set((await api('/sources')).sources.map(function (s) { return s.path; }));
    // 噪音抑制在后端发现阶段完成（工作应用/旧版路径需有文档才上报），
    // 这里只过滤已登记的 —— 下载/QQ 这类明确入口即使暂无文档也要能启用
    const fresh = found.filter(function (s) { return !known.has(s.path); });
    hint.textContent = '';
    // 发现结果不自动启用 —— §1 约束 4：用户没同意的目录不监听。
    // 没有新来源也要打开弹层：「全盘发现」在弹层里，入口不能堵死。
    sources = fresh;
    sheetOpen(false);
    document.getElementById('setup').style.display = 'flex';
    renderSetup();
    if (!fresh.length) {
      document.getElementById('setupSub').textContent =
        '没有发现新的磁盘。启用磁盘后，盘内目录会按真实路径展开。';
    }
  } catch (e) {
    hint.textContent = '查找失败：' + e.message;
  }
};

document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') {
    var sheetShown = document.getElementById('sheet').classList.contains('show');
    sheetOpen(false);
    // 设置面板没开时，Esc 从详情页退回文件列表
    if (!sheetShown && detailPageOpen) showListPage();
  }
  if ((e.metaKey || e.ctrlKey) && e.key === ',') { e.preventDefault(); sheetOpen(true); }
  if (e.key === 'Enter' && e.target && e.target.id === 'q') {
    e.preventDefault();
    executeQuery(e.target.value.trim());
  }
  if ((e.metaKey || e.ctrlKey) && e.key === 'f') {
    e.preventDefault();
    if (detailPageOpen) showListPage();
    document.getElementById('q').focus();
    document.getElementById('q').select();
  }
  // 抽屉开合。Ctrl+1/2 对应左右两栏，与顶栏按钮同一入口。
  if ((e.metaKey || e.ctrlKey) && (e.key === '1' || e.key === '2')) {
    if (typeof window.toggleDrawer === 'function') {
      e.preventDefault();
      window.toggleDrawer(e.key === '1' ? 'nav' : 'qa');
    }
  }
});

async function boot(skipSetup = false) {
  stats = await api('/stats');
  await refreshCats();
  try { updateModelState(await api('/settings/llm')); } catch (e) { updateModelState({ configured: false }); }
  // 启动即后台检测模型可用性（真实补全探测），不阻塞界面
  scheduleModelAutoCheck();
  if (stats.files === 0 && !skipSetup) {
    document.getElementById('setup').style.display = 'flex';
    sources = (await api('/sources/discover', { method: 'POST' })).sources;
    renderSetup();
    return { hasFiles: false };
  }
  document.getElementById('setup').style.display = 'none';
  await runAutoExtClassify(false);
  renderNav();
  updateWorkbenchChrome();
  const q = document.getElementById('q').value.trim();
  if (q) await executeQuery(q);
  else await load('');
  // 每周报告：本周还没有就后台生成一份（幂等，同周复用）
  api('/reports/weekly').then(function (r) {
    if (r && r.generated) toast('本周知识库报告已生成，见左栏「本周报告」');
  }).catch(function () {});
  return { hasFiles: true };
}

function requestApplicationResume(recovered) {
  applicationResumeRequested = true;
  recoveryNoticePending = recoveryNoticePending || recovered;
  if (applicationResumePromise) return applicationResumePromise;

  applicationResumePromise = (async function () {
    while (applicationResumeRequested && lastSidecarState === 'ready') {
      applicationResumeRequested = false;
      const showRecoveryNotice = recoveryNoticePending;
      recoveryNoticePending = false;

      try {
        const state = await boot();
        if (lastSidecarState !== 'ready') {
          applicationResumeRequested = true;
          return;
        }
        applicationStarted = true;

        // 恢复后重新挂上来源监听、重建轮询并续跑索引；后端接口均幂等。
        try { await api('/watch/start', { method: 'POST' }); } catch (e) {}
        if (state.hasFiles) {
          startWatchPolling();
          runIndexing(showRecoveryNotice);
        }
        if (showRecoveryNotice) toast('本地服务已恢复');
      } catch (e) {
        if (lastSidecarState === 'ready') {
          setSidecarStatus({ state: 'failed', error: e.message });
          document.getElementById('rows').innerHTML =
            '<div class="empty">启动失败：' + esc(e.message) + '</div>';
        }
        return;
      }
    }
  })().finally(function () {
    applicationResumePromise = null;
    if (applicationResumeRequested && lastSidecarState === 'ready') {
      requestApplicationResume(recoveryNoticePending);
    }
  });
  return applicationResumePromise;
}

// 启动即应用保存的界面偏好（缩放 / 主题）；旧 preload 没有这些桥则跳过
try {
  if (window.ordo.setZoom) {
    window.ordo.setZoom(parseFloat(localStorage.getItem('uiZoom') || '1') || 1);
  }
  applyTheme();
  // 跟随系统时，系统外观变化要当场重算家族成员（不必重启）。
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () {
    if (themeFollowsSystem()) applyTheme();
  });
} catch (e) { /* 界面偏好失败不影响主流程 */ }

// 恢复上次的问答会话
restoreQaThread();
initSplitters();

// 全局快捷键（⌥Space）呼出 → 回列表页并聚焦搜索框
if (window.ordo.onFocusSearch) {
  window.ordo.onFocusSearch(function () {
    if (detailPageOpen) showListPage();
    var q = document.getElementById('q');
    q.focus();
    q.select();
  });
}

if (window.ordo && typeof window.ordo.onSidecar === 'function') {
  window.ordo.onSidecar(handleSidecarStatus);
} else {
  // 开发/旧 preload 兼容：若能直接取得可用连接信息，仍可正常启动。
  window.ordo.getSidecarInfo().then(function (info) {
    handleSidecarStatus(info || { state: 'failed', error: 'sidecar 未就绪' });
  });
}
</script>
