<style>

  * { box-sizing: border-box; }
  /* color-scheme 由各主题块自己声明（深色四套 dark、浅色三套 light）， */
  /* 这里不再写 light dark，否则原生滚动条会跟系统而不是跟主题。 */
  body { margin: 0; height: 100vh; overflow: hidden; -webkit-user-select: none; }

<script>
// 首帧前定妥主题，否则浅色主题用户会先看到一帧默认的 Nebula 深色。
// 只做 data-theme 这一件事；完整的主题引擎在下方主脚本里（同一套折算规则，
// 这里刻意重复而不抽函数——主脚本在 </body> 之后才执行，抽不出来）。
(function () {
  try {
    var pairs = {
      nebula: ['silver', 'nebula'], silver: ['silver', 'steel'],
      steel: ['silver', 'steel'], limestone: ['limestone', 'coal'],
      coal: ['limestone', 'coal'], linen: ['linen', 'moss'],
      moss: ['linen', 'moss']
    };
    var raw = localStorage.getItem('uiTheme');
    var pref = raw === 'light' ? 'silver'
      : (raw === 'dark' || raw === 'system' || raw === null || !pairs[raw]) ? 'nebula' : raw;
    var f = localStorage.getItem('uiFollowSystem');
    // 与主脚本 themeFollowsSystem() 同一判据：仅显式的旧值 'system' 跟随，
    // 未设置过则用 nebula 的默认（不跟随，Nebula 深蓝）。
    var follow = raw === 'system' ? true : (f === null ? false : f === '1');
    var id = pref;
    if (follow) {
      id = window.matchMedia('(prefers-color-scheme: dark)').matches
        ? pairs[pref][1] : pairs[pref][0];
    }
    document.documentElement.setAttribute('data-theme', id);
  } catch (e) { /* 取不到偏好就用默认 Nebula */ }
})();
</script>

<script>
// 平台类：非 macOS 没有窗口红绿灯，CSS 据此去掉预留空隙（见 workbench.css 平台适配段）
document.documentElement.classList.add(
  'is-' + ((window.ordo && window.ordo.platform) || 'unknown'));

const PAGE_SIZE = 300;
let sources = [], files = [], activeSource = null, stats = null;
let categories = { tree: [], unclassified: 0 };
let activeCategory = null;   // 数字=分类id, 'none'=未分类, null=不过滤
let books = [];
let activeBook = null;
let activeExt = null;        // null=不过滤，空字符串=无扩展名
let activeDir = null;        // 文件树目录过滤（绝对路径前缀）
let activeRecent = null;     // 时间线：7=最近一周，30=最近一月
let activeDuplicate = false;
let filesTotal = 0;
let currentQuery = '';
let loadVersion = 0;
let searchVersion = 0;
let llmInfo = { configured: false };
let selectedEvidence = null;
let detailVersion = 0;
let autoClassifyPending = null;

function initSplitters() {
  var layout = document.querySelector('.content-layout');
  var splitNav = document.getElementById('splitNav');
  var splitQa = document.getElementById('splitQa');
  if (!layout || !splitNav || !splitQa) return;

  var navWidth = 214;
  var qaWidth = 330;
  // 抽屉开合与宽度分开存：收起再展开要回到用户自己拖出来的宽度，
  // 而不是回到默认值。
  var navOpen = true;
  var qaOpen = true;
  try {
    var saved = JSON.parse(localStorage.getItem('layoutCols') || '{}') || {};
    if (saved.nav) navWidth = Math.max(160, Math.min(360, saved.nav));
    if (saved.qa) qaWidth = Math.max(260, Math.min(520, saved.qa));
    if (saved.navOpen === false) navOpen = false;
    if (saved.qaOpen === false) qaOpen = false;
  } catch (e) {}

  var navPanel = document.getElementById('navPanel');
  var qaPanel = document.getElementById('qaPanel');
  var toggleNav = document.getElementById('toggleNav');
  var toggleQa = document.getElementById('toggleQa');

  function save() {
    try {
      localStorage.setItem('layoutCols', JSON.stringify({
        nav: navWidth, qa: qaWidth, navOpen: navOpen, qaOpen: qaOpen,
      }));
    } catch (e) {}
  }

  function updateCols() {
    // 收起的那栏连同它的 splitter 一起归零：留着 5px 的拖拽条会在贴边处
    // 留下一道摸不到来源的缝。
    layout.style.gridTemplateColumns =
      (navOpen ? navWidth + 'px 5px' : '0px 0px') +
      ' minmax(360px, 1fr) ' +
      (qaOpen ? '5px ' + qaWidth + 'px' : '0px 0px');
    // visibility 而不是只靠 overflow：0 宽的栏里若还留着可聚焦控件，
    // Tab 会跳进一个看不见的地方。
    if (navPanel) navPanel.classList.toggle('is-collapsed', !navOpen);
    if (qaPanel) qaPanel.classList.toggle('is-collapsed', !qaOpen);
    splitNav.classList.toggle('is-collapsed', !navOpen);
    splitQa.classList.toggle('is-collapsed', !qaOpen);
    splitNav.tabIndex = navOpen ? 0 : -1;
    splitQa.tabIndex = qaOpen ? 0 : -1;
    splitNav.setAttribute('aria-valuenow', String(Math.round(navWidth)));
    splitQa.setAttribute('aria-valuenow', String(Math.round(qaWidth)));
    if (toggleNav) {
      toggleNav.classList.toggle('on', navOpen);
      toggleNav.setAttribute('aria-expanded', navOpen ? 'true' : 'false');
    }
    if (toggleQa) {
      toggleQa.classList.toggle('on', qaOpen);
      toggleQa.setAttribute('aria-expanded', qaOpen ? 'true' : 'false');
    }
  }
  updateCols();

  window.toggleDrawer = function (which) {
    if (which === 'nav') navOpen = !navOpen;
    else qaOpen = !qaOpen;
    updateCols();
    save();
  };

  if (toggleNav) toggleNav.addEventListener('click', function () { window.toggleDrawer('nav'); });
  if (toggleQa) toggleQa.addEventListener('click', function () { window.toggleDrawer('qa'); });

  function startDrag(e, isNav) {
    e.preventDefault();
    var startX = e.clientX;
    var startNav = navWidth;
    var startQa = qaWidth;
    document.body.classList.add('resizing');

    function onMove(ev) {
      if (isNav) {
        navWidth = Math.max(160, Math.min(360, startNav + (ev.clientX - startX)));
      } else {
        qaWidth = Math.max(260, Math.min(520, startQa - (ev.clientX - startX)));
      }
      updateCols();
    }

    function onUp() {
      document.body.classList.remove('resizing');
      window.removeEventListener('mousemove', onMove);
      window.removeEventListener('mouseup', onUp);
      save();
    }

    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);
  }

  splitNav.addEventListener('mousedown', function (e) { startDrag(e, true); });
  splitQa.addEventListener('mousedown', function (e) { startDrag(e, false); });

  function resizeWithKeyboard(event, isNav) {
    var min = isNav ? 160 : 260;
    var max = isNav ? 360 : 520;
    var value = isNav ? navWidth : qaWidth;
    var step = event.shiftKey ? 30 : 10;
    if (event.key === 'Home') value = min;
    else if (event.key === 'End') value = max;
    else if (event.key === 'ArrowLeft') value += isNav ? -step : step;
    else if (event.key === 'ArrowRight') value += isNav ? step : -step;
    else return;
    event.preventDefault();
    value = Math.max(min, Math.min(max, value));
    if (isNav) navWidth = value;
    else qaWidth = value;
    updateCols();
    save();
  }
  splitNav.addEventListener('keydown', function (e) { resizeWithKeyboard(e, true); });
  splitQa.addEventListener('keydown', function (e) { resizeWithKeyboard(e, false); });
}

function currentScopeLabel() {
  if (activeBook !== null) {
    var book = books.find(function (item) { return item.id === activeBook; });
    return book ? ('文件书 · ' + book.name) : '当前文件书';
  }
  if (activeSource !== null) return '来源 · ' + activeSource;
  if (activeCategory !== null) {
    if (activeCategory === 'none') return '未分类资料';
    var category = categories.tree.find(function (item) { return item.id === activeCategory; });
    return category ? ('分类 · ' + category.name) : '当前分类';
  }
  if (activeDir !== null) {
    var segs = activeDir.split(/[\\/]/).filter(Boolean);
    return '目录 · ' + (segs[segs.length - 1] || activeDir);
  }
  if (activeRecent === 7) return '最近一周';
  if (activeRecent === 30) return '最近一月';
  if (activeExt !== null) return '类型 · ' + (activeExt || '无扩展名');
  if (activeDuplicate) return '重复内容';
  return '全部内容';
}

function updateWorkbenchChrome() {
  var scope = currentScopeLabel();
  document.getElementById('topbarScope').textContent = scope;
  document.getElementById('q').placeholder = '搜索文件内容或文件名…';
  document.getElementById('querySubmit').title = '搜索';
  document.getElementById('querySubmit').setAttribute('aria-label', '搜索');
}

function updateModelState(status) {
  llmInfo = status || { configured: false };
  var button = document.getElementById('modelState');
  var submit = document.getElementById('askSubmit');
  if (!button || !submit) return;
  if (llmInfo.available === true) {
    button.className = 'model-state ready';
    button.textContent = '模型可用';
    button.title = (llmInfo.model || '当前模型') + '连接正常';
    submit.disabled = false;
  } else if (llmInfo.available === false && llmInfo.configured) {
    button.className = 'model-state error';
    button.textContent = llmInfo.message || '模型不可用';
    button.title = '点击重新检测连接';
    submit.disabled = true;
  } else if (llmInfo.configured) {
    button.className = 'model-state pending';
    button.textContent = '检测模型';
    button.title = '已配置，点击检测连接';
    submit.disabled = true;
  } else {
    button.className = 'model-state off';
    button.textContent = '未配置模型';
    button.title = '点击打开模型设置';
    submit.disabled = true;
  }
}

/* 启动/服务恢复后自动检测模型可用性 —— 不阻塞启动流程，
   后台跑一次真实补全探测，右上角状态直接给出可用/不可用结论 */
let modelAutoCheckPending = false;

function scheduleModelAutoCheck() {
  if (modelAutoCheckPending) return;
  if (!llmInfo.configured || llmInfo.available === true) return;
  modelAutoCheckPending = true;
  testModelConnection().finally(function () {
    modelAutoCheckPending = false;
  });
}

async function testModelConnection(hint) {
  var button = document.getElementById('modelState');
  button.className = 'model-state checking';
  button.textContent = '检测中…';
  button.disabled = true;
  if (hint) hint.textContent = '正在检测模型连接…';
  try {
    var status = await api('/settings/llm/test', { method: 'POST' });
    updateModelState(status);
    if (hint) hint.textContent = status.message || (status.available ? '模型连接正常' : '模型不可用');
    return status;
  } catch (e) {
    var failed = { configured: llmInfo.configured, available: false, code: 'unreachable', message: '检测失败：' + e.message };
    updateModelState(failed);
    if (hint) hint.textContent = failed.message;
    return failed;
  } finally {
    button.disabled = false;
  }
}

function renderKnowledgeEmpty() {
  document.getElementById('count').textContent = '';
  document.getElementById('rows').innerHTML = '<div class="workbench-empty"><div><div class="empty-mark"><svg viewBox="0 0 24 24"><path d="M10 18a8 8 0 100-16 8 8 0 000 16zm11 3l-6-6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg></div><div class="empty-title">没有内容</div></div></div>';
  clearEvidence();
}

/* 中栏两页切换：列表页（搜索框 + 文件列表）⇄ 详情页（原文/证据 + 返回键）。
   左栏只放导航，不再出现上下两个滚动区互相遮挡 */
let listTitle = '文件管理';
let detailPageOpen = false;

function setListTitle(t) {
  listTitle = t;
  if (!detailPageOpen) document.getElementById('resultsTitle').textContent = t;
}

function showListPage() {
  detailPageOpen = false;
  readerState = null;
  var evidence = document.getElementById('evidence');
  evidence.style.display = 'none';
  evidence.onscroll = null;
  document.getElementById('rows').style.display = '';
  document.getElementById('fileSearch').style.display = '';
  document.getElementById('backToList').style.display = 'none';
  document.getElementById('count').style.display = '';
  document.getElementById('resultsTitle').textContent = listTitle;
}

function showDetailPage(title) {
  detailPageOpen = true;
  readerState = null;
  var evidence = document.getElementById('evidence');
  evidence.onscroll = null;
  document.getElementById('rows').style.display = 'none';
  document.getElementById('fileSearch').style.display = 'none';
  evidence.style.display = '';
  document.getElementById('backToList').style.display = '';
  document.getElementById('count').style.display = 'none';
  document.getElementById('resultsTitle').textContent = title || '文件详情';
}

function clearEvidence() {
  selectedEvidence = null;
  document.getElementById('evidence').innerHTML = '';
  showListPage();
}

function showEvidence(evidence) {
  if (!evidence) return clearEvidence();
  selectedEvidence = evidence;
  showDetailPage(evidence.name || evidence.file_name || '原文片段');
  var location = evidence.page ? ('第 ' + evidence.page + ' 页') : (evidence.section_path || evidence.locator || '原文片段');
  var path = evidence.path || evidence.file_path || '';
  var fileId = evidence.file_id || null;
  document.getElementById('evidence').innerHTML = '<div class="evidence-document">' +
    '<div class="evidence-document-head"><div class="evidence-name">' + esc(evidence.name || evidence.file_name || '未命名文档') + '</div>' +
    '<div class="evidence-locator">' + esc(location) + '</div></div>' +
    '<div class="evidence-text">' + esc(evidence.text || evidence.snippet || '没有可显示的原文片段。') + '</div>' +
    ((path || fileId) ? '<div class="evidence-actions">' +
      (fileId ? '<button class="text-button" id="openEvidenceDetail" type="button">查看文件详情</button>' : '') +
      (path ? '<button class="text-button" id="revealEvidence" type="button">在 Finder 中显示</button>' : '') +
      '</div>' : '') +
    '</div>';
  var button = document.getElementById('revealEvidence');
  if (button) button.onclick = function () { window.ordo.revealInFinder(path); };
  var detailButton = document.getElementById('openEvidenceDetail');
  if (detailButton) detailButton.onclick = function () {
    showFileDetail({ file_id: fileId, name: evidence.file_name, path: path },
                   { page: evidence.page, snippet: evidence.text || evidence.snippet || '' });
  };
}

function detailSectionHtml(section) {
  var location = section.page ? ('第 ' + section.page + ' 页') :
    (section.section_path || section.locator || section.title || '正文片段');
  return '<article class="detail-section">' +
    '<div class="detail-section-locator">' + esc(location) + '</div>' +
    '<div class="detail-section-text">' + esc(section.text || '没有可显示的正文。') + '</div>' +
    '</article>';
}

function renderFileDetail(detail) {
  var file = detail.file || {};
  var documentInfo = detail.document || {};
  var path = file.preserved_path || file.path || '';
  var meta = [file.ext || file.mime, fmtSize(file.size), file.source && file.source.name, fmtDate(file.mtime)]
    .filter(Boolean).join(' · ');
  document.getElementById('evidence').innerHTML = '<div class="file-detail">' +
    '<div class="file-detail-head"><div class="evidence-name">' + esc(file.name || documentInfo.title || '未命名文档') + '</div>' +
    '<div class="file-detail-meta">' + esc(meta || '文件详情') + '</div>' +
    (path ? '<div class="file-detail-path">' + esc(path) + '</div>' : '') +
    ((documentInfo.summary_text || documentInfo.summary) ? '<div class="file-summary">' + esc(documentInfo.summary_text || documentInfo.summary) + '</div>' : '') +
    '<div class="detail-actions">' +
      (path ? '<button class="text-button" id="openFileBtn" type="button">用默认应用打开</button>' +
      '<button class="text-button" id="revealEvidence" type="button">在 Finder 中显示</button>' : '') +
      '<button class="text-button danger" id="trashFileBtn" type="button">删除文件</button>' +
    '</div></div>' +
    (viewerKindOf(file.ext || file.name)
      ? '<div class="view-toggle" id="viewToggle">' +
        '<button class="vt-btn" id="vtOriginal" type="button">原文</button>' +
        '<button class="vt-btn" id="vtText" type="button">提取文本</button>' +
        '<span class="vt-hint" id="vtHint"></span></div>' : '') +
    '<div class="detail-sections" id="readerBody"></div>' +
    '<div class="detail-more" id="readerFoot"></div></div>';
  var button = document.getElementById('revealEvidence');
  if (button) button.onclick = function () { window.ordo.revealInFinder(path); };
  var openBtn = document.getElementById('openFileBtn');
  if (openBtn) openBtn.onclick = function () {
    if (window.ordo.openPath) window.ordo.openPath(path);
    else window.ordo.revealInFinder(path);
  };
  var trashBtn = document.getElementById('trashFileBtn');
  if (trashBtn) trashBtn.onclick = function () {
    trashFile({ file_id: file.id, name: file.name });
  };
  // 可渲染原版式的文件（PDF / DOCX / Markdown / 纯文本 / CSV）默认打开原文
  // 视图，可切提取文本；其余格式走全文文本 reader（滚到底自动续载）
  var kind = viewerKindOf(file.ext || file.name);
  if (kind) {
    var setView = function (view) {
      document.getElementById('vtOriginal').classList.toggle('on', view === 'original');
      document.getElementById('vtText').classList.toggle('on', view === 'text');
      if (view === 'original') {
        openOriginal(file.id, file.name || '', pendingJump);
      } else {
        stopOriginalView();   // 停掉网络、PDF worker、观察器和异步回写
        setHint('vtHint', '');
        startReader(file.id, Array.isArray(detail.sections) ? detail.sections : []);
      }
    };
    document.getElementById('vtOriginal').onclick = function () { setView('original'); };
    document.getElementById('vtText').onclick = function () { setView('text'); };
    setView('original');
    pendingJump = null;
  } else {
    // 文件查看器：从头分页拉全文，滚到底自动续载；详情接口的
    // 前 24 段仅作为 /content 不可用时的兜底
    startReader(file.id, Array.isArray(detail.sections) ? detail.sections : []);
  }
}

/* ---------- 原文查看器（ordodoc:// + PDF.js / docx-preview / marked） ----------
   字节通道：主进程 ordodoc:// 协议（每次请求过 sidecar 授权）。
   PDF：页面 canvas 懒渲染（滚到才画），引用按页码直达 + 文字层定位高亮。
   DOCX：docx-preview 保版式渲染，按片段文本定位高亮。
   MD：marked 渲染 + DOMPurify 消毒（md 是用户文件内容，可以内嵌脚本）。
   TXT：等宽 pre，保留换行与缩进，textContent 不走 HTML 解析。
   CSV：按 RFC 4180 解析后建 table，单元格逐个 textContent。
   其余格式（html/xlsx/pptx…）仍走提取文本 reader。
   所有文本类格式的解码顺序与后端 parsers.py 一致，见 decodeBytes()。 */
var pendingJump = null;      // 待定位的引用 {page, snippet}
var originalViewToken = 0;   // 切换视图/切换文件后使未完成的渲染作废
var pdfjsLibPromise = null;
var activeOriginalCleanup = null;
var MAX_DOCX_VIEW_BYTES = 64 * 1024 * 1024;
var MAX_IPC_ORIGINAL_BYTES = 16 * 1024 * 1024;

function releaseOriginalResources() {
  var cleanup = activeOriginalCleanup;
  activeOriginalCleanup = null;
  if (typeof cleanup === 'function') {
    try { cleanup(); } catch (e) {}
  }
}

function stopOriginalView() {
  originalViewToken++;
  releaseOriginalResources();
}

function viewerKindOf(nameOrExt) {
  var s = String(nameOrExt || '').toLowerCase();
  var ext = s.indexOf('.') >= 0 ? s.slice(s.lastIndexOf('.') + 1) : s;
  if (ext === 'pdf') return 'pdf';
  if (ext === 'docx') return 'docx';
  if (ext === 'md' || ext === 'markdown') return 'md';
  if (ext === 'csv') return 'csv';
  if (ext === 'txt' || ext === 'text' || ext === 'log') return 'text';
  return null;
}

/* 字节 → 文本。解码顺序与后端 `app/parsing/parsers.py` 逐项一致
   （utf-8 → gb18030 → utf-16 → latin-1，都用严格模式，最后回落 replace）——
   两边不一致的话，查看器显示的字和索引里的字会对不上，引用定位就会失灵。
   中文 txt 在 Windows 上大量是 GBK，这一步不是可选项。 */
function decodeBytes(buf) {
  var bytes = new Uint8Array(buf);
  // BOM：UTF-8 / UTF-16 两种都先剥掉，否则首字符会变成不可见的 U+FEFF
  if (bytes.length >= 3 && bytes[0] === 0xEF && bytes[1] === 0xBB && bytes[2] === 0xBF) {
    bytes = bytes.subarray(3);
  } else if (bytes.length >= 2 && bytes[0] === 0xFF && bytes[1] === 0xFE) {
    return new TextDecoder('utf-16le').decode(bytes.subarray(2));
  } else if (bytes.length >= 2 && bytes[0] === 0xFE && bytes[1] === 0xFF) {
    return new TextDecoder('utf-16be').decode(bytes.subarray(2));
  }
  var labels = ['utf-8', 'gb18030', 'utf-16le'];
  for (var i = 0; i < labels.length; i++) {
    try {
      return new TextDecoder(labels[i], { fatal: true }).decode(bytes);
    } catch (e) { /* 这个编码解不通，换下一个 */ }
  }
  return new TextDecoder('utf-8').decode(bytes);   // 兜底：坏字节变 U+FFFD
}

function ordodocUrl(fileId, name) {
  return 'ordodoc://file/' + encodeURIComponent(String(fileId)) + '/' +
    encodeURIComponent(name || '');
}

function normText(s) {
  return String(s || '').replace(/\s+/g, '');
}

function setHint(id, text) {
  var el = document.getElementById(id);
  if (el) el.textContent = text;
}

function readResponseBytesLimited(resp, limit) {
  var declared = parseInt(resp.headers.get('content-length') || '0', 10);
  if (declared > limit) throw new Error('文件过大，原版式查看上限为 ' +
    Math.round(limit / 1024 / 1024) + ' MB');
  if (!resp.body || typeof resp.body.getReader !== 'function') {
    return resp.arrayBuffer().then(function (buf) {
      if (buf.byteLength > limit) throw new Error('文件超过原版式查看上限');
      return buf;
    });
  }
  var reader = resp.body.getReader();
  var chunks = [];
  var total = 0;
  function read() {
    return reader.read().then(function (part) {
      if (part.done) {
        var merged = new Uint8Array(total);
        var offset = 0;
        chunks.forEach(function (chunk) { merged.set(chunk, offset); offset += chunk.byteLength; });
        return merged.buffer;
      }
      total += part.value.byteLength;
      if (total > limit) {
        return reader.cancel().then(function () {
          throw new Error('文件超过原版式查看上限');
        });
      }
      chunks.push(part.value);
      return read();
    });
  }
  return read();
}

function fetchOriginalBytes(fileId, name, limit, signal) {
  // DOCX 需要完整 ZIP，但必须有硬上限；PDF 不走这里，直接把 URL 交给
  // PDF.js，才能保留 Range/流式加载。
  return fetch(ordodocUrl(fileId, name), { signal: signal }).then(function (resp) {
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    return readResponseBytesLimited(resp, limit);
  }).catch(function (err) {
    if (signal && signal.aborted) throw err;
    return window.ordo.apiRequest({
      path: '/files/' + encodeURIComponent(String(fileId)) + '/raw',
      method: 'GET',
    }).then(function (result) {
      if (!result || !result.ok) {
        throw new Error((result && result.error) || ('HTTP ' + (result && result.status)));
      }
      if (!result.b64 || result.b64.length > Math.ceil(MAX_IPC_ORIGINAL_BYTES * 4 / 3) + 8) {
        throw new Error('协议回退只支持 16 MB 以内的文件');
      }
      var bin = atob(result.b64);
      if (bin.length > limit) throw new Error('文件超过原版式查看上限');
      var bytes = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return bytes.buffer;
    });
  });
}

function ensureScript(src) {
  var existing = document.querySelector('script[data-vsrc="' + src + '"]');
  if (existing) {
    return existing.dataset.loaded
      ? Promise.resolve()
      : new Promise(function (resolve, reject) {
          existing.addEventListener('load', resolve, { once: true });
          existing.addEventListener('error',
            function () { reject(new Error('加载失败：' + src)); }, { once: true });
        });
  }
  return new Promise(function (resolve, reject) {
    var el = document.createElement('script');
    el.src = src;
    el.dataset.vsrc = src;
    el.onload = function () { el.dataset.loaded = '1'; resolve(); };
    el.onerror = function () { reject(new Error('加载失败：' + src)); };
    document.head.appendChild(el);
  });
}

function loadPdfJs() {
  if (!pdfjsLibPromise) {
    // specifier 必须是 './...' 或完整 URL —— 裸的 'vendor/...' 被 ES module
    // 解析器直接拒绝（Failed to resolve module specifier），PDF 于是一个都打不开。
    // 用 document.baseURI 解析成绝对 file:// URL：既满足 specifier 规则，
    // 也不依赖当前页面路径深度。
    var url = new URL('./vendor/pdfjs/pdf.min.mjs', document.baseURI).href;
    pdfjsLibPromise = import(url).then(function (lib) {
      // worker 也走 file://。它是以 module script 身份被 import 的，而自定义
      // 协议即便 standard:true 也不被 Chromium 当作合法的 module 来源
      // （报 "Failed to fetch dynamically imported module"）。库本体已从
      // file:// 成功加载，worker 同源同理。
      // cmaps / 字体仍用 ordodoc://：那两类是 fetch 取的，file:// 下会被判跨源。
      lib.GlobalWorkerOptions.workerSrc =
        new URL('./vendor/pdfjs/pdf.worker.min.mjs', document.baseURI).href;
      return lib;
    }).catch(function (err) {
      pdfjsLibPromise = null;      // 失败不缓存，下次打开可重试
      throw err;
    });
  }
  return pdfjsLibPromise;
}

function openOriginal(fileId, name, jump) {
  var body = document.getElementById('readerBody');
  var foot = document.getElementById('readerFoot');
  if (foot) foot.textContent = '';
  if (!body) return;
  stopOriginalView();
  var token = originalViewToken;
  var kind = viewerKindOf(name);
  body.innerHTML = '<div class="original-loading">正在加载原文…</div>';
  var openers = {
    pdf: openPdfOriginal,
    docx: openDocxOriginal,
    md: openMarkdownOriginal,
    csv: openCsvOriginal,
    text: openTextOriginal,
  };
  var task = (openers[kind] || openDocxOriginal)(fileId, name, jump, body, token);
  task.catch(function (err) {
    if (token !== originalViewToken) return;
    releaseOriginalResources();
    body.innerHTML = '<div class="detail-empty">原文加载失败：' + esc(err.message) +
      '（文件可能已被移动或删除，可切「提取文本」查看索引内容）</div>';
  });
}

/* ---------- PDF ---------- */

function openPdfOriginal(fileId, name, jump, body, token) {
  var session = {
    loadingTask: null,
    observer: null,
    renderTasks: new Set(),
    cleanup: function () {
      if (session.observer) session.observer.disconnect();
      session.renderTasks.forEach(function (task) {
        try { task.cancel(); } catch (e) {}
      });
      session.renderTasks.clear();
      if (session.loadingTask) {
        try { session.loadingTask.destroy(); } catch (e) {}
      }
    },
  };
  activeOriginalCleanup = session.cleanup;
  return loadPdfJs().then(function (pdfjsLib) {
    if (token !== originalViewToken) return null;
    session.loadingTask = pdfjsLib.getDocument({
      url: ordodocUrl(fileId, name),
      cMapUrl: 'ordodoc://app/vendor/pdfjs/cmaps/',
      cMapPacked: true,
      standardFontDataUrl: 'ordodoc://app/vendor/pdfjs/standard_fonts/',
    });
    return session.loadingTask.promise.then(function (doc) {
      if (token !== originalViewToken || !doc) return null;
      buildPdfView(pdfjsLib, doc, body, jump || {}, token, session);
      return null;
    });
  });
}

function buildPdfView(pdfjsLib, doc, body, jump, token, session) {
  body.innerHTML = '';
  var view = document.createElement('div');
  view.className = 'pdf-view';
  var bar = document.createElement('div');
  bar.className = 'pdf-bar';
  bar.innerHTML = '<span class="pdf-pos">加载中…</span>' +
    '<button class="mini" id="pdfPrev" type="button">上一页</button>' +
    '<button class="mini" id="pdfNext" type="button">下一页</button>' +
    '<button class="mini" id="pdfZoomOut" type="button" title="缩小">－</button>' +
    '<button class="mini" id="pdfZoomIn" type="button" title="放大">＋</button>';
  var pages = document.createElement('div');
  pages.className = 'pdf-pages';
  view.appendChild(bar);
  view.appendChild(pages);
  body.appendChild(view);

  var numPages = doc.numPages;
  var scale = 0;
  var rendered = {};        // pageNo -> true（已画）
  var rendering = {};       // pageNo -> true（正在画）
  var target = Math.min(Math.max(parseInt(jump.page, 10) || 1, 1), numPages);
  var pos = bar.querySelector('.pdf-pos');

  function setPos(pageNo) {
    pos.textContent = pageNo + ' / ' + numPages + ' 页';
  }

  function pageWrap(pageNo) {
    return pages.querySelector('.pdf-page[data-page="' + pageNo + '"]');
  }

  function firstScale() {
    if (scale) return Promise.resolve(scale);
    return doc.getPage(1).then(function (page) {
      var base = page.getViewport({ scale: 1 });
      var avail = Math.max(pages.clientWidth - 36, 320);
      scale = Math.min(Math.max(avail / base.width, 0.5), 3);
      return scale;
    });
  }

  function renderPage(pageNo) {
    if (pageNo < 1 || pageNo > numPages) return Promise.resolve(null);
    if (rendered[pageNo] || rendering[pageNo]) return Promise.resolve(null);
    rendering[pageNo] = true;
    return firstScale().then(function () {
      if (token !== originalViewToken) return null;
      return doc.getPage(pageNo).then(function (page) {
        if (token !== originalViewToken) return null;
        var viewport = page.getViewport({ scale: scale });
        var holder = pageWrap(pageNo);
        if (!holder) return null;
        holder.innerHTML = '';
        holder.classList.remove('pdf-page-ph');
        var canvas = document.createElement('canvas');
        canvas.width = Math.floor(viewport.width);
        canvas.height = Math.floor(viewport.height);
        holder.appendChild(canvas);
        // 摘掉骨架态：它的 min-height:340px 会把矮页面撑出一截空白
        holder.classList.remove('pdf-page-ph');
        holder.style.height = 'auto';
        var renderTask = page.render({
          canvasContext: canvas.getContext('2d'),
          viewport: viewport,
        });
        session.renderTasks.add(renderTask);
        return renderTask.promise.then(function () {
          rendered[pageNo] = true;
          return page;
        }).catch(function (err) {
          holder.innerHTML = '<div class="pdf-page-err">第 ' + pageNo +
            ' 页渲染失败</div>';
          throw err;
        }).finally(function () {
          session.renderTasks.delete(renderTask);
        });
      });
    }).finally(function () {
      delete rendering[pageNo];
    });
  }

  // 占位骨架先全部铺开（滚动条真实），滚到附近才真正渲染。
  //
  // 两个类都要给：`pdf-page` 是常驻身份 —— pageWrap() 按
  // `.pdf-page[data-page]` 找容器，缺了它 renderPage 拿到 null 就静默返回，
  // 结果是一页都画不出来且不报错。`pdf-page-ph` 只是"还没画"的骨架态
  // （min-height 撑出滚动条），画完由 renderPage 摘掉。
  for (var i = 1; i <= numPages; i++) {
    var ph = document.createElement('div');
    ph.className = 'pdf-page pdf-page-ph';
    ph.dataset.page = i;
    pages.appendChild(ph);
  }
  var observer = new IntersectionObserver(function (entries) {
    entries.forEach(function (entry) {
      if (!entry.isIntersecting) return;
      var pageNo = parseInt(entry.target.dataset.page, 10);
      renderPage(pageNo).catch(function () {});
    });
  }, { root: document.getElementById('evidence'), rootMargin: '700px 0px' });
  session.observer = observer;
  Array.prototype.forEach.call(pages.children, function (el) { observer.observe(el); });

  function scrollToPage(pageNo, afterRender) {
    pageNo = Math.min(Math.max(pageNo, 1), numPages);
    setPos(pageNo);
    var holder = pageWrap(pageNo);
    if (holder) holder.scrollIntoView({ block: 'start' });
    renderPage(pageNo).then(function (page) {
      if (afterRender && page && token === originalViewToken) afterRender(page);
    }).catch(function () {});
  }

  bar.querySelector('#pdfPrev').onclick = function () { scrollToPage((parseInt(pos.textContent, 10) || 1) - 1); };
  bar.querySelector('#pdfNext').onclick = function () { scrollToPage((parseInt(pos.textContent, 10) || 1) + 1); };
  bar.querySelector('#pdfZoomIn').onclick = function () {
    scale = Math.min(scale * 1.2, 3);
    rerenderAll();
  };
  bar.querySelector('#pdfZoomOut').onclick = function () {
    scale = Math.max(scale / 1.2, 0.5);
    rerenderAll();
  };
  function rerenderAll() {
    rendered = {};
    Array.prototype.forEach.call(pages.children, function (el) {
      el.classList.add('pdf-page-ph');
      el.innerHTML = '';
    });
    var current = parseInt(pos.textContent, 10) || 1;
    for (var d = 0; d < 3; d++) renderPage(current + d).catch(function () {});
  }

  scrollToPage(target, function (page) { highlightPdfPage(pdfjsLib, page, jump.snippet); });
}

function highlightPdfPage(pdfjsLib, page, snippet) {
  var needle = normText(snippet).slice(0, 24);
  if (!needle) return;
  var viewport = page.getViewport({ scale: scaleOfPage(page) });
  page.getTextContent().then(function (tc) {
    var items = tc.items || [];
    var matched = [];
    var acc = '';
    for (var i = 0; i < items.length; i++) {
      var text = normText(items[i].str);
      if (!text) continue;
      var combined = (acc + text);
      if (!matched.length) {
        if (combined.indexOf(needle.slice(0, 10)) < 0) continue;
        matched.push(items[i]);
        acc = text;
        if (acc.length >= needle.length) break;
        continue;
      }
      matched.push(items[i]);
      acc = combined;
      if (acc.indexOf(needle.slice(0, Math.min(needle.length, 18))) >= 0 ||
          acc.length > needle.length + 40) break;
    }
    if (!matched.length) return;
    var canvas = document.querySelector(
      '.pdf-page[data-page="' + page.pageNumber + '"] canvas');
    var holder = canvas && canvas.parentElement;
    if (!holder) return;
    holder.style.position = 'relative';
    matched.forEach(function (item) {
      var tx = pdfjsLib.Util.transform(viewport.transform, item.transform);
      var h = Math.hypot(tx[2], tx[3]) || item.height * viewport.scale;
      var w = (item.width || 0) * viewport.scale;
      if (w <= 0 || h <= 0) return;
      var hl = document.createElement('div');
      hl.className = 'pdf-hl';
      hl.style.left = tx[4] + 'px';
      hl.style.top = (tx[5] - h) + 'px';
      hl.style.width = w + 'px';
      hl.style.height = h + 'px';
      holder.appendChild(hl);
    });
  }).catch(function () {});
}

function scaleOfPage(page) {
  var canvas = document.querySelector(
    '.pdf-page[data-page="' + page.pageNumber + '"] canvas');
  if (!canvas) return 1;
  var base = page.getViewport({ scale: 1 });
  return canvas.width / base.width;
}

/* ---------- DOCX ---------- */

function openDocxOriginal(fileId, name, jump, body, token) {
  var controller = new AbortController();
  activeOriginalCleanup = function () { controller.abort(); };
  return Promise.all([
    ensureScript('vendor/docx/jszip.min.js'),
    ensureScript('vendor/docx/docx-preview.min.js'),
  ]).then(function () {
    if (token !== originalViewToken) return null;
    return fetchOriginalBytes(fileId, name, MAX_DOCX_VIEW_BYTES, controller.signal).then(function (buf) {
      if (token !== originalViewToken) return null;
      body.innerHTML = '<div class="docx-view"></div>';
      var holder = body.querySelector('.docx-view');
      return window.docx.renderAsync(buf, holder, null, {
        inWrapper: true,
        ignoreWidth: false,
        ignoreHeight: false,
      }).then(function () {
        if (token !== originalViewToken) return null;
        highlightInDom(holder, jump && jump.snippet);
        return null;
      });
    });
  });
}

/* ---------- Markdown ---------- */

/* marked 负责 md → HTML，DOMPurify 负责"这段 HTML 能不能进 DOM"。
   为什么必须消毒:md 是**用户文件内容**，里面可以直接写 <script> 或
   <img onerror=...>。渲染层虽然是 file:// + CSP 'self'，但 CSP 拦不住已经
   在同源脚本上下文里的内联事件属性，所以不能省这一步。
   两个库都内嵌在 renderer/vendor/ 下，按 'self' 过 CSP，不出网。 */
function openMarkdownOriginal(fileId, name, jump, body, token) {
  return Promise.all([
    ensureScript('vendor/marked/marked.umd.js'),
    ensureScript('vendor/dompurify/purify.min.js'),
  ]).then(function () {
    if (token !== originalViewToken) return null;
    return fetchOriginalBytes(fileId, name).then(function (buf) {
      if (token !== originalViewToken) return null;
      var text = decodeBytes(buf);
      var raw = window.marked.parse(text, { gfm: true, breaks: false });
      var clean = window.DOMPurify.sanitize(raw, {
        // 白名单之外一律丢弃。禁 script/iframe/object/embed/form 是拦执行与
        // 外发；禁 on* 与 style 是拦内联事件与视觉伪装。
        FORBID_TAGS: ['script', 'style', 'iframe', 'object', 'embed', 'form',
          'input', 'button', 'link', 'meta', 'base'],
        FORBID_ATTR: ['style', 'srcset', 'formaction', 'ping'],
        ALLOW_DATA_ATTR: false,
      });
      body.innerHTML = '<div class="md-view"></div>';
      var holder = body.querySelector('.md-view');
      holder.innerHTML = clean;
      // 图片与链接:相对路径在 file:// 下指不到用户文件，且点开会离开应用。
      // 图片直接摘掉换成占位说明，链接一律交给系统浏览器。
      stripMdImages(holder);
      externalizeMdLinks(holder);
      highlightInDom(holder, jump && jump.snippet);
      return null;
    });
  });
}

/* 相对路径图片在 file:// 下必然加载失败（原文件不在渲染层能触及的位置），
   留着只会显示一堆碎图标。换成一行占位，说清它是图片而不是渲染坏了。 */
function stripMdImages(root) {
  var imgs = root.querySelectorAll('img');
  for (var i = 0; i < imgs.length; i++) {
    var img = imgs[i];
    var ph = document.createElement('span');
    ph.className = 'md-img-ph';
    ph.textContent = '[图片' + (img.getAttribute('alt')
      ? '：' + img.getAttribute('alt') : '') + ']';
    if (img.parentNode) img.parentNode.replaceChild(ph, img);
  }
}

/* 站内导航会把渲染层导走。http(s) 加 target=_blank 交给主进程既有的
   setWindowOpenHandler（它只放行 http/https 到系统浏览器，然后 deny 开窗）——
   复用那条已审过的通道，不新增 IPC。其余协议（相对路径、file:、自定义）
   去掉可点性:在 file:// 下它们指不到用户文件，留着只会把人导到空页面。 */
function externalizeMdLinks(root) {
  var links = root.querySelectorAll('a[href]');
  for (var i = 0; i < links.length; i++) {
    var a = links[i];
    var href = a.getAttribute('href') || '';
    if (/^https?:\/\//i.test(href)) {
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.title = href;
    } else {
      var span = document.createElement('span');
      span.className = 'md-link-dead';
      span.textContent = a.textContent;
      span.title = href ? '相对链接，无法在查看器中打开：' + href : '';
      if (a.parentNode) a.parentNode.replaceChild(span, a);
    }
  }
}

/* ---------- 纯文本 ---------- */

/* 等宽 + 保留换行与缩进。用 textContent 而不是 innerHTML —— 纯文本没有任何
   需要解析的结构，解析它只会引入风险。 */
function openTextOriginal(fileId, name, jump, body, token) {
  return fetchOriginalBytes(fileId, name).then(function (buf) {
    if (token !== originalViewToken) return null;
    body.innerHTML = '<pre class="text-view"></pre>';
    var pre = body.querySelector('.text-view');
    pre.textContent = decodeBytes(buf);
    highlightInDom(pre, jump && jump.snippet);
    return null;
  });
}

/* ---------- CSV ---------- */

/* 渲染成表格。解析按 RFC 4180 处理引号内的逗号、换行与转义双引号 ——
   按 split(',') 拆会把带逗号的单元格拆散，那种表看着比不渲染更糟。 */
function parseCsv(text) {
  var rows = [];
  var row = [];
  var cell = '';
  var quoted = false;
  for (var i = 0; i < text.length; i++) {
    var ch = text[i];
    if (quoted) {
      if (ch === '"') {
        if (text[i + 1] === '"') { cell += '"'; i++; }   // "" = 一个字面引号
        else quoted = false;
      } else cell += ch;
      continue;
    }
    if (ch === '"') { quoted = true; continue; }
    if (ch === ',') { row.push(cell); cell = ''; continue; }
    if (ch === '\r') continue;                            // CRLF 只认 \n
    if (ch === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; continue; }
    cell += ch;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows;
}

function openCsvOriginal(fileId, name, jump, body, token) {
  return fetchOriginalBytes(fileId, name).then(function (buf) {
    if (token !== originalViewToken) return null;
    var rows = parseCsv(decodeBytes(buf));
    body.innerHTML = '<div class="csv-view"><table></table></div>';
    var table = body.querySelector('.csv-view table');
    // 全程 createElement + textContent:单元格是用户数据，不进 HTML 解析。
    var limit = Math.min(rows.length, 5000);   // 超大表只渲染前 5000 行
    for (var r = 0; r < limit; r++) {
      var tr = document.createElement('tr');
      for (var c = 0; c < rows[r].length; c++) {
        var td = document.createElement(r === 0 ? 'th' : 'td');
        td.textContent = rows[r][c];
        tr.appendChild(td);
      }
      table.appendChild(tr);
    }
    if (rows.length > limit) {
      var note = document.createElement('div');
      note.className = 'csv-more';
      note.textContent = '共 ' + rows.length + ' 行，已显示前 ' + limit + ' 行';
      body.querySelector('.csv-view').appendChild(note);
    }
    highlightInDom(table, jump && jump.snippet);
    return null;
  });
}

/* 在已渲染的 DOM 里按片段文本定位并包上 <mark>。
   归一化只删空白 —— 用映射表把归一化下标折回各文本节点的局部偏移。 */
function highlightInDom(root, snippet) {
  var needle = normText(snippet).slice(0, 60);
  if (!needle || !root) return;
  var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
  var map = [];          // { node, rawIndex } 归一化字符 -> 原文位置
  var normalized = '';
  while (walker.nextNode()) {
    var value = walker.currentNode.nodeValue || '';
    for (var i = 0; i < value.length; i++) {
      if (!/\s/.test(value[i])) {
        map.push({ node: walker.currentNode, rawIndex: i });
        normalized += value[i];
      }
    }
  }
  var at = normalized.indexOf(needle);
  if (at < 0) return;
  var spans = [];        // { node, start, end } 每个被覆盖文本节点的区间
  for (var k = at; k < at + needle.length; k++) {
    var entry = map[k];
    var last = spans[spans.length - 1];
    if (last && last.node === entry.node) last.end = entry.rawIndex + 1;
    else spans.push({ node: entry.node, start: entry.rawIndex, end: entry.rawIndex + 1 });
  }
  var firstMark = null;
  spans.forEach(function (span) {
    try {
      var range = document.createRange();
      range.setStart(span.node, span.start);
      range.setEnd(span.node, span.end);
      var mark = document.createElement('mark');
      mark.className = 'ev-hl';
      range.surroundContents(mark);
      if (!firstMark) firstMark = mark;
    } catch (e) { /* 节点边界异常时跳过该小段，不影响其余高亮 */ }
  });
  if (firstMark) {
    firstMark.scrollIntoView({ block: 'center' });
    firstMark.classList.add('flash');
  }
}

/* ---------- 文件查看器（全文阅读） ---------- */
let readerState = null;

function startReader(fileId, fallbackSections) {
  if (!fileId) {
    readerState = null;
    renderReaderFallback(fallbackSections, '');
    return;
  }
  readerState = { fileId: fileId, offset: 0, total: 0,
                  loading: false, done: false, fallback: fallbackSections };
  var scroller = document.getElementById('evidence');
  scroller.onscroll = function () {
    if (scroller.scrollTop + scroller.clientHeight >= scroller.scrollHeight - 420) {
      loadReaderPage();
    }
  };
  loadReaderPage();
}

function renderReaderFallback(sections, note) {
  var body = document.getElementById('readerBody');
  var foot = document.getElementById('readerFoot');
  if (!body) return;
  body.innerHTML = sections.length
    ? sections.map(detailSectionHtml).join('')
    : '<div class="detail-empty">该文件还没有可提取的正文 —— 可用上方按钮用默认应用打开</div>';
  if (foot) foot.textContent = note || '';
}

async function loadReaderPage() {
  var st = readerState;
  if (!st || st.loading || st.done) return;
  st.loading = true;
  var foot = document.getElementById('readerFoot');
  if (foot) foot.textContent = '正在加载全文…';
  try {
    var r = await api('/files/' + encodeURIComponent(st.fileId) +
                      '/content?offset=' + st.offset + '&limit=60');
    if (readerState !== st) return;   // 期间切换了文件
    var body = document.getElementById('readerBody');
    if (!body) return;
    var sections = Array.isArray(r.sections) ? r.sections : [];
    st.total = safeNumber(r.total);
    if (st.offset === 0 && !sections.length) {
      // 没有全文（未解析/不支持的格式）→ 退回详情兜底
      st.done = true;
      renderReaderFallback(st.fallback, '');
      return;
    }
    body.insertAdjacentHTML('beforeend', sections.map(detailSectionHtml).join(''));
    st.offset += sections.length;
    st.done = !r.has_more;
    if (foot) {
      foot.textContent = st.done
        ? '— 全文完 · 共 ' + st.total + ' 段 —'
        : '已加载 ' + st.offset + ' / ' + st.total + ' 段，继续下滑加载';
    }
  } catch (e) {
    if (readerState === st) {
      st.done = true;
      renderReaderFallback(st.fallback, '全文加载失败：' + e.message);
    }
  } finally {
    st.loading = false;
  }
}

async function showFileDetail(file, jump) {

  pendingJump = jump || null;   // 原文视图打开后定位并高亮引用段
  var version = ++detailVersion;
  showDetailPage(file.name || '文件详情');

async function api(path, opts = {}) {
  // 经主进程受控代理访问 sidecar；鉴权令牌只存在于主进程，渲染层拿不到。
  const result = await window.ordo.apiRequest({
    path: path,
    method: opts.method || 'GET',
    body: typeof opts.body === 'string' ? opts.body : undefined,
  });
  if (!result) throw new Error('sidecar 未就绪');
  if (!result.ok) throw new Error('HTTP ' + (result.status || result.error || '?'));
  return result.data;
}

function apiStream(path, payload, onEvent) {
  // 流式同样经主进程代理：主进程解析 SSE 后逐条回传 (event, data)。
  return window.ordo.apiStream(path, payload || {}, onEvent);
}

function fmtSize(b) {
  if (!b) return '';
  if (b < 1024) return b + ' B';
  if (b < 1048576) return (b / 1024).toFixed(0) + ' KB';
  if (b < 1073741824) return (b / 1048576).toFixed(1) + ' MB';
  return (b / 1073741824).toFixed(1) + ' GB';
}
function fmtDate(ts) {
  if (!ts) return '';
  const days = Math.floor((Date.now() / 1000 - ts) / 86400);
  if (days <= 0) return '今天';
  if (days === 1) return '昨天';
  if (days < 7) return days + ' 天前';
  const d = new Date(ts * 1000);
  return (d.getMonth() + 1) + '月' + d.getDate() + '日';
}

/* 树使用的 SVG 图标：字符三角太小且发虚，换成可控大小的矢量 */
function chevSvg(open) {
  return '<svg class="chev-svg' + (open ? ' open' : '') + '" viewBox="0 0 10 10" aria-hidden="true">' +
    '<path d="M3 1.6 L7.2 5 L3 8.4" fill="none" stroke="currentColor" ' +
    'stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>';
}

function folderSvg(open) {
  return '<svg class="ico-svg" viewBox="0 0 16 16" aria-hidden="true">' +
    (open
      ? '<path d="M1.8 4.2c0-.7.6-1.3 1.3-1.3h2.8l1.4 1.4h5.4c.7 0 1.3.6 1.3 1.3v.6H3.4c-.6 0-1.1.4-1.3 1L1.8 9.4z" fill="currentColor" opacity=".55"/>' +
        '<path d="M2.9 7.4c.1-.5.6-.9 1.1-.9h10.2c.7 0 1.2.7 1 1.4l-1 4.2c-.1.5-.6.9-1.1.9H3c-.7 0-1.2-.7-1.1-1.4z" fill="currentColor"/>'
      : '<path d="M1.8 4.2c0-.7.6-1.3 1.3-1.3h2.8l1.4 1.4h5.4c.7 0 1.3.6 1.3 1.3v6.2c0 .7-.6 1.3-1.3 1.3H3.1c-.7 0-1.3-.6-1.3-1.3z" fill="currentColor"/>') +
    '</svg>';
}

function fileSvg() {
  return '<svg class="ico-svg" viewBox="0 0 16 16" aria-hidden="true">' +
    '<path d="M4 1.6h5.2L13 5.4v8.4c0 .7-.5 1.2-1.2 1.2H4c-.7 0-1.2-.5-1.2-1.2V2.8c0-.7.5-1.2 1.2-1.2z" fill="currentColor" opacity=".28"/>' +
    '<path d="M9.2 1.6 13 5.4H9.9c-.4 0-.7-.3-.7-.7z" fill="currentColor" opacity=".6"/></svg>';
}

/* 文件树：树根 = 已启用来源，子层按需取（GET /files/tree），
   完全从库内路径推导、不扫磁盘。展开状态持久化。 */
let treeRoots = null;      // null = 尚未加载
let treeChildren = {};     // 目录路径 -> { dirs, files, truncated }
let treeFetching = {};
let treeOpen = {};
try { treeOpen = JSON.parse(localStorage.getItem('treeOpen') || '{}') || {}; } catch (e) {}

function persistTreeOpen() {
  try { localStorage.setItem('treeOpen', JSON.stringify(treeOpen)); } catch (e) {}
}

function invalidateTree() {
  treeRoots = null;
  treeChildren = {};
  treeFetching = {};
}

function fetchTreeLevel(dirPath) {
  var key = dirPath === null ? '' : dirPath;
  if (treeFetching[key]) return;
  treeFetching[key] = true;
  var url = dirPath === null ? '/files/tree' : '/files/tree?dir=' + encodeURIComponent(dirPath);
  api(url).then(function (r) {
    if (dirPath === null) treeRoots = r.roots || [];
    else treeChildren[dirPath] = { dirs: r.dirs || [], files: r.files || [], truncated: !!r.truncated };
  }).catch(function () {
    if (dirPath === null) treeRoots = [];
    else treeChildren[dirPath] = { dirs: [], files: [], truncated: false };
  }).finally(function () {
    delete treeFetching[key];
    renderNav();
  });
}

function treeDirRow(name, dirPath, count, depth) {
  var open = !!treeOpen[dirPath];
  return '<div class="nav-item tree-dir' + (activeDir === dirPath ? ' on' : '') +
    '" data-dir="' + encodedData(dirPath) + '" title="' + esc(name) +
    '" style="padding-left:' + (6 + depth * 13) + 'px">' +
    '<span class="nav-chev">' + chevSvg(open) + '</span>' +
    '<span class="tree-ico ico-folder">' + folderSvg(open) + '</span>' +
    '<span class="label">' + esc(name) + '</span>' +
    '<span class="n">' + esc(count || '') + '</span></div>' +
    (open ? treeLevelHtml(dirPath, depth + 1) : '');
}

function treeLevelHtml(dirPath, depth) {
  if (dirPath === null) {
    if (treeRoots === null) {
      fetchTreeLevel(null);
      return '<div class="tree-note">加载中…</div>';
    }
    if (!treeRoots.length) return '<div class="tree-note">没有已启用的来源</div>';
    return treeRoots.map(function (r) {
      return treeDirRow(r.name, r.path, r.count, 0);
    }).join('');
  }
  var kids = treeChildren[dirPath];
  if (!kids) {
    fetchTreeLevel(dirPath);
    return '<div class="tree-note" style="padding-left:' + (22 + depth * 13) + 'px">加载中…</div>';
  }
  var h = kids.dirs.map(function (d) {
    return treeDirRow(d.name, d.path, d.count, depth);
  }).join('');
  h += kids.files.map(function (f) {
    return '<div class="nav-item tree-file" data-fid="' + esc(f.id) +
      '" data-fname="' + encodedData(f.name) + '" title="' + esc(f.name) +
      '" style="padding-left:' + (6 + depth * 13) + 'px">' +
      '<span class="nav-chev tree-leaf"></span>' +
      '<span class="tree-ico ico-file">' + fileSvg() + '</span>' +
      '<span class="label">' + esc(f.name) + '</span></div>';
  }).join('');
  if (kids.truncated) {
    h += '<div class="tree-note" style="padding-left:' + (22 + depth * 13) + 'px">' +
      '目录较大，仅列出部分 —— 点目录名在中栏看全部</div>';
  }
  return h;
}

function renderNav() {
  const el = document.getElementById('nav');
  const unfiltered = activeSource === null && activeCategory === null &&
    activeBook === null && activeExt === null && activeDir === null &&
    activeRecent === null && !activeDuplicate;

  // 左栏刻意保持极简，不设任何组标题：全部文件/时间线/重复内容 + 文件树。
  // 分类/类型/文件书先撤下（数据与右键归类保留，需要时可加回）。
  let h = '<div class="nav-item' + (unfiltered ? ' on' : '') + '" data-src="">' +
       '<span class="label">全部文件</span><span class="n">' + esc(stats ? stats.files : '') + '</span></div>';

/* 分类与文件书的数据仍在维护（右键归类、问答 book 过滤要用），
   只是不再作为左栏导航组展示 */
async function refreshCats() {
  try { categories = await api('/categories'); } catch (e) {}
  try { books = (await api('/books')).books; } catch (e) {}

function renderRows() {
  const el = document.getElementById('rows');
  if (!files.length) {
    el.innerHTML = '<div class="empty">没有匹配的文件</div>';
    return;
  }
  // 分组头：浏览模式按扩展名（与 load 的 group=ext 排序配合），
  // 时间线视图按日期（今天/昨天/N 天前），互不混用
  const grouped = !currentQuery && !activeDuplicate && activeRecent === null;
  const dateGrouped = !currentQuery && activeRecent !== null;
  let lastGroup = null;
  const rows = files.map(function (f) {
    // 原件没了但有副本 → 双击落到副本（保全存在的意义）
    var openPath = f.path;
    if (f.state === 'missing' && f.preserved_path) openPath = f.preserved_path;
    var gone = f.state === 'missing' && !f.preserved_path;
    var kind = String(f.ext || '').replace('.', '').toLowerCase();
    var head = '';
    if (grouped || dateGrouped) {
      var label = dateGrouped
        ? (fmtDate(f.mtime) || '更早')
        : (kind ? kind.toUpperCase() : '无扩展名');
      if (label !== lastGroup) {
        lastGroup = label;
        head = '<div class="row-group">' + esc(label) + '</div>';
      }
    }
    return head + '<div class="row' + (gone ? ' gone' : '') + '" data-path="' + encodedData(openPath) + '" data-index="' + encodedData(f.id) + '">' +
      '<span class="icon t-' + esc(kind) + '">' + esc((kind || '·').slice(0, 4).toUpperCase()) + '</span>' +
      '<span class="fname">' + esc(f.name) +
        (f.state === 'missing' ? ' <span class="tag' + (f.preserved_path ? '' : ' gone') + '">' +
          (f.preserved_path ? '已保全' : '原文件已消失') + '</span>' : '') +
      '</span>' +
      '<span class="fsrc' + (f.volatile ? ' vol' : '') + '">' + esc(f.source_name || '') + '</span>' +
      '<span class="fsize">' + esc(fmtSize(f.size)) + '</span>' +
      '<span class="fdate">' + esc(fmtDate(f.mtime)) + '</span>' +
    '</div>';
  }).join('');
  const more = files.length < filesTotal
    ? '<div class="load-more"><button id="loadMore">加载更多</button>' +
      '<span>已显示 ' + esc(files.length) + ' / ' + esc(filesTotal) + '</span></div>'
    : '';
  el.innerHTML = rows + more;
  el.querySelectorAll('.row').forEach(function (r, idx) {
    r.onclick = function () {
      el.querySelectorAll('.row.on').forEach(function (item) { item.classList.remove('on'); });
      r.classList.add('on');
      showFileDetail(files[idx]);
    };
    r.ondblclick = function () {
      window.ordo.revealInFinder(decodeURIComponent(r.dataset.path));
    };
    r.oncontextmenu = function (e) {
      e.preventDefault();
      openCtxMenu(e.clientX, e.clientY, files[idx]);
    };
  });
  const moreBtn = document.getElementById('loadMore');
  if (moreBtn) moreBtn.onclick = async function () {
    moreBtn.disabled = true;
    moreBtn.textContent = '加载中…';
    try {
      await load(currentQuery, true);
    } catch (e) {
      moreBtn.disabled = false;
      moreBtn.textContent = '重试加载';
      toast('加载失败：' + e.message);
    }
  };
}

function openPathForFile(file) {
  return file && file.state === 'missing' && file.preserved_path ? file.preserved_path : (file && file.path ? file.path : '');
}

/* ---------- 文件删除 ----------
   两档明确操作：① 从库中移除 = 只删记录与索引，磁盘不动（H2）；
   ② 删除文件 = 移到废纸篓（可恢复），sidecar 只清库，动磁盘的是系统 API */
async function refreshAfterLibraryChange() {
  try { stats = await api('/stats'); } catch (e) {}
  await refreshCats();
  invalidateTree();
  renderNav();
  updateWorkbenchChrome();
  await load(document.getElementById('q').value.trim());
}

async function removeFileFromLibrary(file) {
  var name = String(file.name || '').slice(0, 24);
  var ok = confirm('从库中移除「' + name + '」？\n\n' +
    '只删除索引记录，磁盘上的文件不受影响。\n' +
    '注意：若文件仍在已启用的来源目录内，下次扫描会重新收录。');
  if (!ok) return;
  try {
    await api('/files/remove', { method: 'POST', body: JSON.stringify({
      file_ids: [file.file_id || file.id] }) });
    toast('已从库中移除');
    if (detailPageOpen) showListPage();
    await refreshAfterLibraryChange();
  } catch (e) { toast('移除失败：' + e.message); }
}

async function trashFile(file) {
  try {
    var result = await window.ordo.trashFile(file.file_id || file.id);
    if (result && result.cancelled) return;
    if (!result || !result.ok) {
      toast('删除失败：' + ((result && result.error) || '未知错误'));
      return;
    }
    toast('已移到废纸篓');
    if (detailPageOpen) showListPage();
    await refreshAfterLibraryChange();
  } catch (e) { toast('删除失败：' + e.message); }
}

async function load(q, append = false) {
  const query = String(q || '').trim();
  setListTitle(query ? '文件搜索' : '文件管理');
  if (!append) {
    searchVersion += 1;  // 列表导航使尚未返回的全文搜索失效
    currentQuery = query;
    files = [];
    filesTotal = 0;
  } else if (query !== currentQuery) {
    return load(query, false);
  }
  const version = append ? loadVersion : ++loadVersion;
  const params = new URLSearchParams({
    limit: String(PAGE_SIZE),
    offset: String(append ? files.length : 0),
  });
  if (query) params.set('q', query);
  if (activeCategory === 'none') params.set('unclassified', 'true');
  else if (activeCategory !== null) params.set('category_id', String(activeCategory));
  if (activeBook !== null) params.set('book_id', String(activeBook));
  if (activeSource !== null) params.set('source', activeSource);
  if (activeExt !== null) params.set('ext', activeExt);
  if (activeDir !== null) params.set('dir', activeDir);
  if (activeRecent !== null) params.set('since_days', String(activeRecent));
  if (activeDuplicate) params.set('duplicate', 'true');
  // 浏览模式按扩展名分组（服务端排序，跨页不断组）；
  // 时间线视图按日期分组（天然 mtime 序），搜索和重复视图保持按时间
  if (!query && !activeDuplicate && activeRecent === null) params.set('group', 'ext');
  const d = await api('/files?' + params);
  if (version !== loadVersion) return;
  const page = Array.isArray(d.files) ? d.files : [];
  files = append ? files.concat(page) : page;
  filesTotal = Math.max(0, safeNumber(d.total));
  document.getElementById('count').textContent = filesTotal + ' 个文件';
  renderRows();
}

/* 全文搜索：搜内容而非文件名。文件名匹配与内容匹配合并展示 */
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}
function encodedData(value) {
  return esc(encodeURIComponent(String(value == null ? '' : value)));
}
function safeNumber(value) {
  const n = Number(value);
  return Number.isFinite(n) ? n : 0;
}

async function runAutoExtClassify(showToast) {
  // 设置里可关（通用配置 → 整理 → 自动归类）
  if (localStorage.getItem('autoClassify') === '0') return { classified: 0 };
  if (autoClassifyPending) return autoClassifyPending;
  autoClassifyPending = (async function () {
    try {
      const r = await api('/classify/auto_ext', { method: 'POST' });
      if (safeNumber(r.classified) > 0) {
        await refreshCats();
        stats = await api('/stats');
        renderNav();
        if (showToast) {
          toast('已按扩展名自动归类 ' + safeNumber(r.classified) + ' 个文件');
        }
      }
      return r;
    } catch (e) {
      return { classified: 0, error: e.message };
    } finally {
      autoClassifyPending = null;
    }
  })();
  return autoClassifyPending;
}
function highlight(text, q) {
  const safe = esc(text);
  if (!q) return safe;
  // 逐字符高亮：中文没有词边界，按查询串里的字符片段匹配
  const terms = q.split(/\s+/).filter(Boolean).map(esc);
  let out = safe;
  terms.forEach(function (t) {
    if (t.length < 1) return;
    out = out.split(t).join('<em>' + t + '</em>');
  });
  return out;
}

function renderHits(result, q) {
  const el = document.getElementById('rows');
  setListTitle('检索结果');
  if (!result.files.length) {
    el.innerHTML = '<div class="workbench-empty"><div><div class="empty-mark">⌕</div><div class="empty-title">没有找到匹配内容</div>' +
      '<div class="empty-meta">试试其他关键词，或检查文档是否已完成索引</div></div></div>';
    clearEvidence();
    return;
  }
  let h = '<div class="mode">全文搜索 · 命中 ' + esc(result.total) + ' 个文件' +
          (result.routes && result.routes.vector ? ' · 含语义匹配' : '') + '</div>';
  if (result.hedge) {
    h += '<div class="mode" style="color:var(--warn)">⚠ ' + esc(result.hedge) + '</div>';
  }
  h += result.files.map(function (f, index) {
    const snips = f.snippets.map(function (s) {
      const loc = s.page ? ('第 ' + s.page + ' 页')
                : (s.section_path ? s.section_path.split(' › ').slice(-1)[0] : '');
      return '<div class="snip">' + (loc ? '<span class="loc">' + esc(loc) + '</span>' : '') +
             highlight(s.text, q) + '</div>';
    }).join('');
    var kind = String(f.ext || '').replace('.', '').toLowerCase();
    return '<div class="hit" data-path="' + encodedData(f.path) + '" data-hit="' + esc(index) + '" tabindex="0">' +
      '<div class="hit-head">' +
        '<span class="icon t-' + esc(kind) + '">' + esc((kind || '·').slice(0, 4).toUpperCase()) + '</span>' +
        '<span class="hit-name">' + esc(f.name) + '</span>' +
        '<span class="hit-meta' + (f.volatile ? ' vol' : '') + '">' +
          esc(f.source_name || '') + '</span>' +
      '</div>' + snips + '</div>';
  }).join('');
  el.innerHTML = h;
  el.querySelectorAll('.hit').forEach(function (r, index) {
    r.onclick = function () {
      var file = result.files[index];
      el.querySelectorAll('.hit.on').forEach(function (item) { item.classList.remove('on'); });
      r.classList.add('on');
      showSearchFileDetail(file);
    };
    r.onkeydown = function (event) {
      if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); r.onclick(); }
    };
    r.ondblclick = function () {
      window.ordo.revealInFinder(decodeURIComponent(r.dataset.path));
    };
  });
}

/* ---------- AI 问答（B6） ---------- */
async function runAsk(q) {
  const question = String(q || '').trim();
  if (!question || askInFlight) return;
  askInFlight = true;
  const el = document.getElementById('answerRows');
  el.innerHTML = qaHistoryHtml() +
    '<div class="qa-q">' + esc(question) + '</div>' +
    '<div class="ans thinking"><span class="tdot"></span><span class="tdot"></span>' +
    '<span class="tdot"></span><span class="tlabel">正在检索并作答…</span></div>';
  bindQaThread(el);
  el.scrollTop = el.scrollHeight;
  document.getElementById('askSubmit').disabled = true;
  try {
    // 带上最近几轮问答，后端把"那第二个呢"这类追问浓缩成独立问题再检索
    const chatHistory = [];
    for (let i = 0; i < qaAnswers.length; i++) {
      const prev = qaAnswers[i];
      if (!prev || !qaHistory[i]) continue;
      chatHistory.push({ q: qaHistory[i].question,
                         a: String(prev.answer || '').slice(0, 300) });
    }
    let finalAnswer = null;
    let draftText = '';
    await apiStream('/ask/stream', {
      question: question, book_id: activeBook,
      history: chatHistory.slice(-4),
      mode: qaMode,
    }, function (event, payload) {
      var current = el.lastElementChild;
      if (event === 'chat.searching' && current) {
        current.innerHTML = '<span class="tlabel">正在检索资料…</span>';
      } else if (event === 'chat.draft') {
        draftText += String(payload.text || '');
        if (current) { current.className = 'ans draft'; current.textContent = draftText; }
        el.scrollTop = el.scrollHeight;
      } else if (event === 'chat.regenerating') {
        draftText = '';
        if (current) { current.className = 'ans thinking'; current.innerHTML =
          '<span class="tlabel">引用校验未通过，正在重新生成…</span>'; }
      } else if (event === 'chat.finalize') {
        finalAnswer = payload;
      } else if (event === 'chat.citations') {
        finalAnswer = finalAnswer || {};
        finalAnswer.citations = payload.citations || [];
        renderAnswer(finalAnswer, question);
      } else if (event === 'chat.error') {
        throw new Error(payload.message || '问答失败');
      }
    });
    if (finalAnswer && !Array.isArray(finalAnswer.citations)) {
      finalAnswer.citations = [];
      renderAnswer(finalAnswer, question);
    }
    var box = document.getElementById('askQ');
    if (box) { box.value = ''; box.style.height = ''; }
  } catch (e) {
    qaHistory.push({ question: question,
                     html: '<div class="ans" role="alert"><div class="ahedge">提问失败：' + esc(e.message) + '</div></div>' });
    qaAnswers.push(null);
    trimQaThread();
    persistQaThread();
    renderQaThread();
  } finally {
    askInFlight = false;
    document.getElementById('askSubmit').disabled = llmInfo.available !== true;
  }
}

/* 问答历史：右栏保留全部问答；引用绑定按卡片索引回查各自的
   citations，避免旧回答的引用点开后跳到新回答的证据。
   会话持久化到 localStorage（去掉 trace 等大字段），重启后还在 */
const QA_HISTORY_LIMIT = 40;
let qaHistory = [];   // [{ question, html }]
let qaAnswers = [];   // 与 qaHistory 对齐的 answer 对象（失败卡为 null）
let askInFlight = false;

function trimQaThread() {
  if (qaHistory.length <= QA_HISTORY_LIMIT) return;
  qaHistory = qaHistory.slice(-QA_HISTORY_LIMIT);
  qaAnswers = qaAnswers.slice(-QA_HISTORY_LIMIT);
}

function persistQaThread() {
  try {
    var slim = qaAnswers.map(function (a) {
      if (!a) return null;
      return { status: a.status, answer: a.answer, mode: a.mode || 'knowledge',
               hedge: a.hedge || '', citations: a.citations || [],
               retrieved: a.retrieved || [] };
    });
    localStorage.setItem('qaThread', JSON.stringify({
      history: qaHistory.slice(-40),
      answers: slim.slice(-40),
    }));
  } catch (e) { /* 存不下就算了，不影响会话 */ }
}

/* 旧存档里的引用标签是 [C8]/C8 文本样式，洗成现在的纯数字圆号 */
function migrateOldQaHtml(h) {
  return String(h)
    .replace(/class="rtag">\[C(\d+)\]</g, 'class="rtag">$1<')
    .replace(/(class="cite-chip"[^>]*>)C(\d+)</g, '$1$2<');
}

function restoreQaThread() {
  try {
    var saved = JSON.parse(localStorage.getItem('qaThread') || 'null');
    if (saved && Array.isArray(saved.history) && Array.isArray(saved.answers) &&
        saved.history.length === saved.answers.length && saved.history.length) {
      qaHistory = saved.history.slice(-QA_HISTORY_LIMIT).map(function (item) {
        return { question: String(item.question || '').slice(0, 8192),
                 html: migrateOldQaHtml(item.html) };
      });
      qaAnswers = saved.answers.slice(-QA_HISTORY_LIMIT);
      renderQaThread();
    }
  } catch (e) { /* 损坏的存档直接忽略 */ }
}

/* 复制为 Markdown（带引用），供每张回答卡的"复制"按钮使用 */
function answerMarkdown(question, a) {
  var lines = ['## ' + question, ''];
  if (a.mode === 'general') lines.push('> 通用回答 · 未引用文件库', '');
  if (a.answer) lines.push(a.answer);
  var refs = (a.citations && a.citations.length) ? a.citations : (a.retrieved || []);
  if (refs.length) {
    lines.push('', '### 引用');
    refs.forEach(function (cite) {
      // 输出目标是剪贴板纯文本 Markdown，不是 HTML，无需转义
      var loc = cite.page ? ('第 ' + cite.page + ' 页') : (cite.section_path || '');
      lines.push('- [' + cite.tag + '] 《' + cite.file_name + '》' +
        (loc ? ' · ' + loc : '') + (cite.snippet ? '：' + cite.snippet : ''));
    });
  }
  return lines.join('\n');
}

function qaHistoryHtml() {
  return qaHistory.map(function (item) {
    return '<div class="qa-q">' + esc(item.question) + '</div>' + item.html;
  }).join('');
}

function renderQaThread() {
  const el = document.getElementById('answerRows');
  el.innerHTML = qaHistoryHtml();
  bindQaThread(el);
  el.scrollTop = el.scrollHeight;
}

function resetQaThread() {
  qaHistory = [];
  qaAnswers = [];
  try { localStorage.removeItem('qaThread'); } catch (e) {}
  document.getElementById('answerRows').innerHTML =
    '<div class="qa-empty"><div><div class="empty-mark"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M9.09 9a3 3 0 015.83 1c0 2-3 3-3 3m.08 4h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></div>' +
    '<div class="empty-title">询问你的知识库</div>' +
    '<div class="empty-meta">回答会附带可定位的原文引用</div></div></div>';
}

function bindQaThread(el) {
  el.querySelectorAll('.ans-act[data-copy]').forEach(function (b) {
    b.onclick = function () {
      var i = +b.dataset.copy;
      var a = qaAnswers[i];
      if (!a || !qaHistory[i]) return;
      navigator.clipboard.writeText(answerMarkdown(qaHistory[i].question, a))
        .then(function () { toast('已复制为 Markdown（含引用）'); })
        .catch(function () { toast('复制失败'); });
    };
  });
  el.querySelectorAll('.ref').forEach(function (r) {
    r.onclick = function () {
      var a = qaAnswers[+r.dataset.ans];
      if (!a) return;
      var citationList = a.citations && a.citations.length ? a.citations : (a.retrieved || []);
      var citation = citationList.find(function (item) { return item.tag === r.dataset.tag; });
      if (citation) showEvidence(citation);
    };
    r.ondblclick = function () {
      window.ordo.revealInFinder(decodeURIComponent(r.dataset.path));
    };
  });
  el.querySelectorAll('.refs-more').forEach(function (b) {
    b.onclick = function () {
      var box = b.closest('.refs');
      var open = box.classList.toggle('expanded');
      b.textContent = open ? '收起引用' : ('展开全部 ' + b.dataset.n + ' 条');
    };
  });
  el.querySelectorAll('.cite-chip').forEach(function (c) {
    c.onclick = function () {
      var ref = Array.from(el.querySelectorAll('.ref')).find(function (r) {
        return r.dataset.ans === c.dataset.ans && r.dataset.tag === c.dataset.tag;
      });
      if (!ref) return;
      var rest = ref.closest('.refs-rest');
      if (rest) {  // 目标在收起区里，先展开
        var more = rest.parentElement.querySelector('.refs-more');
        if (more && !rest.parentElement.classList.contains('expanded')) more.onclick();
      }
      ref.scrollIntoView({ block: 'center' }); ref.onclick(); ref.style.background = 'var(--ink-active)';
      setTimeout(function () { ref.style.background = ''; }, 900);
    };
  });
}

function renderAnswer(a, q) {
  const el = document.getElementById('answerRows');

  if (a.status === 'not_configured') {
    el.innerHTML = qaHistoryHtml() +
      '<div class="ans"><div class="atext" style="color:var(--text-secondary)">还没有配置模型服务。' +
      '</div><div class="askbar" id="openSet" style="border:none;padding:8px 0 0">' +
      '打开设置 → AI 问答</div></div>';
    bindQaThread(el);
    document.getElementById('openSet').onclick = function () { sheetOpen(true, 'model'); };
    return;
  }

  var index = qaAnswers.length;
  let h = '<div class="ans">';
  if (a.hedge) h += '<div class="ahedge">⚠ ' + esc(a.hedge) + '</div>';
  if (a.mode === 'general') {
    h += '<div class="amode">通用回答 · 未引用文件库</div>';
  }

  if (a.status === 'answered') {
    // 连续的 [C8][C9] 合并成一组小圆号，避免正文里出现一长串灰块
    var body = esc(a.answer).replace(/\[C\d{1,3}\](?:\s*\[C\d{1,3}\])*/g, function (run) {
      var tags = run.match(/C\d{1,3}/g) || [];
      return '<span class="cite-run">' + tags.map(function (t) {
        return '<span class="cite-chip" data-ans="' + index + '" data-tag="' + t + '">' +
               t.slice(1) + '</span>';
      }).join('') + '</span>';
    });
    h += '<div class="atext">' + body + '</div>';
    if (a.citations && a.citations.length) {
      h += refsHtml(a.citations, index, '<div class="refs-head">引用 · ' + a.citations.length + ' 条</div>');
    }
  } else if (a.status === 'refused') {
    h += '<div class="atext" style="color:var(--text-secondary)">' + esc(a.answer) + '</div>';
  } else if (a.status === 'fallback') {
    h += refsHtml(a.retrieved || [], index, '');
  }
  if (a.status === 'answered') {
    h += '<div class="ans-acts"><button class="ans-act" type="button" data-copy="' +
      index + '" title="复制为 Markdown（含引用）">复制</button></div>';
  }
  h += '</div>';

  qaHistory.push({ question: q, html: h });
  qaAnswers.push(a);
  trimQaThread();
  persistQaThread();
  renderQaThread();
}

/* 引用列表：超过 4 条时默认收起，点"展开"再看全部 */
function refsHtml(citations, ansIndex, headHtml) {
  var shown = citations.slice(0, 4);
  var rest = citations.slice(4);
  var h = '<div class="refs">' + headHtml +
    shown.map(function (c) { return refHtml(c, ansIndex); }).join('');
  if (rest.length) {
    h += '<div class="refs-rest">' +
      rest.map(function (c) { return refHtml(c, ansIndex); }).join('') + '</div>' +
      '<button class="refs-more" type="button" data-n="' + citations.length + '">' +
      '展开全部 ' + citations.length + ' 条</button>';
  }
  return h + '</div>';
}

function refHtml(c, ansIndex) {
  var loc = c.page ? ('第 ' + c.page + ' 页')
          : (c.section_path ? c.section_path.split(' › ').slice(-1)[0] : '');
  return '<div class="ref" data-ans="' + esc(ansIndex == null ? '' : ansIndex) +
    '" data-tag="' + esc(c.tag) + '" data-path="' + encodedData(c.file_path) + '">' +
    '<span class="rtag">' + esc(String(c.tag || '').replace(/^C/, '')) + '</span>' +
    '<span class="rname">' + esc(c.file_name) + (loc ? ' · ' + esc(loc) : '') + '</span>' +
    '<span class="rsnip">' + esc(c.snippet || '') + '</span></div>';
}

async function doSearch(q) {
  if (!q) { await load(''); return; }
  const version = ++searchVersion;
  loadVersion += 1;  // 搜索开始后，忽略尚未返回的文件列表请求
  document.getElementById('count').textContent = '搜索中…';
  let r = null;
  try {
    r = await api('/search', { method: 'POST', body: JSON.stringify({
      q: q, limit: 40, book_id: activeBook,
    }) });
  } catch (e) { /* 全文搜索失败时退回文件名搜索 */ }
  if (version !== searchVersion) return;
  if (r && r.total > 0) {
    document.getElementById('count').textContent = r.total + ' 个文件';
    renderHits(r, q);
    return;
  }
  await load(q);   // 内容没命中就按文件名找
}

function executeQuery(q) {
  clearTimeout(timer);
  timer = null;
  showListPage();
  var query = String(q || '').trim();
  if (!query) return load('');
  return doSearch(query);
}

let timer;
document.getElementById('q').oninput = function (e) {
  clearTimeout(timer);
  const v = e.target.value.trim();
  timer = setTimeout(function () { executeQuery(v); }, 220);
};

/* ---------- 首次启动引导 ---------- */
function renderSetup() {
  document.getElementById('setupSub').textContent =
    '找到 ' + sources.length + ' 个来源。勾选后才会索引 —— 未勾选的目录不会被访问。';
  document.getElementById('srcList').innerHTML = sources.map(function (s, i) {
    return '<div class="src">' +
      '<input type="checkbox" data-i="' + esc(i) + '"' +

        (s.volatile ? '<span class="badge">易失</span>' : '') + '</div>' +
        '<div class="pth">' + esc(String(s.path || '').replace(new RegExp('^/Users/[^/]+'), '~')) + '</div></div>' +
      '<div class="meta">' +
        (s.doc_count ? '<div><span class="cnt">' + esc(s.doc_count) + '</span> 个文档</div>' : '<div>暂无文档</div>') +

function updateSetupHint() {

document.getElementById('btnSkip').onclick = function () {

  updateSetupHint();
};
// 「重新发现」也走这个弹层 —— 必须有不启用任何来源就能退出的路径
document.getElementById('btnSetupClose').onclick = function () {

};
document.getElementById('setup').addEventListener('click', function (e) {
