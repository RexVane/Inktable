<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>Inktable</title>
<style>
  /* 设计 Token —— PLAN §15 A8：原生极简 */
  :root {
    --bg-app: #fff; --bg-sidebar: #f5f5f7; --bg-card: #f7f7f8;
    --bg-hover: rgba(0,0,0,.05); --bg-selected: rgba(29,185,84,.12);
    --text-primary: #1d1d1f; --text-secondary: #6e6e73;
    --separator: rgba(0,0,0,.1); --accent: #1DB954; --warn: #ff9f0a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg-app: #1e1e1e; --bg-sidebar: #252525; --bg-card: #2a2a2c;
      --bg-hover: rgba(255,255,255,.06); --text-primary: #f5f5f7;
      --text-secondary: #98989d; --separator: rgba(255,255,255,.1);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font: 13px -apple-system, "SF Pro Text", "PingFang SC", sans-serif;
    background: var(--bg-app); color: var(--text-primary);
    -webkit-user-select: none; height: 100vh; display: flex; overflow: hidden;
  }

  /* 侧边栏 */
  .sidebar {
    width: 200px; background: var(--bg-sidebar); flex-shrink: 0;
    border-right: 1px solid var(--separator); display: flex; flex-direction: column;
  }
  .drag { height: 38px; -webkit-app-region: drag; flex-shrink: 0; }
  .nav { flex: 1; overflow-y: auto; padding: 0 8px 12px; }
  .nav-group { font-size: 11px; color: var(--text-secondary); padding: 12px 8px 4px; font-weight: 500; }
  .nav-item {
    padding: 5px 8px; border-radius: 4px; cursor: pointer;
    display: flex; justify-content: space-between; align-items: center; gap: 6px;
  }
  .nav-item:hover { background: var(--bg-hover); }
  .nav-item.on { background: var(--bg-selected); }
  .nav-item .n { color: var(--text-secondary); font-size: 11px; }
  .nav-item .label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* 主区 */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .topbar {
    height: 38px; -webkit-app-region: drag; display: flex; align-items: center;
    padding: 0 16px; gap: 12px; border-bottom: 1px solid var(--separator);
  }
  .search {
    -webkit-app-region: no-drag; flex: 1; max-width: 420px;
    background: var(--bg-hover); border: none; border-radius: 6px;
    padding: 5px 10px; font: inherit; color: var(--text-primary); outline: none;
  }
  .search::placeholder { color: var(--text-secondary); }
  .count { color: var(--text-secondary); font-size: 11px; margin-left: auto; }

  .rows { flex: 1; overflow-y: auto; }
  .row {
    display: flex; align-items: center; gap: 10px; height: 28px;
    padding: 0 16px; cursor: default;
  }
  .row:hover { background: var(--bg-hover); }
  .row.on { background: var(--bg-selected); }
  .icon { width: 16px; text-align: center; flex-shrink: 0; opacity: .75; font-size: 12px; }
  .fname { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fsrc, .fsize, .fdate { color: var(--text-secondary); font-size: 11px; flex-shrink: 0; }
  .fsrc { width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fsize { width: 60px; text-align: right; }
  .fdate { width: 66px; text-align: right; }
  .vol { color: var(--warn); }

  /* 全文搜索结果：文件 + 命中片段 */
  .hit { padding: 10px 16px; border-bottom: 1px solid var(--separator); cursor: default; }
  .hit:hover { background: var(--bg-hover); }
  .hit-head { display: flex; align-items: center; gap: 8px; }
  .hit-name { font-weight: 500; flex: 1; overflow: hidden;
              text-overflow: ellipsis; white-space: nowrap; }
  .hit-meta { color: var(--text-secondary); font-size: 11px; flex-shrink: 0; }
  .snip {
    margin: 6px 0 0 24px; padding-left: 10px;
    border-left: 2px solid var(--separator);
    color: var(--text-secondary); font-size: 12px; line-height: 1.55;
  }
  .snip .loc {
    display: inline-block; font-size: 10px; color: var(--accent);
    background: var(--bg-selected); padding: 0 5px; border-radius: 3px;
    margin-right: 6px; vertical-align: 1px;
  }
  .snip em { font-style: normal; color: var(--text-primary);
             background: rgba(29,185,84,.2); border-radius: 2px; padding: 0 1px; }
  .mode {
    font-size: 11px; color: var(--text-secondary); padding: 8px 16px;
    border-bottom: 1px solid var(--separator);
  }

  .empty { padding: 60px 20px; text-align: center; color: var(--text-secondary); }
  .empty button {
    font: inherit; margin-top: 14px; padding: 6px 16px; border: none; border-radius: 6px;
    background: var(--accent); color: #fff; font-weight: 500; cursor: pointer;
  }

  /* 来源引导（首次启动） */
  .setup { position: absolute; inset: 0; background: var(--bg-app); z-index: 10;
           display: flex; flex-direction: column; }
  .setup .body { flex: 1; overflow-y: auto; padding: 0 32px 24px; }
  .setup h1 { font-size: 19px; margin: 0 0 6px; }
  .setup .sub { color: var(--text-secondary); margin-bottom: 20px; }
  .src {
    display: flex; align-items: center; gap: 12px; padding: 11px 4px;
    border-bottom: 1px solid var(--separator);
  }
  .src input { width: 15px; height: 15px; accent-color: var(--accent); cursor: pointer; }
  .src .info { flex: 1; min-width: 0; }
  .src .nm { font-weight: 500; display: flex; align-items: center; gap: 6px; }
  .src .pth { color: var(--text-secondary); font-size: 11px; margin-top: 2px;
              overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge { font-size: 10px; padding: 1px 5px; border-radius: 3px;
           background: rgba(255,159,10,.18); color: var(--warn); }
  .src .meta { text-align: right; font-size: 11px; color: var(--text-secondary); flex-shrink: 0; }
  .src .cnt { color: var(--accent); font-weight: 600; font-size: 14px; }
  .setup .foot { padding: 16px 32px; border-top: 1px solid var(--separator);
                 display: flex; align-items: center; gap: 12px; }
  .setup button { font: inherit; padding: 6px 16px; border: none; border-radius: 6px;
                  background: var(--accent); color: #fff; font-weight: 500; cursor: pointer; }
  .setup button:disabled { opacity: .4; cursor: default; }
  .setup button.ghost { background: transparent; color: var(--text-secondary);
                        border: 1px solid var(--separator); }
  .hint { color: var(--text-secondary); font-size: 11px; }

  /* 监听状态：常驻但不喧哗 —— 用户需要知道"它在盯着"，而不是被提示打扰 */
  .live {
    display: flex; align-items: center; gap: 5px; flex-shrink: 0;
    color: var(--text-secondary); font-size: 11px; margin-left: auto;
  }
  .live .dot {
    width: 6px; height: 6px; border-radius: 50%; background: var(--accent);
    flex-shrink: 0;
  }
  .live.busy .dot { animation: pulse 1.1s ease-in-out infinite; }
  .live.off .dot { background: var(--text-secondary); opacity: .4; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .25 } }

  /* 新文件到达提示：底部浮出，几秒后自己消失 */
  .toast {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%) translateY(60px);
    background: var(--text-primary); color: var(--bg-app);
    padding: 7px 14px; border-radius: 7px; font-size: 12px;
    box-shadow: 0 4px 16px rgba(0,0,0,.22); opacity: 0;
    transition: opacity .22s, transform .22s; pointer-events: none; z-index: 20;
    max-width: 70vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* 设置面板 */
  .gear {
    -webkit-app-region: no-drag; cursor: pointer; flex-shrink: 0;
    color: var(--text-secondary); font-size: 14px; padding: 2px 4px;
    border-radius: 4px; line-height: 1;
  }
  .gear:hover { background: var(--bg-hover); color: var(--text-primary); }

  .sheet {
    position: fixed; inset: 0; background: rgba(0,0,0,.28);
    display: none; align-items: center; justify-content: center; z-index: 30;
  }
  .sheet.show { display: flex; }
  .sheet-box {
    background: var(--bg-app); border-radius: 10px; width: 560px;
    max-width: 92vw; max-height: 78vh; display: flex; flex-direction: column;
    box-shadow: 0 12px 48px rgba(0,0,0,.3); overflow: hidden;
  }
  .sheet-head {
    padding: 14px 18px 10px; display: flex; align-items: baseline; gap: 10px;
    border-bottom: 1px solid var(--separator);
  }
  .sheet-head h2 { font-size: 15px; margin: 0; font-weight: 600; }
  .sheet-head .sub { color: var(--text-secondary); font-size: 11px; }
  .sheet-body { flex: 1; overflow-y: auto; padding: 4px 18px 14px; }
  .sheet-foot {
    padding: 12px 18px; border-top: 1px solid var(--separator);
    display: flex; gap: 8px; align-items: center;
  }
  .srow {
    display: flex; align-items: center; gap: 10px; padding: 11px 0;
    border-bottom: 1px solid var(--separator);
  }
  .srow:last-child { border-bottom: none; }
  .srow .info { flex: 1; min-width: 0; }
  .srow .nm { font-weight: 500; display: flex; align-items: center; gap: 6px; }
  .srow .pth {
    color: var(--text-secondary); font-size: 11px; margin-top: 2px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .srow .acts { display: flex; gap: 6px; flex-shrink: 0; }
  .mini {
    font: inherit; font-size: 11px; padding: 3px 9px; border-radius: 5px;
    border: 1px solid var(--separator); background: transparent;
    color: var(--text-secondary); cursor: pointer;
  }
  .mini:hover { background: var(--bg-hover); color: var(--text-primary); }
  .mini.danger:hover { background: rgba(255,59,48,.12); color: #ff3b30; border-color: #ff3b30; }
  .tag {
    font-size: 10px; padding: 1px 5px; border-radius: 3px;
    background: var(--bg-hover); color: var(--text-secondary);
  }
  .tag.live { background: rgba(29,185,84,.16); color: var(--accent); }
  .tag.gone { background: rgba(255,59,48,.14); color: #ff3b30; }
</style>
</head>
<body>
  <div class="sidebar">
    <div class="drag"></div>
    <div class="nav" id="nav"></div>
  </div>
  <div class="main">
    <div class="topbar">
      <input class="search" id="q" placeholder="搜索文件内容或文件名…" />
      <span class="count" id="count"></span>
      <span class="live off" id="live" title=""><span class="dot"></span><span id="liveText"></span></span>
      <span class="gear" id="gear" title="设置">⚙</span>
    </div>
    <div class="rows" id="rows"><div class="empty">加载中…</div></div>
  </div>
  <div class="toast" id="toast"></div>

  <div class="sheet" id="sheet">
    <div class="sheet-box">
      <div class="sheet-head">
        <h2>文件来源</h2>
        <span class="sub" id="sheetSub"></span>
      </div>
      <div class="sheet-body" id="sheetBody"></div>
      <div class="sheet-foot">
        <button class="mini" id="btnAdd">添加目录…</button>
        <button class="mini" id="btnRescan">重新发现</button>
        <span class="hint" id="sheetHint" style="margin-left:auto"></span>
        <button class="mini" id="btnClose">完成</button>
      </div>
    </div>
  </div>

  <div class="setup" id="setup" style="display:none">
    <div class="drag"></div>
    <div class="body">
      <h1>发现文件来源</h1>
      <div class="sub" id="setupSub">正在扫描…</div>
      <div id="srcList"></div>
    </div>
    <div class="foot">
      <button id="btnEnable" disabled>启用并开始索引</button>
      <button class="ghost" id="btnSkip">全不选</button>
      <span class="hint" id="setupHint"></span>
    </div>
  </div>

<script>
let sources = [], files = [], activeSource = null, stats = null;

async function api(path, opts = {}) {
  const info = await window.inktable.getSidecarInfo();
  if (!info) throw new Error('sidecar 未就绪');
  const r = await fetch('http://127.0.0.1' + ':' + info.port + path, {
    ...opts,
    headers: { 'Content-Type': 'application/json',
               Authorization: 'Bearer ' + info.token, ...(opts.headers || {}) },
  });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

const ICONS = { '.pdf':'▤', '.docx':'▤', '.doc':'▤', '.md':'▤', '.txt':'▤',
                '.xlsx':'▦', '.xls':'▦', '.csv':'▦', '.pptx':'▥', '.ppt':'▥',
                '.zip':'▣', '.rar':'▣', '.7z':'▣',
                '.png':'▨', '.jpg':'▨', '.jpeg':'▨', '.heic':'▨',
                '.mp4':'▷', '.mov':'▷', '.mp3':'♪', '.m4a':'♪' };

function fmtSize(b) {
  if (!b) return '';
  if (b < 1024) return b + ' B';
  if (b < 1048576) return (b / 1024).toFixed(0) + ' KB';
  if (b < 1073741824) return (b / 1048576).toFixed(1) + ' MB';
  return (b / 1073741824).toFixed(1) + ' GB';
}
function fmtDate(ts) {
  if (!ts) return '';
  const days = Math.floor((Date.now() / 1000 - ts) / 86400);
  if (days <= 0) return '今天';
  if (days === 1) return '昨天';
  if (days < 7) return days + ' 天前';
  const d = new Date(ts * 1000);
  return (d.getMonth() + 1) + '月' + d.getDate() + '日';
}

function renderNav() {
  const el = document.getElementById('nav');
  let h = '<div class="nav-group">文件库</div>';
  h += '<div class="nav-item' + (activeSource === null ? ' on' : '') + '" data-src="">' +
       '<span class="label">全部文件</span><span class="n">' + (stats ? stats.files : '') + '</span></div>';
  if (stats && stats.deduped > 0) {
    h += '<div class="nav-item" data-dup="1"><span class="label">重复内容</span>' +
         '<span class="n">' + stats.deduped + '</span></div>';
  }
  if (stats && stats.by_source.length) {
    h += '<div class="nav-group">来源</div>';
    stats.by_source.forEach(function (s) {
      h += '<div class="nav-item' + (activeSource === s.name ? ' on' : '') + '" data-src="' + s.name + '">' +
           '<span class="label">' + s.name + '</span><span class="n">' + s.c + '</span></div>';
    });
  }
  if (stats && stats.by_ext.length) {
    h += '<div class="nav-group">类型</div>';
    stats.by_ext.slice(0, 6).forEach(function (e) {
      h += '<div class="nav-item" data-ext="' + e.ext + '">' +
           '<span class="label">' + (e.ext || '无扩展名') + '</span><span class="n">' + e.c + '</span></div>';
    });
  }
  el.innerHTML = h;
  el.querySelectorAll('.nav-item').forEach(function (it) {
    it.onclick = function () {
      activeSource = it.dataset.src || null;
      load(document.getElementById('q').value);
    };
  });
}

function renderRows() {
  const el = document.getElementById('rows');
  if (!files.length) {
    el.innerHTML = '<div class="empty">没有匹配的文件</div>';
    return;
  }
  el.innerHTML = files.map(function (f) {
    return '<div class="row" data-path="' + encodeURIComponent(f.path) + '">' +
      '<span class="icon">' + (ICONS[f.ext] || '▢') + '</span>' +
      '<span class="fname">' + f.name + '</span>' +
      '<span class="fsrc' + (f.volatile ? ' vol' : '') + '">' + (f.source_name || '') + '</span>' +
      '<span class="fsize">' + fmtSize(f.size) + '</span>' +
      '<span class="fdate">' + fmtDate(f.mtime) + '</span>' +
    '</div>';
  }).join('');
  el.querySelectorAll('.row').forEach(function (r) {
    r.ondblclick = function () {
      window.inktable.revealInFinder(decodeURIComponent(r.dataset.path));
    };
  });
}

async function load(q) {
  const params = new URLSearchParams({ limit: '300' });
  if (q) params.set('q', q);
  const d = await api('/files?' + params);
  files = d.files;
  if (activeSource) files = files.filter(function (f) { return f.source_name === activeSource; });
  document.getElementById('count').textContent = files.length + ' 个文件';
  renderRows();
}

/* 全文搜索：搜内容而非文件名。文件名匹配与内容匹配合并展示 */
function esc(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function highlight(text, q) {
  const safe = esc(text);
  if (!q) return safe;
  // 逐字符高亮：中文没有词边界，按查询串里的字符片段匹配
  const terms = q.split(/\s+/).filter(Boolean).map(esc);
  let out = safe;
  terms.forEach(function (t) {
    if (t.length < 1) return;
    out = out.split(t).join('<em>' + t + '</em>');
  });
  return out;
}

function renderHits(result, q) {
  const el = document.getElementById('rows');
  if (!result.files.length) {
    el.innerHTML = '<div class="empty">没有匹配的内容<br>' +
      '<span style="font-size:11px">试试其他关键词，或检查文档是否已完成索引</span></div>';
    return;
  }
  let h = '<div class="mode">全文搜索 · 命中 ' + result.total + ' 个文件' +
          (result.routes && result.routes.vector ? ' · 含语义匹配' : '') + '</div>';
  if (result.hedge) {
    h += '<div class="mode" style="color:var(--warn)">⚠ ' + esc(result.hedge) + '</div>';
  }
  h += result.files.map(function (f) {
    const snips = f.snippets.map(function (s) {
      const loc = s.page ? ('第 ' + s.page + ' 页')
                : (s.section_path ? s.section_path.split(' › ').slice(-1)[0] : '');
      return '<div class="snip">' + (loc ? '<span class="loc">' + esc(loc) + '</span>' : '') +
             highlight(s.text, q) + '</div>';
    }).join('');
    return '<div class="hit" data-path="' + encodeURIComponent(f.path) + '">' +
      '<div class="hit-head">' +
        '<span class="icon">' + (ICONS[f.ext] || '▢') + '</span>' +
        '<span class="hit-name">' + esc(f.name) + '</span>' +
        '<span class="hit-meta' + (f.volatile ? ' vol' : '') + '">' +
          esc(f.source_name || '') + '</span>' +
      '</div>' + snips + '</div>';
  }).join('');
  el.innerHTML = h;
  el.querySelectorAll('.hit').forEach(function (r) {
    r.ondblclick = function () {
      window.inktable.revealInFinder(decodeURIComponent(r.dataset.path));
    };
  });
}

async function doSearch(q) {
  if (!q) { await load(''); return; }
  document.getElementById('count').textContent = '搜索中…';
  try {
    const r = await api('/search', { method: 'POST', body: JSON.stringify({ q: q, limit: 40 }) });
    if (r.total > 0) {
      document.getElementById('count').textContent = r.total + ' 个文件';
      renderHits(r, q);
      return;
    }
  } catch (e) { /* 全文搜索失败时退回文件名搜索 */ }
  await load(q);   // 内容没命中就按文件名找
}

let timer;
document.getElementById('q').oninput = function (e) {
  clearTimeout(timer);
  const v = e.target.value.trim();
  timer = setTimeout(function () { doSearch(v); }, 200);
};

/* ---------- 首次启动引导 ---------- */
function renderSetup() {
  document.getElementById('setupSub').textContent =
    '找到 ' + sources.length + ' 个来源。勾选后才会索引 —— 未勾选的目录不会被访问。';
  document.getElementById('srcList').innerHTML = sources.map(function (s, i) {
    return '<div class="src">' +
      '<input type="checkbox" data-i="' + i + '"' + (s.doc_count > 0 ? ' checked' : '') + '>' +
      '<div class="info"><div class="nm">' + s.name +
        (s.volatile ? '<span class="badge">易失</span>' : '') + '</div>' +
        '<div class="pth">' + s.path.replace(new RegExp('^/Users/[^/]+'), '~') + '</div></div>' +
      '<div class="meta">' +
        (s.doc_count ? '<div><span class="cnt">' + s.doc_count + '</span> 个文档</div>' : '<div>暂无文档</div>') +
      '</div></div>';
  }).join('');
  document.querySelectorAll('.src input').forEach(function (cb) {
    cb.onchange = updateSetupHint;
  });
  updateSetupHint();
}
function updateSetupHint() {
  const n = document.querySelectorAll('.src input:checked').length;
  document.getElementById('btnEnable').disabled = n === 0;
  document.getElementById('setupHint').textContent = n ? '已选 ' + n + ' 个' : '';
}
document.getElementById('btnSkip').onclick = function () {
  document.querySelectorAll('.src input').forEach(function (cb) { cb.checked = false; });
  updateSetupHint();
};
document.getElementById('btnEnable').onclick = async function () {
  const btn = this;
  btn.disabled = true;
  const chosen = [].slice.call(document.querySelectorAll('.src input:checked'))
    .map(function (cb) { return sources[cb.dataset.i]; });
  for (let i = 0; i < chosen.length; i++) {
    const s = chosen[i];
    btn.textContent = '正在扫描 ' + (i + 1) + '/' + chosen.length + '…';
    try {
      await api('/sources/enable', { method: 'POST', body: JSON.stringify({
        name: s.name, path: s.path, kind: s.kind,
        discovered_by: s.discovered_by, volatile: s.volatile }) });
    } catch (e) { /* 单个来源失败不阻断其余 */ }
  }
  // 扫描只登记文件，正文索引另起一步 —— 让用户先看到文件列表
  btn.textContent = '正在解析文档内容…';
  document.getElementById('setup').style.display = 'none';
  await boot();
  try { await api('/watch/start', { method: 'POST' }); } catch (e) {}
  startWatchPolling();
  runIndexing();
};

/* 后台索引：解析正文并建全文索引，完成前顶部显示进度 */
async function runIndexing() {
  const countEl = document.getElementById('count');
  try {
    const st = await api('/index/status');
    if (!st.pending) return;
    countEl.textContent = '正在解析 ' + st.pending + ' 个文档…';
    const r = await api('/index/run', { method: 'POST', body: JSON.stringify({ limit: 2000 }) });
    countEl.textContent = '已索引 ' + r.indexed + ' 个文档，可搜索内容了';
    setTimeout(function () {
      if (!document.getElementById('q').value) load('');
    }, 2500);
  } catch (e) { /* 索引失败不影响文件浏览 */ }
}

/* ---------- 实时监听 ----------
   后端 watcher 在文件落地后自动入库索引（§11.1）。前端做两件事：
   ① 让"它在盯着"这件事可见 —— 顶栏一个常驻小圆点
   ② 新文件进来时刷新列表，并提示一句，不打断当前操作
*/
let liveSeen = 0;          // 上次看到的已入库计数
let livePollTimer = null;

function setLive(state, text, title) {
  const el = document.getElementById('live');
  el.className = 'live' + (state ? ' ' + state : '');
  document.getElementById('liveText').textContent = text || '';
  el.title = title || '';
}

let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { el.classList.remove('show'); }, 3200);
}

async function pollWatch() {
  try {
    const st = await api('/watch/status');
    const n = st.watched.length;
    if (!st.running || !n) {
      setLive('off', '未监听', '没有已启用的来源');
    } else {
      setLive('', '监听中', n + ' 个目录 · 已自动入库 ' + st.counters.indexed + ' 个文件');
    }

    const done = st.counters.indexed;
    if (liveSeen !== 0 && done > liveSeen) {
      // 有新文件被自动索引了 —— 刷新当前视图并提示
      const latest = st.activity[0];
      const added = done - liveSeen;
      toast(latest && added === 1
        ? '已收录「' + latest.name + '」'
        : '已收录 ' + added + ' 个新文件');

      stats = await api('/stats');
      renderNav();
      const q = document.getElementById('q').value.trim();
      if (q) { doSearch(q); } else { load(''); }
    }
    liveSeen = done;
  } catch (e) {
    setLive('off', '', '监听状态获取失败');
  }
}

function startWatchPolling() {
  if (livePollTimer) return;
  pollWatch();
  livePollTimer = setInterval(pollWatch, 3000);
}

/* ---------- 设置：来源管理 ---------- */
function sheetOpen(on) {
  document.getElementById('sheet').classList.toggle('show', on);
  if (on) renderSources();
}

async function renderSources() {
  const body = document.getElementById('sheetBody');
  body.innerHTML = '<div class="empty" style="padding:30px">加载中…</div>';
  let list;
  try {
    list = (await api('/sources')).sources;
  } catch (e) {
    body.innerHTML = '<div class="empty" style="padding:30px">加载失败：' + esc(e.message) + '</div>';
    return;
  }

  const on = list.filter(function (s) { return s.enabled; }).length;
  document.getElementById('sheetSub').textContent =
    list.length + ' 个来源 · ' + on + ' 个正在监听';

  if (!list.length) {
    body.innerHTML = '<div class="empty" style="padding:30px">还没有来源<br>' +
      '<span style="font-size:11px">点「重新发现」自动查找，或手动添加目录</span></div>';
    return;
  }

  body.innerHTML = list.map(function (s) {
    const tags = [];
    if (!s.exists) tags.push('<span class="tag gone">目录不存在</span>');
    else if (s.watching) tags.push('<span class="tag live">监听中</span>');
    else if (s.enabled) tags.push('<span class="tag">已启用</span>');
    else tags.push('<span class="tag">已停用</span>');
    if (s.volatile) tags.push('<span class="badge">易失</span>');

    const acts = s.enabled
      ? '<button class="mini" data-act="disable" data-id="' + s.id + '">停用</button>'
      : '<button class="mini" data-act="enable" data-id="' + s.id +
        '" data-path="' + encodeURIComponent(s.path) + '" data-name="' + esc(s.name) + '">启用</button>';

    return '<div class="srow">' +
      '<div class="info">' +
        '<div class="nm">' + esc(s.name) + tags.join('') + '</div>' +
        '<div class="pth">' + esc(s.path.replace(new RegExp('^/Users/[^/]+'), '~')) +
          ' · ' + s.file_count + ' 个文件</div>' +
      '</div>' +
      '<div class="acts">' + acts +
        '<button class="mini danger" data-act="remove" data-id="' + s.id +
        '" data-name="' + esc(s.name) + '">移除</button>' +
      '</div></div>';
  }).join('');

  body.querySelectorAll('button[data-act]').forEach(function (b) {
    b.onclick = function () { onSourceAction(b); };
  });
}

async function onSourceAction(btn) {
  const act = btn.dataset.act;
  const hint = document.getElementById('sheetHint');

  if (act === 'remove') {
    // 破坏性操作要说清后果：会清索引，但不会动磁盘上的文件
    const ok = confirm('移除「' + btn.dataset.name + '」？\n\n' +
      '将清除它的文件记录与搜索索引。\n磁盘上的原文件不会被删除。');
    if (!ok) return;
  }

  btn.disabled = true;
  hint.textContent = '处理中…';
  try {
    if (act === 'disable') {
      await api('/sources/disable', { method: 'POST', body: JSON.stringify({ source_id: +btn.dataset.id }) });
    } else if (act === 'remove') {
      await api('/sources/remove', { method: 'POST', body: JSON.stringify({ source_id: +btn.dataset.id }) });
    } else if (act === 'enable') {
      await api('/sources/enable', { method: 'POST', body: JSON.stringify({
        name: btn.dataset.name, path: decodeURIComponent(btn.dataset.path) }) });
      runIndexing();
    }
    hint.textContent = '';
    await renderSources();
    stats = await api('/stats');
    renderNav();
    await load(document.getElementById('q').value.trim());
    pollWatch();
  } catch (e) {
    hint.textContent = '失败：' + e.message;
    btn.disabled = false;
  }
}

document.getElementById('gear').onclick = function () { sheetOpen(true); };
document.getElementById('btnClose').onclick = function () { sheetOpen(false); };
document.getElementById('sheet').onclick = function (e) {
  if (e.target.id === 'sheet') sheetOpen(false);   // 点遮罩关闭
};

document.getElementById('btnAdd').onclick = async function () {
  const dir = await window.inktable.pickDirectory();
  if (!dir) return;
  const hint = document.getElementById('sheetHint');
  hint.textContent = '正在扫描…';
  try {
    await api('/sources/add', { method: 'POST', body: JSON.stringify({ path: dir }) });
    hint.textContent = '';
    await renderSources();
    stats = await api('/stats');
    renderNav();
    await load('');
    runIndexing();
    pollWatch();
  } catch (e) {
    hint.textContent = '添加失败：' + e.message;
  }
};

document.getElementById('btnRescan').onclick = async function () {
  const hint = document.getElementById('sheetHint');
  hint.textContent = '正在查找…';
  try {
    const found = (await api('/sources/discover', { method: 'POST' })).sources;
    const known = new Set((await api('/sources')).sources.map(function (s) { return s.path; }));
    const fresh = found.filter(function (s) { return !known.has(s.path) && s.doc_count > 0; });
    if (!fresh.length) {
      hint.textContent = '没有发现新来源';
      return;
    }
    // 发现结果不自动启用 —— §1 约束 4：用户没同意的目录不监听
    sources = fresh;
    sheetOpen(false);
    document.getElementById('setup').style.display = 'flex';
    renderSetup();
  } catch (e) {
    hint.textContent = '查找失败：' + e.message;
  }
};

document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') sheetOpen(false);
  if ((e.metaKey || e.ctrlKey) && e.key === ',') { e.preventDefault(); sheetOpen(true); }
  if ((e.metaKey || e.ctrlKey) && e.key === 'f') {
    e.preventDefault();
    document.getElementById('q').focus();
    document.getElementById('q').select();
  }
});

async function boot() {
  stats = await api('/stats');
  if (stats.files === 0) {
    document.getElementById('setup').style.display = 'flex';
    sources = (await api('/sources/discover', { method: 'POST' })).sources;
    renderSetup();
    return;
  }
  renderNav();
  await load('');
}

boot().then(async function () {
  if (!stats || stats.files === 0) return;
  // 挂上所有已启用来源的监听（幂等，重复调用安全）
  try { await api('/watch/start', { method: 'POST' }); } catch (e) {}
  startWatchPolling();
  // 上次索引未完成（应用被关掉、期间新增了文件）时自动续上
  runIndexing();
}).catch(function (e) {
  document.getElementById('rows').innerHTML = '<div class="empty">启动失败：' + e.message + '</div>';
});
</script>
</body>
</html>
