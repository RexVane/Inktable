  * { box-sizing: border-box; }
  /* color-scheme 由各主题块自己声明（深色四套 dark、浅色三套 light）， */
  /* 这里不再写 light dark，否则原生滚动条会跟系统而不是跟主题。 */
  body { margin: 0; height: 100vh; overflow: hidden; -webkit-user-select: none; }

<script>
// 首帧前定妥主题，否则浅色主题用户会先看到一帧默认的 Nebula 深色。
// 只做 data-theme 这一件事；完整的主题引擎在下方主脚本里（同一套折算规则，
// 这里刻意重复而不抽函数——主脚本在 </body> 之后才执行，抽不出来）。
(function () {
  try {
    var pairs = {
      nebula: ['silver', 'nebula'], silver: ['silver', 'steel'],
      steel: ['silver', 'steel'], limestone: ['limestone', 'coal'],
      coal: ['limestone', 'coal'], linen: ['linen', 'moss'],
      moss: ['linen', 'moss']
    };
    var raw = localStorage.getItem('uiTheme');
    var pref = raw === 'light' ? 'silver'
      : (raw === 'dark' || raw === 'system' || raw === null || !pairs[raw]) ? 'nebula' : raw;
    var f = localStorage.getItem('uiFollowSystem');
    // 与主脚本 themeFollowsSystem() 同一判据：仅显式的旧值 'system' 跟随，
    // 未设置过则用 nebula 的默认（不跟随，Nebula 深蓝）。
    var follow = raw === 'system' ? true : (f === null ? false : f === '1');
    var id = pref;
    if (follow) {
      id = window.matchMedia('(prefers-color-scheme: dark)').matches
        ? pairs[pref][1] : pairs[pref][0];
    }
    document.documentElement.setAttribute('data-theme', id);
  } catch (e) { /* 取不到偏好就用默认 Nebula */ }
})();
</script>

<script>
// 平台类：非 macOS 没有窗口红绿灯，CSS 据此去掉预留空隙（见 workbench.css 平台适配段）
document.documentElement.classList.add(
  'is-' + ((window.inktable && window.inktable.platform) || 'unknown'));

const PAGE_SIZE = 300;
let sources = [], files = [], activeSource = null, stats = null;
let categories = { tree: [], unclassified: 0 };
let activeCategory = null;   // 数字=分类id, 'none'=未分类, null=不过滤
let books = [];
let activeBook = null;
let activeExt = null;        // null=不过滤，空字符串=无扩展名
let activeDir = null;        // 文件树目录过滤（绝对路径前缀）
let activeRecent = null;     // 时间线：7=最近一周，30=最近一月
let activeDuplicate = false;
let filesTotal = 0;
let currentQuery = '';
let loadVersion = 0;
let searchVersion = 0;
let llmInfo = { configured: false };
let selectedEvidence = null;
let detailVersion = 0;
let autoClassifyPending = null;

function initSplitters() {
  var layout = document.querySelector('.content-layout');
  var splitNav = document.getElementById('splitNav');
  var splitQa = document.getElementById('splitQa');
  if (!layout || !splitNav || !splitQa) return;

  var navWidth = 214;
  var qaWidth = 330;
  // 抽屉开合与宽度分开存：收起再展开要回到用户自己拖出来的宽度，
  // 而不是回到默认值。
  var navOpen = true;
  var qaOpen = true;
  try {
    var saved = JSON.parse(localStorage.getItem('layoutCols') || '{}') || {};
    if (saved.nav) navWidth = Math.max(160, Math.min(360, saved.nav));
    if (saved.qa) qaWidth = Math.max(260, Math.min(520, saved.qa));
    if (saved.navOpen === false) navOpen = false;
    if (saved.qaOpen === false) qaOpen = false;
  } catch (e) {}

  var navPanel = document.getElementById('navPanel');
  var qaPanel = document.getElementById('qaPanel');
  var toggleNav = document.getElementById('toggleNav');
  var toggleQa = document.getElementById('toggleQa');

  function save() {
    try {
      localStorage.setItem('layoutCols', JSON.stringify({
        nav: navWidth, qa: qaWidth, navOpen: navOpen, qaOpen: qaOpen,
      }));
    } catch (e) {}
  }

  function updateCols() {
    // 收起的那栏连同它的 splitter 一起归零：留着 5px 的拖拽条会在贴边处
    // 留下一道摸不到来源的缝。
    layout.style.gridTemplateColumns =
      (navOpen ? navWidth + 'px 5px' : '0px 0px') +
      ' minmax(360px, 1fr) ' +
      (qaOpen ? '5px ' + qaWidth + 'px' : '0px 0px');
    // visibility 而不是只靠 overflow：0 宽的栏里若还留着可聚焦控件，
    // Tab 会跳进一个看不见的地方。
    if (navPanel) navPanel.classList.toggle('is-collapsed', !navOpen);
    if (qaPanel) qaPanel.classList.toggle('is-collapsed', !qaOpen);
    splitNav.classList.toggle('is-collapsed', !navOpen);
    splitQa.classList.toggle('is-collapsed', !qaOpen);
    if (toggleNav) {
      toggleNav.classList.toggle('on', navOpen);
      toggleNav.setAttribute('aria-expanded', navOpen ? 'true' : 'false');
    }
    if (toggleQa) {
      toggleQa.classList.toggle('on', qaOpen);
      toggleQa.setAttribute('aria-expanded', qaOpen ? 'true' : 'false');
    }
  }
  updateCols();

  window.toggleDrawer = function (which) {
    if (which === 'nav') navOpen = !navOpen;
    else qaOpen = !qaOpen;
    updateCols();
    save();
  };

  if (toggleNav) toggleNav.addEventListener('click', function () { window.toggleDrawer('nav'); });
  if (toggleQa) toggleQa.addEventListener('click', function () { window.toggleDrawer('qa'); });

  function startDrag(e, isNav) {
    e.preventDefault();
    var startX = e.clientX;
    var startNav = navWidth;
    var startQa = qaWidth;
    document.body.classList.add('resizing');

    function onMove(ev) {
      if (isNav) {
        navWidth = Math.max(160, Math.min(360, startNav + (ev.clientX - startX)));
      } else {
        qaWidth = Math.max(260, Math.min(520, startQa - (ev.clientX - startX)));
      }
      updateCols();
    }

    function onUp() {
      document.body.classList.remove('resizing');
      window.removeEventListener('mousemove', onMove);
      window.removeEventListener('mouseup', onUp);
      save();
    }

    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);
  }

  splitNav.addEventListener('mousedown', function (e) { startDrag(e, true); });
  splitQa.addEventListener('mousedown', function (e) { startDrag(e, false); });
}

function currentScopeLabel() {
  if (activeBook !== null) {
    var book = books.find(function (item) { return item.id === activeBook; });
    return book ? ('文件书 · ' + book.name) : '当前文件书';
  }
  if (activeSource !== null) return '来源 · ' + activeSource;
  if (activeCategory !== null) {
    if (activeCategory === 'none') return '未分类资料';
    var category = categories.tree.find(function (item) { return item.id === activeCategory; });
    return category ? ('分类 · ' + category.name) : '当前分类';
  }
  if (activeDir !== null) {
    var segs = activeDir.split(/[\\/]/).filter(Boolean);
    return '目录 · ' + (segs[segs.length - 1] || activeDir);
  }
  if (activeRecent === 7) return '最近一周';
  if (activeRecent === 30) return '最近一月';
  if (activeExt !== null) return '类型 · ' + (activeExt || '无扩展名');
  if (activeDuplicate) return '重复内容';
  return '全部内容';
}

function updateWorkbenchChrome() {
  var scope = currentScopeLabel();
  document.getElementById('topbarScope').textContent = scope;
  document.getElementById('q').placeholder = '搜索文件内容或文件名…';
  document.getElementById('querySubmit').title = '搜索';
  document.getElementById('querySubmit').setAttribute('aria-label', '搜索');
}

function updateModelState(status) {
  llmInfo = status || { configured: false };
  var button = document.getElementById('modelState');
  var submit = document.getElementById('askSubmit');
  if (!button || !submit) return;
  if (llmInfo.available === true) {
    button.className = 'model-state ready';
    button.textContent = '模型可用';
    button.title = (llmInfo.model || '当前模型') + '连接正常';
    submit.disabled = false;
  } else if (llmInfo.available === false && llmInfo.configured) {
    button.className = 'model-state error';
    button.textContent = llmInfo.message || '模型不可用';
    button.title = '点击重新检测连接';
    submit.disabled = true;
  } else if (llmInfo.configured) {
    button.className = 'model-state pending';
    button.textContent = '检测模型';
    button.title = '已配置，点击检测连接';
    submit.disabled = true;
  } else {
    button.className = 'model-state off';
    button.textContent = '未配置模型';
    button.title = '点击打开模型设置';
    submit.disabled = true;
  }
}

/* 启动/服务恢复后自动检测模型可用性 —— 不阻塞启动流程，
   后台跑一次真实补全探测，右上角状态直接给出可用/不可用结论 */
let modelAutoCheckPending = false;

function scheduleModelAutoCheck() {
  if (modelAutoCheckPending) return;
  if (!llmInfo.configured || llmInfo.available === true) return;
  modelAutoCheckPending = true;
  testModelConnection().finally(function () {
    modelAutoCheckPending = false;
  });
}

async function testModelConnection(hint) {
  var button = document.getElementById('modelState');
  button.className = 'model-state checking';
  button.textContent = '检测中…';
  button.disabled = true;
  if (hint) hint.textContent = '正在检测模型连接…';
  try {
    var status = await api('/settings/llm/test', { method: 'POST' });
    updateModelState(status);
    if (hint) hint.textContent = status.message || (status.available ? '模型连接正常' : '模型不可用');
    return status;
  } catch (e) {
    var failed = { configured: llmInfo.configured, available: false, code: 'unreachable', message: '检测失败：' + e.message };
    updateModelState(failed);
    if (hint) hint.textContent = failed.message;
    return failed;
  } finally {
    button.disabled = false;
  }
}

function renderKnowledgeEmpty() {
  document.getElementById('count').textContent = '';
  document.getElementById('rows').innerHTML = '<div class="workbench-empty"><div><div class="empty-mark"><svg viewBox="0 0 24 24"><path d="M10 18a8 8 0 100-16 8 8 0 000 16zm11 3l-6-6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg></div><div class="empty-title">没有内容</div></div></div>';
  clearEvidence();
}

/* 中栏两页切换：列表页（搜索框 + 文件列表）⇄ 详情页（原文/证据 + 返回键）。
   左栏只放导航，不再出现上下两个滚动区互相遮挡 */
let listTitle = '文件管理';
let detailPageOpen = false;

function setListTitle(t) {
  listTitle = t;
  if (!detailPageOpen) document.getElementById('resultsTitle').textContent = t;
}

function showListPage() {
  detailPageOpen = false;
  readerState = null;
  var evidence = document.getElementById('evidence');
  evidence.style.display = 'none';
  evidence.onscroll = null;
  document.getElementById('rows').style.display = '';
  document.getElementById('fileSearch').style.display = '';
  document.getElementById('backToList').style.display = 'none';
  document.getElementById('count').style.display = '';
  document.getElementById('resultsTitle').textContent = listTitle;
}

function showDetailPage(title) {
  detailPageOpen = true;
  readerState = null;
  var evidence = document.getElementById('evidence');
  evidence.onscroll = null;
  document.getElementById('rows').style.display = 'none';
  document.getElementById('fileSearch').style.display = 'none';
  evidence.style.display = '';
  document.getElementById('backToList').style.display = '';
  document.getElementById('count').style.display = 'none';
  document.getElementById('resultsTitle').textContent = title || '文件详情';
}

function clearEvidence() {
  selectedEvidence = null;
  document.getElementById('evidence').innerHTML = '';
  showListPage();
}

function showEvidence(evidence) {
  if (!evidence) return clearEvidence();
  selectedEvidence = evidence;
  showDetailPage(evidence.name || evidence.file_name || '原文片段');
  var location = evidence.page ? ('第 ' + evidence.page + ' 页') : (evidence.section_path || evidence.locator || '原文片段');
  var path = evidence.path || evidence.file_path || '';
  var fileId = evidence.file_id || null;
  document.getElementById('evidence').innerHTML = '<div class="evidence-document">' +
    '<div class="evidence-document-head"><div class="evidence-name">' + esc(evidence.name || evidence.file_name || '未命名文档') + '</div>' +
    '<div class="evidence-locator">' + esc(location) + '</div></div>' +
    '<div class="evidence-text">' + esc(evidence.text || evidence.snippet || '没有可显示的原文片段。') + '</div>' +
    ((path || fileId) ? '<div class="evidence-actions">' +
      (fileId ? '<button class="text-button" id="openEvidenceDetail" type="button">查看文件详情</button>' : '') +
      (path ? '<button class="text-button" id="revealEvidence" type="button">在 Finder 中显示</button>' : '') +
      '</div>' : '') +
    '</div>';
  var button = document.getElementById('revealEvidence');

/* ---------- 文件查看器（全文阅读） ---------- */
let readerState = null;

function startReader(fileId, fallbackSections) {
  if (!fileId) {
    readerState = null;
    renderReaderFallback(fallbackSections, '');
    return;
  }
  readerState = { fileId: fileId, offset: 0, total: 0,
                  loading: false, done: false, fallback: fallbackSections };
  var scroller = document.getElementById('evidence');
  scroller.onscroll = function () {
    if (scroller.scrollTop + scroller.clientHeight >= scroller.scrollHeight - 420) {
      loadReaderPage();
    }
  };
  loadReaderPage();
}

function renderReaderFallback(sections, note) {
  var body = document.getElementById('readerBody');
  var foot = document.getElementById('readerFoot');
  if (!body) return;
  body.innerHTML = sections.length
    ? sections.map(detailSectionHtml).join('')
    : '<div class="detail-empty">该文件还没有可提取的正文 —— 可用上方按钮用默认应用打开</div>';
  if (foot) foot.textContent = note || '';
}

async function loadReaderPage() {
  var st = readerState;
  if (!st || st.loading || st.done) return;
  st.loading = true;
  var foot = document.getElementById('readerFoot');
  if (foot) foot.textContent = '正在加载全文…';
  try {
    var r = await api('/files/' + encodeURIComponent(st.fileId) +
                      '/content?offset=' + st.offset + '&limit=60');
    if (readerState !== st) return;   // 期间切换了文件
    var body = document.getElementById('readerBody');
    if (!body) return;
    var sections = Array.isArray(r.sections) ? r.sections : [];
    st.total = safeNumber(r.total);
    if (st.offset === 0 && !sections.length) {
      // 没有全文（未解析/不支持的格式）→ 退回详情兜底
      st.done = true;
      renderReaderFallback(st.fallback, '');
      return;
    }
    body.insertAdjacentHTML('beforeend', sections.map(detailSectionHtml).join(''));
    st.offset += sections.length;
    st.done = !r.has_more;
    if (foot) {
      foot.textContent = st.done
        ? '— 全文完 · 共 ' + st.total + ' 段 —'
        : '已加载 ' + st.offset + ' / ' + st.total + ' 段，继续下滑加载';
    }
  } catch (e) {
    if (readerState === st) {
      st.done = true;
      renderReaderFallback(st.fallback, '全文加载失败：' + e.message);
    }
  } finally {
    st.loading = false;
  }
}

async function showFileDetail(file) {
  if (!file) return clearEvidence();

  if (!fileId) return showEvidence({ name: file.name, text: file.path || '', path: openPathForFile(file) });

    }

async function api(path, opts = {}) {
  // 经主进程受控代理访问 sidecar；鉴权令牌只存在于主进程，渲染层拿不到。
  const result = await window.inktable.apiRequest({
    path: path,
    method: opts.method || 'GET',
    body: typeof opts.body === 'string' ? opts.body : undefined,
  });
  if (!result) throw new Error('sidecar 未就绪');
  if (!result.ok) throw new Error('HTTP ' + (result.status || result.error || '?'));
  return result.data;
}

function apiStream(path, payload, onEvent) {
  // 流式同样经主进程代理：主进程解析 SSE 后逐条回传 (event, data)。
  return window.inktable.apiStream(path, payload || {}, onEvent);
}

function fmtSize(b) {
  if (!b) return '';
  if (b < 1024) return b + ' B';
  if (b < 1048576) return (b / 1024).toFixed(0) + ' KB';
  if (b < 1073741824) return (b / 1048576).toFixed(1) + ' MB';
  return (b / 1073741824).toFixed(1) + ' GB';
}
function fmtDate(ts) {
  if (!ts) return '';
  const days = Math.floor((Date.now() / 1000 - ts) / 86400);
  if (days <= 0) return '今天';
  if (days === 1) return '昨天';
  if (days < 7) return days + ' 天前';
  const d = new Date(ts * 1000);
  return (d.getMonth() + 1) + '月' + d.getDate() + '日';
}

/* 树使用的 SVG 图标：字符三角太小且发虚，换成可控大小的矢量 */
function chevSvg(open) {

    '<path d="M3 1.6 L7.2 5 L3 8.4" fill="none" stroke="currentColor" ' +
    'stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>';
}

function folderSvg(open) {
  return '<svg class="ico-svg" viewBox="0 0 16 16" aria-hidden="true">' +
    (open
      ? '<path d="M1.8 4.2c0-.7.6-1.3 1.3-1.3h2.8l1.4 1.4h5.4c.7 0 1.3.6 1.3 1.3v.6H3.4c-.6 0-1.1.4-1.3 1L1.8 9.4z" fill="currentColor" opacity=".55"/>' +
        '<path d="M2.9 7.4c.1-.5.6-.9 1.1-.9h10.2c.7 0 1.2.7 1 1.4l-1 4.2c-.1.5-.6.9-1.1.9H3c-.7 0-1.2-.7-1.1-1.4z" fill="currentColor"/>'
      : '<path d="M1.8 4.2c0-.7.6-1.3 1.3-1.3h2.8l1.4 1.4h5.4c.7 0 1.3.6 1.3 1.3v6.2c0 .7-.6 1.3-1.3 1.3H3.1c-.7 0-1.3-.6-1.3-1.3z" fill="currentColor"/>') +
    '</svg>';

function fileSvg() {
  return '<svg class="ico-svg" viewBox="0 0 16 16" aria-hidden="true">' +
    '<path d="M4 1.6h5.2L13 5.4v8.4c0 .7-.5 1.2-1.2 1.2H4c-.7 0-1.2-.5-1.2-1.2V2.8c0-.7.5-1.2 1.2-1.2z" fill="currentColor" opacity=".28"/>' +
    '<path d="M9.2 1.6 13 5.4H9.9c-.4 0-.7-.3-.7-.7z" fill="currentColor" opacity=".6"/></svg>';

/* 文件树：树根 = 已启用来源，子层按需取（GET /files/tree），
   完全从库内路径推导、不扫磁盘。展开状态持久化。 */
let treeRoots = null;      // null = 尚未加载
let treeChildren = {};     // 目录路径 -> { dirs, files, truncated }
let treeFetching = {};
let treeOpen = {};
try { treeOpen = JSON.parse(localStorage.getItem('treeOpen') || '{}') || {}; } catch (e) {}

function persistTreeOpen() {
  try { localStorage.setItem('treeOpen', JSON.stringify(treeOpen)); } catch (e) {}
}

function invalidateTree() {
  treeRoots = null;
  treeChildren = {};
  treeFetching = {};
}

function fetchTreeLevel(dirPath) {
  var key = dirPath === null ? '' : dirPath;
  if (treeFetching[key]) return;
  treeFetching[key] = true;
  var url = dirPath === null ? '/files/tree' : '/files/tree?dir=' + encodeURIComponent(dirPath);
  api(url).then(function (r) {
    if (dirPath === null) treeRoots = r.roots || [];
    else treeChildren[dirPath] = { dirs: r.dirs || [], files: r.files || [], truncated: !!r.truncated };
  }).catch(function () {
    if (dirPath === null) treeRoots = [];
    else treeChildren[dirPath] = { dirs: [], files: [], truncated: false };
  }).finally(function () {
    delete treeFetching[key];
    renderNav();
  });
}

function treeDirRow(name, dirPath, count, depth) {
  var open = !!treeOpen[dirPath];
  return '<div class="nav-item tree-dir' + (activeDir === dirPath ? ' on' : '') +
    '" data-dir="' + encodedData(dirPath) + '" title="' + esc(name) +
    '" style="padding-left:' + (6 + depth * 13) + 'px">' +
    '<span class="nav-chev">' + chevSvg(open) + '</span>' +
    '<span class="tree-ico ico-folder">' + folderSvg(open) + '</span>' +
    '<span class="label">' + esc(name) + '</span>' +
    '<span class="n">' + esc(count || '') + '</span></div>' +
    (open ? treeLevelHtml(dirPath, depth + 1) : '');
}

function treeLevelHtml(dirPath, depth) {
  if (dirPath === null) {
    if (treeRoots === null) {
      fetchTreeLevel(null);
      return '<div class="tree-note">加载中…</div>';
    }
    if (!treeRoots.length) return '<div class="tree-note">没有已启用的来源</div>';
    return treeRoots.map(function (r) {
      return treeDirRow(r.name, r.path, r.count, 0);
    }).join('');
  }
  var kids = treeChildren[dirPath];
  if (!kids) {
    fetchTreeLevel(dirPath);
    return '<div class="tree-note" style="padding-left:' + (22 + depth * 13) + 'px">加载中…</div>';
  }
  var h = kids.dirs.map(function (d) {
    return treeDirRow(d.name, d.path, d.count, depth);
  }).join('');
  h += kids.files.map(function (f) {
    return '<div class="nav-item tree-file" data-fid="' + esc(f.id) +
      '" data-fname="' + encodedData(f.name) + '" title="' + esc(f.name) +
      '" style="padding-left:' + (6 + depth * 13) + 'px">' +
      '<span class="nav-chev tree-leaf"></span>' +
      '<span class="tree-ico ico-file">' + fileSvg() + '</span>' +
      '<span class="label">' + esc(f.name) + '</span></div>';
  }).join('');
  if (kids.truncated) {
    h += '<div class="tree-note" style="padding-left:' + (22 + depth * 13) + 'px">' +
      '目录较大，仅列出部分 —— 点目录名在中栏看全部</div>';
  }
  return h;
}

function renderNav() {
  const el = document.getElementById('nav');
  const unfiltered = activeSource === null && activeCategory === null &&
    activeBook === null && activeExt === null && activeDir === null &&
    activeRecent === null && !activeDuplicate;

  // 左栏刻意保持极简，不设任何组标题：全部文件/时间线/重复内容 + 文件树。
  // 分类/类型/文件书先撤下（数据与右键归类保留，需要时可加回）。
  let h = '<div class="nav-item' + (unfiltered ? ' on' : '') + '" data-src="">' +
       '<span class="label">全部文件</span><span class="n">' + esc(stats ? stats.files : '') + '</span></div>';
  h += '<div class="nav-item' + (activeRecent === 7 ? ' on' : '') + '" data-recent="7">' +
       '<span class="label">最近一周</span><span class="n">' + esc(stats ? (stats.recent7 || '') : '') + '</span></div>';
  h += '<div class="nav-item' + (activeRecent === 30 ? ' on' : '') + '" data-recent="30">' +
       '<span class="label">最近一月</span><span class="n">' + esc(stats ? (stats.recent30 || '') : '') + '</span></div>';
  if (stats && stats.deduped > 0) {
    h += '<div class="nav-item' + (activeDuplicate ? ' on' : '') + '" data-dup="1"><span class="label">重复内容</span>' +
         '<span class="n">' + esc(stats.deduped) + '</span></div>';
  }
  h += '<div class="nav-item" data-report="1"><span class="label">本周报告</span></div>';

  h += '<div class="nav-sep"></div>';
  h += treeLevelHtml(null, 0);
  el.innerHTML = h;

  el.querySelectorAll('.nav-item').forEach(function (it) {
    if (it.classList.contains('tree-dir') || it.classList.contains('tree-file')) return;
    it.onclick = function () {
      if (it.dataset.report !== undefined) { showWeeklyReport(false); return; }
      activeSource = null; activeCategory = null; activeBook = null;
      activeExt = null; activeDir = null; activeRecent = null; activeDuplicate = false;
      if (it.dataset.book !== undefined) {
        activeBook = +it.dataset.book;
      } else if (it.dataset.cat !== undefined) {
        var v = it.dataset.cat;
        activeCategory = (v === 'none') ? 'none' : +v;
      } else if (it.dataset.dup !== undefined) {
        activeDuplicate = true;
      } else if (it.dataset.recent !== undefined) {
        activeRecent = +it.dataset.recent;
      } else if (it.dataset.ext !== undefined) {
        activeExt = it.dataset.ext;
      } else {
        activeSource = it.dataset.src || null;
      }
      renderNav();
      updateWorkbenchChrome();
      document.getElementById('q').value = '';
      showListPage();
      load('');
    };
  });
  el.querySelectorAll('.tree-dir').forEach(function (it) {
    var dirPath = decodeURIComponent(it.dataset.dir);
    it.onclick = function (event) {
      // 点箭头只展开/收起；点目录名 = 筛选中栏列表并展开
      if (event.target.closest('.nav-chev')) {
        treeOpen[dirPath] = !treeOpen[dirPath];
        persistTreeOpen();
        renderNav();
        return;
      }
      activeSource = null; activeCategory = null; activeBook = null;
      activeExt = null; activeRecent = null; activeDuplicate = false;
      activeDir = dirPath;
      if (!treeOpen[dirPath]) { treeOpen[dirPath] = true; persistTreeOpen(); }
      renderNav();
      updateWorkbenchChrome();
      document.getElementById('q').value = '';
      showListPage();
      load('');
    };
  });
  el.querySelectorAll('.tree-file').forEach(function (it) {
    it.onclick = function () {
      showFileDetail({ file_id: +it.dataset.fid, name: decodeURIComponent(it.dataset.fname) });
    };
  });
}

/* 分类与文件书的数据仍在维护（右键归类、问答 book 过滤要用），
   只是不再作为左栏导航组展示 */
async function refreshCats() {
  try { categories = await api('/categories'); } catch (e) {}
  try { books = (await api('/books')).books; } catch (e) {}
}

function renderRows() {
  const el = document.getElementById('rows');
  if (!files.length) {
    el.innerHTML = '<div class="empty">没有匹配的文件</div>';
    return;
  }
  // 分组头：浏览模式按扩展名（与 load 的 group=ext 排序配合），
  // 时间线视图按日期（今天/昨天/N 天前），互不混用
  const grouped = !currentQuery && !activeDuplicate && activeRecent === null;
  const dateGrouped = !currentQuery && activeRecent !== null;
  let lastGroup = null;
  const rows = files.map(function (f) {
    // 原件没了但有副本 → 双击落到副本（保全存在的意义）
    var openPath = f.path;
    if (f.state === 'missing' && f.preserved_path) openPath = f.preserved_path;
    var gone = f.state === 'missing' && !f.preserved_path;
    var kind = String(f.ext || '').replace('.', '').toLowerCase();
    var head = '';
    if (grouped || dateGrouped) {
      var label = dateGrouped
        ? (fmtDate(f.mtime) || '更早')
        : (kind ? kind.toUpperCase() : '无扩展名');
      if (label !== lastGroup) {
        lastGroup = label;
        head = '<div class="row-group">' + esc(label) + '</div>';
      }
    }
    return head + '<div class="row' + (gone ? ' gone' : '') + '" data-path="' + encodedData(openPath) + '" data-index="' + encodedData(f.id) + '">' +
      '<span class="icon t-' + esc(kind) + '">' + esc((kind || '·').slice(0, 4).toUpperCase()) + '</span>' +
      '<span class="fname">' + esc(f.name) +
        (f.state === 'missing' ? ' <span class="tag' + (f.preserved_path ? '' : ' gone') + '">' +
          (f.preserved_path ? '已保全' : '原文件已消失') + '</span>' : '') +
      '</span>' +
      '<span class="fsrc' + (f.volatile ? ' vol' : '') + '">' + esc(f.source_name || '') + '</span>' +
      '<span class="fsize">' + esc(fmtSize(f.size)) + '</span>' +
      '<span class="fdate">' + esc(fmtDate(f.mtime)) + '</span>' +
    '</div>';
  }).join('');
  const more = files.length < filesTotal
    ? '<div class="load-more"><button id="loadMore">加载更多</button>' +
      '<span>已显示 ' + esc(files.length) + ' / ' + esc(filesTotal) + '</span></div>'
    : '';
  el.innerHTML = rows + more;
  el.querySelectorAll('.row').forEach(function (r, idx) {
    r.onclick = function () {
      el.querySelectorAll('.row.on').forEach(function (item) { item.classList.remove('on'); });
      r.classList.add('on');
      showFileDetail(files[idx]);
    };
    r.ondblclick = function () {
      window.inktable.revealInFinder(decodeURIComponent(r.dataset.path));
    };
    r.oncontextmenu = function (e) {
      e.preventDefault();
      openCtxMenu(e.clientX, e.clientY, files[idx]);
    };
  });
  const moreBtn = document.getElementById('loadMore');
  if (moreBtn) moreBtn.onclick = async function () {
    moreBtn.disabled = true;
    moreBtn.textContent = '加载中…';
    try {
      await load(currentQuery, true);
    } catch (e) {
      moreBtn.disabled = false;
      moreBtn.textContent = '重试加载';
      toast('加载失败：' + e.message);
    }
  };
}

function openPathForFile(file) {
  return file && file.state === 'missing' && file.preserved_path ? file.preserved_path : (file && file.path ? file.path : '');
}

/* ---------- 文件删除 ----------
   两档明确操作：① 从库中移除 = 只删记录与索引，磁盘不动（H2）；
   ② 删除文件 = 移到废纸篓（可恢复），sidecar 只清库，动磁盘的是系统 API */
async function refreshAfterLibraryChange() {
  try { stats = await api('/stats'); } catch (e) {}
  await refreshCats();
  invalidateTree();
  renderNav();
  updateWorkbenchChrome();
  await load(document.getElementById('q').value.trim());
}

async function removeFileFromLibrary(file) {
  var name = String(file.name || '').slice(0, 24);
  var ok = confirm('从库中移除「' + name + '」？\n\n' +
    '只删除索引记录，磁盘上的文件不受影响。\n' +
    '注意：若文件仍在已启用的来源目录内，下次扫描会重新收录。');
  if (!ok) return;
  try {
    await api('/files/remove', { method: 'POST', body: JSON.stringify({
      file_ids: [file.file_id || file.id] }) });
    toast('已从库中移除');
    if (detailPageOpen) showListPage();
    await refreshAfterLibraryChange();
  } catch (e) { toast('移除失败：' + e.message); }
}

async function trashFile(file) {
  var name = String(file.name || '').slice(0, 24);
  var ok = confirm('把「' + name + '」移到废纸篓？\n\n' +
    '原文件与保全副本会移入废纸篓（可从废纸篓恢复），\n库中的记录与索引一并移除。');
  if (!ok) return;
  try {
    var r = await api('/files/remove', { method: 'POST', body: JSON.stringify({
      file_ids: [file.file_id || file.id] }) });
    var targets = (r.paths || []).concat(r.preserved_paths || []);
    var failed = 0;
    for (var i = 0; i < targets.length; i++) {
      if (window.inktable.trashItem) {
        var res = await window.inktable.trashItem(targets[i]);
        if (!res || !res.ok) failed += 1;
      }
    }
    toast(failed
      ? '记录已移除，但 ' + failed + ' 个文件移入废纸篓失败'
      : '已移到废纸篓');
    if (detailPageOpen) showListPage();
    await refreshAfterLibraryChange();
  } catch (e) { toast('删除失败：' + e.message); }
}

/* 右键归类：列出分类树，点即归；底部可勾"同类型以后自动归" */
function openCtxMenu(x, y, file) {
  var el = document.getElementById('ctx');
  var h = '<div class="ci dim">归类「' + esc(String(file.name || '').slice(0, 18)) + '」到…</div>';
  categories.tree.forEach(function (c) {
    h += '<div class="ci" data-cid="' + esc(c.id) + '" style="padding-left:' + (10 + safeNumber(c.depth) * 12) + 'px">' +
         esc(c.name) + '</div>';
  });
  if (!categories.tree.length) h += '<div class="ci dim">（先在侧边栏 ＋ 新建分类）</div>';
  h += '<div class="sep"></div>' +
       '<div class="ci" data-cid="__learn">归类并记住规则（同来源同类型）</div>' +
       '<div class="ci" data-cid="__clear">移出分类</div>';
  if (books.length) {
    h += '<div class="sep"></div>';
    books.forEach(function (b) {
      h += '<div class="ci" data-book="' + esc(b.id) + '">加入书：' + esc(b.name) + '</div>';
    });
  }
  h += '<div class="sep"></div>' +
       '<div class="ci danger" data-cid="__removelib">从库中移除（保留文件）</div>' +
       '<div class="ci danger" data-cid="__trash">删除文件（移到废纸篓）</div>';
  el.innerHTML = h;
  el.classList.add('show');
  el.style.left = Math.min(x, window.innerWidth - 220) + 'px';
  el.style.top = Math.min(y, window.innerHeight - el.offsetHeight - 10) + 'px';

  el.querySelectorAll('.ci[data-book]').forEach(function (it) {
    it.onclick = async function () {
      closeCtx();
      try {
        await api('/books/add', { method: 'POST', body: JSON.stringify({
          book_id: +it.dataset.book, file_ids: [file.file_id || file.id] }) });
        toast('已加入文件书');
        await refreshCats(); renderNav();
      } catch (e) { toast('加入失败：' + e.message); }
    };
  });
  el.querySelectorAll('.ci[data-cid]').forEach(function (it) {
    it.onclick = async function () {
      closeCtx();
      var cid = it.dataset.cid;
      if (cid === '__removelib') return removeFileFromLibrary(file);
      if (cid === '__trash') return trashFile(file);
      try {
        if (cid === '__clear') {
          await api('/files/classify', { method: 'POST', body: JSON.stringify({
            file_ids: [file.file_id || file.id], category_id: null }) });
        } else if (cid === '__learn') {
          // 二级选择：再弹一次纯分类列表
          openCtxLearn(x, y, file);
          return;
        } else {
          await api('/files/classify', { method: 'POST', body: JSON.stringify({
            file_ids: [file.file_id || file.id], category_id: +cid }) });
        }
        await refreshCats();
        renderNav();
        await load(document.getElementById('q').value.trim());
      } catch (e) { toast('归类失败：' + e.message); }
    };
  });
}

async function load(q, append = false) {
  const query = String(q || '').trim();
  setListTitle(query ? '文件搜索' : '文件管理');
  if (!append) {
    searchVersion += 1;  // 列表导航使尚未返回的全文搜索失效
    currentQuery = query;
    files = [];
    filesTotal = 0;
  } else if (query !== currentQuery) {
    return load(query, false);
  }
  const version = append ? loadVersion : ++loadVersion;
  const params = new URLSearchParams({
    limit: String(PAGE_SIZE),
    offset: String(append ? files.length : 0),
  });
  if (query) params.set('q', query);
  if (activeCategory === 'none') params.set('unclassified', 'true');
  else if (activeCategory !== null) params.set('category_id', String(activeCategory));
  if (activeBook !== null) params.set('book_id', String(activeBook));
  if (activeSource !== null) params.set('source', activeSource);
  if (activeExt !== null) params.set('ext', activeExt);
  if (activeDir !== null) params.set('dir', activeDir);
  if (activeRecent !== null) params.set('since_days', String(activeRecent));
  if (activeDuplicate) params.set('duplicate', 'true');
  // 浏览模式按扩展名分组（服务端排序，跨页不断组）；
  // 时间线视图按日期分组（天然 mtime 序），搜索和重复视图保持按时间
  if (!query && !activeDuplicate && activeRecent === null) params.set('group', 'ext');
  const d = await api('/files?' + params);
  if (version !== loadVersion) return;
  const page = Array.isArray(d.files) ? d.files : [];
  files = append ? files.concat(page) : page;
  filesTotal = Math.max(0, safeNumber(d.total));
  document.getElementById('count').textContent = filesTotal + ' 个文件';
  renderRows();
}

/* 全文搜索：搜内容而非文件名。文件名匹配与内容匹配合并展示 */
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}
function encodedData(value) {
  return esc(encodeURIComponent(String(value == null ? '' : value)));
}
function safeNumber(value) {
  const n = Number(value);
  return Number.isFinite(n) ? n : 0;
}

async function runAutoExtClassify(showToast) {
  // 设置里可关（通用配置 → 整理 → 自动归类）
  if (localStorage.getItem('autoClassify') === '0') return { classified: 0 };
  if (autoClassifyPending) return autoClassifyPending;
  autoClassifyPending = (async function () {
    try {
      const r = await api('/classify/auto_ext', { method: 'POST' });
      if (safeNumber(r.classified) > 0) {
        await refreshCats();
        stats = await api('/stats');
        renderNav();
        if (showToast) {
          toast('已按扩展名自动归类 ' + safeNumber(r.classified) + ' 个文件');
        }
      }
      return r;
    } catch (e) {
      return { classified: 0, error: e.message };
    } finally {
      autoClassifyPending = null;
    }
  })();
  return autoClassifyPending;
}
function highlight(text, q) {
  const safe = esc(text);
  if (!q) return safe;
  // 逐字符高亮：中文没有词边界，按查询串里的字符片段匹配
  const terms = q.split(/\s+/).filter(Boolean).map(esc);
  let out = safe;
  terms.forEach(function (t) {
    if (t.length < 1) return;
    out = out.split(t).join('<em>' + t + '</em>');
  });
  return out;
}

function renderHits(result, q) {
  const el = document.getElementById('rows');
  setListTitle('检索结果');
  if (!result.files.length) {
    el.innerHTML = '<div class="workbench-empty"><div><div class="empty-mark">⌕</div><div class="empty-title">没有找到匹配内容</div>' +
      '<div class="empty-meta">试试其他关键词，或检查文档是否已完成索引</div></div></div>';
    clearEvidence();
    return;
  }
  let h = '<div class="mode">全文搜索 · 命中 ' + esc(result.total) + ' 个文件' +
          (result.routes && result.routes.vector ? ' · 含语义匹配' : '') + '</div>';
  if (result.hedge) {
    h += '<div class="mode" style="color:var(--warn)">⚠ ' + esc(result.hedge) + '</div>';
  }
  h += result.files.map(function (f, index) {
    const snips = f.snippets.map(function (s) {
      const loc = s.page ? ('第 ' + s.page + ' 页')
                : (s.section_path ? s.section_path.split(' › ').slice(-1)[0] : '');
      return '<div class="snip">' + (loc ? '<span class="loc">' + esc(loc) + '</span>' : '') +
             highlight(s.text, q) + '</div>';
    }).join('');
    var kind = String(f.ext || '').replace('.', '').toLowerCase();
    return '<div class="hit" data-path="' + encodedData(f.path) + '" data-hit="' + esc(index) + '" tabindex="0">' +
      '<div class="hit-head">' +
        '<span class="icon t-' + esc(kind) + '">' + esc((kind || '·').slice(0, 4).toUpperCase()) + '</span>' +
        '<span class="hit-name">' + esc(f.name) + '</span>' +
        '<span class="hit-meta' + (f.volatile ? ' vol' : '') + '">' +
          esc(f.source_name || '') + '</span>' +
      '</div>' + snips + '</div>';
  }).join('');
  el.innerHTML = h;
  el.querySelectorAll('.hit').forEach(function (r, index) {
    r.onclick = function () {
      var file = result.files[index];
      el.querySelectorAll('.hit.on').forEach(function (item) { item.classList.remove('on'); });
      r.classList.add('on');
      showSearchFileDetail(file);
    };
    r.onkeydown = function (event) {
      if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); r.onclick(); }
    };
    r.ondblclick = function () {
      window.inktable.revealInFinder(decodeURIComponent(r.dataset.path));
    };
  });
}

/* ---------- AI 问答（B6） ---------- */
async function runAsk(q) {
  const question = String(q || '').trim();
  if (!question || askInFlight) return;
  askInFlight = true;
  const el = document.getElementById('answerRows');
  el.innerHTML = qaHistoryHtml() +
    '<div class="qa-q">' + esc(question) + '</div>' +
    '<div class="ans thinking"><span class="tdot"></span><span class="tdot"></span>' +
    '<span class="tdot"></span><span class="tlabel">正在检索并作答…</span></div>';
  bindQaThread(el);
  el.scrollTop = el.scrollHeight;
  document.getElementById('askSubmit').disabled = true;
  try {
    // 带上最近几轮问答，后端把"那第二个呢"这类追问浓缩成独立问题再检索
    const chatHistory = [];
    for (let i = 0; i < qaAnswers.length; i++) {
      const prev = qaAnswers[i];
      if (!prev || !qaHistory[i]) continue;
      chatHistory.push({ q: qaHistory[i].question,
                         a: String(prev.answer || '').slice(0, 300) });
    }
    let finalAnswer = null;
    let draftText = '';
    await apiStream('/ask/stream', {
      question: question, book_id: activeBook,
      history: chatHistory.slice(-4),
    }, function (event, payload) {
      var current = el.lastElementChild;
      if (event === 'chat.searching' && current) {
        current.innerHTML = '<span class="tlabel">正在检索资料…</span>';
      } else if (event === 'chat.draft') {
        draftText += String(payload.text || '');
        if (current) { current.className = 'ans draft'; current.textContent = draftText; }
        el.scrollTop = el.scrollHeight;
      } else if (event === 'chat.regenerating') {
        draftText = '';
        if (current) { current.className = 'ans thinking'; current.innerHTML =
          '<span class="tlabel">引用校验未通过，正在重新生成…</span>'; }
      } else if (event === 'chat.finalize') {
        finalAnswer = payload;
      } else if (event === 'chat.citations') {
        finalAnswer = finalAnswer || {};
        finalAnswer.citations = payload.citations || [];
        renderAnswer(finalAnswer, question);
      } else if (event === 'chat.error') {
        throw new Error(payload.message || '问答失败');
      }
    });
    if (finalAnswer && !Array.isArray(finalAnswer.citations)) {
      finalAnswer.citations = [];
      renderAnswer(finalAnswer, question);
    }
    var box = document.getElementById('askQ');
    if (box) { box.value = ''; box.style.height = ''; }
  } catch (e) {
    qaHistory.push({ question: question,
                     html: '<div class="ans" role="alert"><div class="ahedge">提问失败：' + esc(e.message) + '</div></div>' });
    qaAnswers.push(null);
    trimQaThread();
    persistQaThread();
    renderQaThread();
  } finally {
    askInFlight = false;
    document.getElementById('askSubmit').disabled = llmInfo.available !== true;
  }
}

/* 问答历史：右栏保留全部问答；引用绑定按卡片索引回查各自的
   citations，避免旧回答的引用点开后跳到新回答的证据。
   会话持久化到 localStorage（去掉 trace 等大字段），重启后还在 */
const QA_HISTORY_LIMIT = 40;
let qaHistory = [];   // [{ question, html }]
let qaAnswers = [];   // 与 qaHistory 对齐的 answer 对象（失败卡为 null）
let askInFlight = false;

function trimQaThread() {
  if (qaHistory.length <= QA_HISTORY_LIMIT) return;
  qaHistory = qaHistory.slice(-QA_HISTORY_LIMIT);
  qaAnswers = qaAnswers.slice(-QA_HISTORY_LIMIT);
}

function persistQaThread() {
  try {
    var slim = qaAnswers.map(function (a) {
      if (!a) return null;
      return { status: a.status, answer: a.answer, mode: a.mode || 'knowledge',
               hedge: a.hedge || '', citations: a.citations || [],
               retrieved: a.retrieved || [] };
    });
    localStorage.setItem('qaThread', JSON.stringify({
      history: qaHistory.slice(-40),
      answers: slim.slice(-40),
    }));
  } catch (e) { /* 存不下就算了，不影响会话 */ }
}

/* 旧存档里的引用标签是 [C8]/C8 文本样式，洗成现在的纯数字圆号 */
function migrateOldQaHtml(h) {
  return String(h)
    .replace(/class="rtag">\[C(\d+)\]</g, 'class="rtag">$1<')
    .replace(/(class="cite-chip"[^>]*>)C(\d+)</g, '$1$2<');
}

function restoreQaThread() {
  try {
    var saved = JSON.parse(localStorage.getItem('qaThread') || 'null');
    if (saved && Array.isArray(saved.history) && Array.isArray(saved.answers) &&
        saved.history.length === saved.answers.length && saved.history.length) {
      qaHistory = saved.history.slice(-QA_HISTORY_LIMIT).map(function (item) {
        return { question: String(item.question || '').slice(0, 8192),
                 html: migrateOldQaHtml(item.html) };
      });
      qaAnswers = saved.answers.slice(-QA_HISTORY_LIMIT);
      renderQaThread();
    }
  } catch (e) { /* 损坏的存档直接忽略 */ }
}

/* 复制为 Markdown（带引用），供每张回答卡的"复制"按钮使用 */
function answerMarkdown(question, a) {
  var lines = ['## ' + question, ''];
  if (a.mode === 'general') lines.push('> 通用回答 · 未引用文件库', '');
  if (a.answer) lines.push(a.answer);
  var refs = (a.citations && a.citations.length) ? a.citations : (a.retrieved || []);
  if (refs.length) {
    lines.push('', '### 引用');
    refs.forEach(function (cite) {
      // 输出目标是剪贴板纯文本 Markdown，不是 HTML，无需转义
      var loc = cite.page ? ('第 ' + cite.page + ' 页') : (cite.section_path || '');
      lines.push('- [' + cite.tag + '] 《' + cite.file_name + '》' +
        (loc ? ' · ' + loc : '') + (cite.snippet ? '：' + cite.snippet : ''));
    });
  }
  return lines.join('\n');
}

function qaHistoryHtml() {
  return qaHistory.map(function (item) {
    return '<div class="qa-q">' + esc(item.question) + '</div>' + item.html;
  }).join('');
}

function renderQaThread() {
  const el = document.getElementById('answerRows');
  el.innerHTML = qaHistoryHtml();
  bindQaThread(el);
  el.scrollTop = el.scrollHeight;
}

function resetQaThread() {
  qaHistory = [];
  qaAnswers = [];
  try { localStorage.removeItem('qaThread'); } catch (e) {}
  document.getElementById('answerRows').innerHTML =
    '<div class="qa-empty"><div><div class="empty-mark"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M9.09 9a3 3 0 015.83 1c0 2-3 3-3 3m.08 4h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></div>' +
    '<div class="empty-title">询问你的知识库</div>' +
    '<div class="empty-meta">回答会附带可定位的原文引用</div></div></div>';
}

function bindQaThread(el) {
  el.querySelectorAll('.ans-act[data-copy]').forEach(function (b) {
    b.onclick = function () {
      var i = +b.dataset.copy;
      var a = qaAnswers[i];
      if (!a || !qaHistory[i]) return;
      navigator.clipboard.writeText(answerMarkdown(qaHistory[i].question, a))
        .then(function () { toast('已复制为 Markdown（含引用）'); })
        .catch(function () { toast('复制失败'); });
    };
  });
  el.querySelectorAll('.ref').forEach(function (r) {
    r.onclick = function () {
      var a = qaAnswers[+r.dataset.ans];
      if (!a) return;
      var citationList = a.citations && a.citations.length ? a.citations : (a.retrieved || []);
      var citation = citationList.find(function (item) { return item.tag === r.dataset.tag; });
      if (citation) showEvidence(citation);
    };
    r.ondblclick = function () {
      window.inktable.revealInFinder(decodeURIComponent(r.dataset.path));
    };
  });
  el.querySelectorAll('.refs-more').forEach(function (b) {
    b.onclick = function () {
      var box = b.closest('.refs');
      var open = box.classList.toggle('expanded');
      b.textContent = open ? '收起引用' : ('展开全部 ' + b.dataset.n + ' 条');
    };
  });
  el.querySelectorAll('.cite-chip').forEach(function (c) {
    c.onclick = function () {
      var ref = Array.from(el.querySelectorAll('.ref')).find(function (r) {
        return r.dataset.ans === c.dataset.ans && r.dataset.tag === c.dataset.tag;
      });
      if (!ref) return;
      var rest = ref.closest('.refs-rest');
      if (rest) {  // 目标在收起区里，先展开
        var more = rest.parentElement.querySelector('.refs-more');
        if (more && !rest.parentElement.classList.contains('expanded')) more.onclick();
      }
      ref.scrollIntoView({ block: 'center' }); ref.onclick(); ref.style.background = 'var(--ink-active)';
      setTimeout(function () { ref.style.background = ''; }, 900);
    };
  });
}

function renderAnswer(a, q) {
  const el = document.getElementById('answerRows');

  if (a.status === 'not_configured') {
    el.innerHTML = qaHistoryHtml() +
      '<div class="ans"><div class="atext" style="color:var(--text-secondary)">还没有配置模型服务。' +
      '</div><div class="askbar" id="openSet" style="border:none;padding:8px 0 0">' +
      '打开设置 → AI 问答</div></div>';
    bindQaThread(el);
    document.getElementById('openSet').onclick = function () { sheetOpen(true, 'model'); };
    return;
  }

  var index = qaAnswers.length;
  let h = '<div class="ans">';
  if (a.hedge) h += '<div class="ahedge">⚠ ' + esc(a.hedge) + '</div>';
  if (a.mode === 'general') {
    h += '<div class="amode">通用回答 · 未引用文件库</div>';
  }

  if (a.status === 'answered') {
    // 连续的 [C8][C9] 合并成一组小圆号，避免正文里出现一长串灰块
    var body = esc(a.answer).replace(/\[C\d{1,3}\](?:\s*\[C\d{1,3}\])*/g, function (run) {
      var tags = run.match(/C\d{1,3}/g) || [];
      return '<span class="cite-run">' + tags.map(function (t) {
        return '<span class="cite-chip" data-ans="' + index + '" data-tag="' + t + '">' +
               t.slice(1) + '</span>';
      }).join('') + '</span>';
    });
    h += '<div class="atext">' + body + '</div>';
    if (a.citations && a.citations.length) {
      h += refsHtml(a.citations, index, '<div class="refs-head">引用 · ' + a.citations.length + ' 条</div>');
    }
  } else if (a.status === 'refused') {
    h += '<div class="atext" style="color:var(--text-secondary)">' + esc(a.answer) + '</div>';
  } else if (a.status === 'fallback') {
    h += refsHtml(a.retrieved || [], index, '');
  }
  if (a.status === 'answered') {
    h += '<div class="ans-acts"><button class="ans-act" type="button" data-copy="' +
      index + '" title="复制为 Markdown（含引用）">复制</button></div>';
  }
  h += '</div>';

  qaHistory.push({ question: q, html: h });
  qaAnswers.push(a);
  trimQaThread();
  persistQaThread();
  renderQaThread();
}

/* 引用列表：超过 4 条时默认收起，点"展开"再看全部 */
function refsHtml(citations, ansIndex, headHtml) {
  var shown = citations.slice(0, 4);
  var rest = citations.slice(4);
  var h = '<div class="refs">' + headHtml +
    shown.map(function (c) { return refHtml(c, ansIndex); }).join('');
  if (rest.length) {
    h += '<div class="refs-rest">' +
      rest.map(function (c) { return refHtml(c, ansIndex); }).join('') + '</div>' +
      '<button class="refs-more" type="button" data-n="' + citations.length + '">' +
      '展开全部 ' + citations.length + ' 条</button>';
  }
  return h + '</div>';
}

function refHtml(c, ansIndex) {
  var loc = c.page ? ('第 ' + c.page + ' 页')
          : (c.section_path ? c.section_path.split(' › ').slice(-1)[0] : '');
  return '<div class="ref" data-ans="' + esc(ansIndex == null ? '' : ansIndex) +
    '" data-tag="' + esc(c.tag) + '" data-path="' + encodedData(c.file_path) + '">' +
    '<span class="rtag">' + esc(String(c.tag || '').replace(/^C/, '')) + '</span>' +
    '<span class="rname">' + esc(c.file_name) + (loc ? ' · ' + esc(loc) : '') + '</span>' +
    '<span class="rsnip">' + esc(c.snippet || '') + '</span></div>';
}

async function doSearch(q) {
  if (!q) { await load(''); return; }
  const version = ++searchVersion;
  loadVersion += 1;  // 搜索开始后，忽略尚未返回的文件列表请求
  document.getElementById('count').textContent = '搜索中…';
  let r = null;
  try {
    r = await api('/search', { method: 'POST', body: JSON.stringify({
      q: q, limit: 40, book_id: activeBook,
    }) });
  } catch (e) { /* 全文搜索失败时退回文件名搜索 */ }
  if (version !== searchVersion) return;
  if (r && r.total > 0) {
    document.getElementById('count').textContent = r.total + ' 个文件';
    renderHits(r, q);
    return;
  }
  await load(q);   // 内容没命中就按文件名找
}

function executeQuery(q) {
  clearTimeout(timer);
  timer = null;
  showListPage();
  var query = String(q || '').trim();
  if (!query) return load('');
  return doSearch(query);
}

let timer;
document.getElementById('q').oninput = function (e) {
  clearTimeout(timer);
  const v = e.target.value.trim();
  timer = setTimeout(function () { executeQuery(v); }, 220);
};

async function previewAndConfirmSource(source, hintEl) {

/* 后台索引：解析正文并建全文索引，完成前顶部显示进度 */
let indexingPromise = null;
let indexingRerunRequested = false;

function runIndexing(forceAfterCurrent = false) {
  if (indexingPromise) {
    indexingRerunRequested = indexingRerunRequested || forceAfterCurrent;
    return indexingPromise;
  }
  indexingPromise = drainIndexQueue().finally(function () {
    const rerun = indexingRerunRequested;
    indexingRerunRequested = false;
    indexingPromise = null;
    if (rerun && lastSidecarState === 'ready') runIndexing();
  });
  return indexingPromise;
}

/* 语义向量补齐：模型晚于内容入库时，旧分片没有向量，语义检索
   覆盖不到 —— 解析队列排空后按批补课，补完为止 */
async function drainEmbedBackfill(countEl) {
  // 单批 256：bge-m3 经 Ollama 编码约百级/秒，批太大单个请求拖太久
  let total = 0;
  try {
    let r = await api('/index/embed_backfill', { method: 'POST', body: JSON.stringify({ limit: 256 }) });
    if (r.available === false) return 0;
    total += safeNumber(r.embedded);
    while (safeNumber(r.remaining) > 0 && safeNumber(r.embedded) > 0) {
      countEl.textContent = '正在补齐语义索引，剩余 ' + safeNumber(r.remaining) + ' 片…';
      r = await api('/index/embed_backfill', { method: 'POST', body: JSON.stringify({ limit: 256 }) });
      total += safeNumber(r.embedded);
    }
  } catch (e) { /* 语义补齐失败不阻塞常规使用，下次启动会重试 */ }
  return total;
}

async function drainIndexQueue() {
  const countEl = document.getElementById('count');
  try {
    let st = await api('/index/status');
    let completed = 0;
    while (safeNumber(st.pending) > 0) {
      const pendingBefore = safeNumber(st.pending);
      countEl.textContent = '正在解析 ' + pendingBefore + ' 个文档…';
      const r = await api('/index/run', { method: 'POST', body: JSON.stringify({ limit: 2000 }) });
      completed += safeNumber(r.total);
      const next = await api('/index/status');
      const pendingAfter = safeNumber(next.pending);
      if (pendingAfter >= pendingBefore) {
        countEl.textContent = '索引已暂停：仍有 ' + pendingAfter + ' 个文档待处理';
        toast('索引没有进展，已停止重试');
        return;
      }
      st = next;
    }
    const embedded = await drainEmbedBackfill(countEl);
    if (!completed && !embedded) return;
    const parts = [];
    if (completed) parts.push('已处理 ' + completed + ' 个文档');
    if (embedded) parts.push('补齐语义向量 ' + embedded + ' 片');
    countEl.textContent = parts.join('，') + '，可搜索内容了';
    setTimeout(function () {
      if (!document.getElementById('q').value) load('');
    }, 2500);
  } catch (e) {
    countEl.textContent = '索引暂停，可稍后重试';
    toast('索引失败：' + e.message);
  }
}

/* ---------- 实时监听 ----------
   后端 watcher 在文件落地后自动入库索引（§11.1）。前端做两件事：
   ① 让"它在盯着"这件事可见 —— 顶栏一个常驻小圆点
   ② 新文件进来时刷新列表，并提示一句，不打断当前操作
*/
let liveSeen = 0;          // 上次看到的已入库计数
let livePollTimer = null;
let lastSidecarState = 'starting';
let lastSidecarRevision = -1;
let applicationStarted = false;
let applicationResumePromise = null;
let applicationResumeRequested = false;
let recoveryNoticePending = false;

function setLive(state, text, title) {
  const el = document.getElementById('live');
  el.className = 'live' + (state ? ' ' + state : '');
  document.getElementById('liveText').textContent = text || '';
  el.title = title || '';
}

function setSidecarStatus(info) {
  const el = document.getElementById('sidecarStatus');
  const textEl = document.getElementById('sidecarStatusText');

  // 兼容旧 preload 首次直接给 sidecar:info（{ port, token }）的形式；
  // 新版首次回调来自主进程缓存的 sidecar 状态。
  let state = 'starting';
  if (info && Number.isInteger(Number(info.port)) && Number(info.port) > 0) {
    state = 'ready';
  } else if (info && typeof info.state === 'string') {
    state = info.state;
  }

  const attempt = safeNumber(info && info.attempt);
  const labels = {
    starting: ['正在连接…', '正在启动本地服务'],
    restarting: [attempt > 0 ? ('正在重启（第 ' + attempt + ' 次）…') : '正在重启…', '本地服务正在重启'],
    ready: ['服务已连接', '本地服务运行正常'],
    stopped: ['服务已停止', '本地服务已停止，正在尝试恢复'],
    failed: ['服务不可用', String((info && info.error) || '本地服务启动失败')],
  };
  const entry = labels[state] || ['服务状态未知', '无法识别本地服务状态'];
  const classState = labels[state] ? state : 'stopped';
  if (!el || !textEl) return classState;
  el.className = 'sidecar-status ' + classState;
  textEl.textContent = entry[0];
  el.title = entry[1];
  el.setAttribute('aria-label', entry[1]);
  return classState;
}

function handleSidecarStatus(info) {
  const revision = safeNumber(info && info.revision);
  if (revision > 0 && revision < lastSidecarRevision) return;
  if (revision > 0) lastSidecarRevision = revision;

  const previous = lastSidecarState;
  const state = setSidecarStatus(info);
  lastSidecarState = state;

  if (state === 'ready') {
    if (previous !== 'ready' || (!applicationStarted && !applicationResumePromise)) {
      const recovering = applicationStarted ||
        previous === 'restarting' || previous === 'stopped' || previous === 'failed';
      requestApplicationResume(recovering);
    }
    return;
  }

  // 旧 sidecar 的请求结果不能在断线后覆盖界面；恢复后 boot() 会重新取数。
  loadVersion += 1;
  searchVersion += 1;
  stopWatchPolling();
  liveSeen = 0;
  setLive('off', state === 'starting' ? '等待服务' : '服务中断',
          state === 'failed' ? '本地服务不可用' : '等待本地服务恢复');
}

let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { el.classList.remove('show'); }, 3200);
}

async function pollWatch() {
  try {
    const st = await api('/watch/status');
    const scans = (st.source_scans || []).filter(function (job) {
      return ['queued', 'scanning', 'indexing', 'embedding'].indexOf(job.state) >= 0;
    });
    const progressEl = document.getElementById('count');
    if (scans.length && progressEl) {
      const job = scans[0];
      const phase = job.phase === 'indexing' ? '解析' :
        (job.phase === 'embedding' ? '补齐向量' : '扫描');
      progressEl.textContent = phase + ' ' + safeNumber(job.scanned) +
        ' 个文件，已登记 ' + safeNumber(job.registered) + ' 个';
    }
    const n = st.watched.length;
    if (!st.running || !n) {
      setLive('off', '未监听', '没有已启用的来源');
    } else {
      setLive('', '监听中', n + ' 个目录 · 已自动入库 ' + st.counters.indexed + ' 个文件');
    }

    const done = st.counters.indexed;
    if (liveSeen !== 0 && done > liveSeen) {
      // 有新文件被自动索引了 —— 刷新当前视图并提示
      const latest = st.activity[0];
      const added = done - liveSeen;
      toast(latest && added === 1
        ? '已收录「' + latest.name + '」'
        : '已收录 ' + added + ' 个新文件');

      await runAutoExtClassify(true);
      stats = await api('/stats');
      invalidateTree();
      renderNav();
      const q = document.getElementById('q').value.trim();
      if (q) { doSearch(q); } else { load(''); }
    }
    if (!scans.length && progressEl && progressEl.textContent.indexOf('扫描') === 0) {
      stats = await api('/stats');
      invalidateTree();
      renderNav();
      load(document.getElementById('q').value.trim());
    }
    liveSeen = done;
  } catch (e) {
    setLive('off', '', '监听状态获取失败');
  }
}

function startWatchPolling() {
  if (livePollTimer) return;
  pollWatch();
  livePollTimer = setInterval(pollWatch, 3000);
}

function stopWatchPolling() {
  if (!livePollTimer) return;
  clearInterval(livePollTimer);
  livePollTimer = null;
}

];
var LIGHT_THEMES = { silver: 1, limestone: 1, linen: 1 };
// 家族对偶表：[浅色成员, 深色成员]
var THEME_PAIRS = {
  nebula: ['silver', 'nebula'],
  silver: ['silver', 'steel'],
  steel: ['silver', 'steel'],
  limestone: ['limestone', 'coal'],
  coal: ['limestone', 'coal'],
  linen: ['linen', 'moss'],
  moss: ['linen', 'moss']
};

function themePref() {
  var v = localStorage.getItem('uiTheme') || 'system';
  // 迁移旧的三档取值：system/light/dark 不再是主题名。
  if (v === 'system') { return 'nebula'; }
  if (v === 'light') { return 'silver'; }
  if (v === 'dark') { return 'nebula'; }
  return THEME_PAIRS[v] ? v : 'nebula';
}

function themeFollowsSystem() {
  var raw = localStorage.getItem('uiTheme');
  // 旧值 'system' 是用户**显式**选过的"跟随系统"，保留该选择。
  // 而从未设置过（raw === null）时不跟随：nebula 自己的
  // follow_system_theme 默认就是 0，首启一律是 Nebula 深蓝旗舰。
  if (raw === 'system') { return true; }
  var f = localStorage.getItem('uiFollowSystem');
  return f === null ? false : f === '1';
}

function resolveTheme(pref, follow, systemIsLight) {
  if (!follow) { return pref; }
  var pair = THEME_PAIRS[pref] || THEME_PAIRS.nebula;
  return systemIsLight ? pair[0] : pair[1];
}

// 主进程只接受 #rrggbb（它会验形后才交给 Electron）。token 本身是 hex
// 字面量，但 getComputedStyle 对某些形式会返回 rgb()，两种都归一化。
function hexFromCss(value) {
  var v = String(value || '').trim();
  if (/^#[0-9a-fA-F]{6}$/.test(v)) { return v.toLowerCase(); }
  if (/^#[0-9a-fA-F]{3}$/.test(v)) {
    return '#' + v.slice(1).split('').map(function (c) { return c + c; }).join('').toLowerCase();
  }
  var m = v.match(/^rgba?\(\s*([\d.]+)[,\s]+([\d.]+)[,\s]+([\d.]+)/);
  if (m) {
    return '#' + [m[1], m[2], m[3]].map(function (n) {
      var i = Math.max(0, Math.min(255, Math.round(parseFloat(n))));
      return (i < 16 ? '0' : '') + i.toString(16);
    }).join('');
  }
  return '';
}

function applyTheme() {
  var systemIsLight = !window.matchMedia('(prefers-color-scheme: dark)').matches;
  var id = resolveTheme(themePref(), themeFollowsSystem(), systemIsLight);
  document.documentElement.setAttribute('data-theme', id);
  // 原生 chrome（右键菜单、原生滚动条）跟着走深浅，否则深色主题下会露出
  // 一圈浅色系统控件。Windows 的窗口控件叠加层还需要**确切颜色** —— 从
  // CSS 现场读出，这样 CSS 始终是唯一颜色来源，加主题不必改主进程。
  if (window.inktable.setTheme) {
    var cs = getComputedStyle(document.documentElement);
    window.inktable.setTheme({
      mode: LIGHT_THEMES[id] ? 'light' : 'dark',
      color: hexFromCss(cs.getPropertyValue('--shell')),
      symbolColor: hexFromCss(cs.getPropertyValue('--ink')),
    });
  }
  return id;
}

function themeCardsHtml(pref, follow) {
  var cards = THEMES.map(function (t) {
    var on = t.id === pref;
    return '<button class="theme-card' + (on ? ' on' : '') + '" type="button" data-theme-id="' +
      t.id + '" title="' + esc(t.label) + '" aria-pressed="' + (on ? 'true' : 'false') + '">' +
      // 迷你预览用该主题**自己**的颜色画：这样选择器回答的是"底色、
      // 文字和高亮怎么搭在一起"，而不只是"面板是什么颜色"。
      '<span class="theme-chip" style="background:' + t.shell + '">' +
        '<span class="theme-chip-card" style="background:' + t.card + '">' +
          '<span class="theme-chip-line" style="background:' + t.ink + '"></span>' +
          '<span class="theme-chip-line short" style="background:' + t.accent + '"></span>' +
        '</span></span>' +
      '<span class="theme-card-name">' + esc(t.label) + '</span></button>';
  }).join('');
  return '<div class="theme-grid' + (follow ? ' follows' : '') + '">' + cards + '</div>';
}

async function bindDataDirRow() {
  var label = document.getElementById('dataDirLabel');
  var btn = document.getElementById('dataDirChange');
  if (!label || !btn) return;
  if (!window.inktable.dataGet) {
    label.textContent = '~/Library/Application Support/Inktable';
    btn.style.display = 'none';
    return;
  }
  try {
    var info = await window.inktable.dataGet();
    label.textContent = String(info.dir || '').replace(new RegExp('^/Users/[^/]+'), '~') +
      (info.isDefault ? '（默认）' : '');
  } catch (e) { label.textContent = '读取失败'; }
  btn.onclick = async function () {
    var ok = confirm('更改数据位置？\n\n将把索引数据库、备份和保全副本整体搬到新目录，' +
      '期间本地服务会重启（约几秒）。\n原始文件不受影响。');
    if (!ok) return;
    btn.disabled = true;
    var hint = document.getElementById('sheetHint');
    if (hint) hint.textContent = '正在迁移数据…';
    try {
      var r = await window.inktable.dataChange();
      if (r.canceled) { if (hint) hint.textContent = ''; return; }
      if (r.ok) {
        if (hint) hint.textContent = '';
        toast('数据已迁移到 ' + r.dir);
        bindDataDirRow();
      } else {
        if (hint) hint.textContent = r.error || '迁移失败';
      }
    } catch (e) {
      if (hint) hint.textContent = '迁移失败：' + e.message;
    } finally {
      btn.disabled = false;
    }
  };
}

async function renderSourcesPane(pane) {
  clearTimeout(sourcePaneTimer);
  pane.innerHTML = '<div class="empty" style="padding:30px">加载中…</div>';
  let list;
  try {
    list = (await api('/sources')).sources;
  } catch (e) {
    pane.innerHTML = '<div class="empty" style="padding:30px">加载失败：' + esc(e.message) + '</div>';
    return;
  }

  const on = list.filter(function (s) { return s.enabled; }).length;
  document.getElementById('sheetSub').textContent =
    list.length + ' 个来源 · ' + on + ' 个正在监听';

  if (!list.length) {
    pane.innerHTML = '<div class="empty" style="padding:30px">还没有来源<br>' +
      '<span style="font-size:11px">点「重新发现」自动查找，或手动添加目录</span></div>';
    return;
  }
  pane.innerHTML = list.map(function (s) {
    const tags = [];
    if (s.scan && ['queued', 'scanning', 'indexing'].indexOf(s.scan.state) >= 0) {
      tags.push('<span class="tag">' + (s.scan.phase === 'indexing' ? '解析中' :
        (s.scan.phase === 'embedding' ? '补齐向量中' : '扫描中')) +
        ' · ' + safeNumber(s.scan.scanned) + ' 个</span>');
    } else if (!s.exists) tags.push('<span class="tag gone">目录不存在</span>');
    else if (s.watching) tags.push('<span class="tag live">监听中</span>');
    else if (s.enabled) tags.push('<span class="tag">已启用</span>');
    else tags.push('<span class="tag">已停用</span>');
    if (s.volatile) tags.push('<span class="badge">易失</span>');

    const preserveBtns = s.volatile && s.enabled
      ? '<button class="mini" data-act="autopreserve" data-id="' + esc(s.id) + '" data-on="' + (s.auto_preserve ? 1 : 0) + '">' +
          (s.auto_preserve ? '自动保全:开' : '自动保全:关') + '</button>' +
        '<button class="mini" data-act="preserveall" data-id="' + esc(s.id) + '">立即保全</button>'
      : '';
    const acts = preserveBtns + (s.enabled
      ? '<button class="mini" data-act="disable" data-id="' + esc(s.id) + '">停用</button>'
      : '<button class="mini" data-act="enable" data-id="' + esc(s.id) +
        '" data-path="' + encodedData(s.path) + '" data-name="' + esc(s.name) + '">启用</button>');

    return '<div class="srow">' +
      '<div class="info">' +
        '<div class="nm">' + esc(s.name) + tags.join('') + '</div>' +
        '<div class="pth">' + esc(String(s.path || '').replace(new RegExp('^/Users/[^/]+'), '~')) +
          ' · ' + esc(s.file_count) + ' 个文件</div>' +
      '</div>' +
      '<div class="acts">' + acts +
        '<button class="mini danger" data-act="remove" data-id="' + esc(s.id) +
        '" data-name="' + esc(s.name) + '">移除</button>' +
      '</div></div>';
  }).join('');

  pane.querySelectorAll('button[data-act]').forEach(function (b) {
    b.onclick = function () { onSourceAction(b); };
  });
  if (list.some(function (s) { return s.scan && ['queued', 'scanning', 'indexing'].indexOf(s.scan.state) >= 0; })) {
    sourcePaneTimer = setTimeout(function () {
      if (settingsTab === 'sources' && document.getElementById('sheet').classList.contains('show')) {
        renderSettings();
      }
    }, 1200);
  }
}

/* cc-switch 导入：列出它管理的供应商，点一项填进 LLM 表单 */
async function loadCcswitchProviders() {
  var box = document.getElementById('ccList');
  if (!box) return;
  box.innerHTML = '<span class="hint">读取中…</span>';
  var r;
  try {
    r = await api('/integrations/ccswitch');
  } catch (e) {
    box.innerHTML = '<span class="hint">读取失败：' + esc(e.message) + '</span>';
    return;
  }
  if (!r.available) {
    box.innerHTML = '<span class="hint">没有找到 cc-switch 配置（~/.cc-switch/cc-switch.db）</span>';
    return;
  }
  if (!r.providers.length) {
    box.innerHTML = '<span class="hint">cc-switch 里没有可转换的供应商</span>';
    return;
  }
  // 按来源应用分组展示，别把几十个供应商糊成一列
  var groupLabels = {
    codex: 'Codex（OpenAI 协议，可直接使用）',
    claude: 'Claude Code 中转（需站点兼容 OpenAI 协议）',
    'claude-desktop': 'Claude 桌面端中转（需站点兼容 OpenAI 协议）',
  };
  var groupOrder = ['codex', 'claude', 'claude-desktop'];
  var grouped = {};
  r.providers.forEach(function (p, i) {
    (grouped[p.app_type] = grouped[p.app_type] || []).push([p, i]);
  });
  var keys = groupOrder.filter(function (k) { return grouped[k]; })
    .concat(Object.keys(grouped).filter(function (k) { return groupOrder.indexOf(k) === -1; }));
  box.innerHTML = keys.map(function (k) {
    return '<div class="cc-group">' + esc(groupLabels[k] || k) +
      ' <span class="gn">' + grouped[k].length + '</span></div>' +
      grouped[k].map(function (entry) {
        var p = entry[0];
        return '<div class="cc-item" data-i="' + entry[1] + '">' +
          '<div class="cc-main"><span class="cc-name">' + esc(p.name) +
            (p.is_current ? ' <span class="tag live">当前</span>' : '') + '</span>' +
          '<span class="cc-meta">' + esc(p.endpoint) +
            (p.model ? ' · ' + esc(p.model) : '') + '</span></div></div>';
      }).join('');
  }).join('');
  function markSelected(target) {
    box.querySelectorAll('.cc-item.on').forEach(function (x) { x.classList.remove('on'); });
    if (target) target.classList.add('on');
  }

  box.querySelectorAll('.cc-item').forEach(function (it) {
    it.onclick = function () {
      var p = r.providers[+it.dataset.i];
      if (!p) return;
      markSelected(it);
      document.getElementById('llmEp').value = p.endpoint;
      if (p.model) document.getElementById('llmModel').value = p.model;
      // cc-switch secrets never cross the sidecar HTTP boundary. Fill only
      // non-secret metadata; the user pastes the key into Electron's encrypted
      // settings flow explicitly.
      document.getElementById('llmKey').value = '';
      var hint = document.getElementById('llmHint');
      if (hint) hint.textContent = '已填入「' + p.name + '」的端点和模型；' +
        '出于密钥安全，请手动粘贴 API Key 后保存并检测连接';
    };
  });

  // 打开列表时自动标出与当前表单一致的供应商，一眼知道现在用的是谁
  var currentEp = (document.getElementById('llmEp').value || '').trim().replace(/\/+$/, '');
  var currentModel = (document.getElementById('llmModel').value || '').trim();
  if (currentEp) {
    var matched = r.providers.findIndex(function (p) {
      if (p.endpoint.replace(/\/+$/, '') !== currentEp) return false;
      return !p.model || !currentModel || p.model === currentModel;
    });
    if (matched >= 0) {
      markSelected(box.querySelector('.cc-item[data-i="' + matched + '"]'));
    }
  }
}

async function onSourceAction(btn) {
  const act = btn.dataset.act;
  const hint = document.getElementById('sheetHint');
  let sourcePath = null;

  if (act === 'remove') {
    // 破坏性操作要说清后果：会清索引，但不会动磁盘上的文件
    const ok = confirm('移除「' + btn.dataset.name + '」？\n\n' +
      '将清除它的文件记录与搜索索引。\n磁盘上的原文件不会被删除。');
    if (!ok) return;
  }

  btn.disabled = true;
  if (act === 'enable') {
    sourcePath = decodeURIComponent(btn.dataset.path);
    const ok = await previewAndConfirmSource({ name: btn.dataset.name, path: sourcePath }, hint);
    if (!ok) {
      btn.disabled = false;
      return;
    }
  }
  hint.textContent = '处理中…';
  try {
    if (act === 'autopreserve') {
      await api('/sources/auto_preserve', { method: 'POST', body: JSON.stringify({
        source_id: +btn.dataset.id, enabled: btn.dataset.on !== '1' }) });
      hint.textContent = '';
      await renderSettings();
      return;
    } else if (act === 'preserveall') {
      hint.textContent = '正在复制…';
      const r = await api('/sources/preserve_all', { method: 'POST', body: JSON.stringify({
        source_id: +btn.dataset.id }) });
      hint.textContent = '已保全 ' + r.preserved + ' 个' + (r.failed ? '，失败 ' + r.failed : '');
      btn.disabled = false;
      return;
    } else if (act === 'disable') {
      await api('/sources/disable', { method: 'POST', body: JSON.stringify({ source_id: +btn.dataset.id }) });
    } else if (act === 'remove') {
      await api('/sources/remove', { method: 'POST', body: JSON.stringify({ source_id: +btn.dataset.id }) });
    } else if (act === 'enable') {
      await api('/sources/enable', { method: 'POST', body: JSON.stringify({
        name: btn.dataset.name, path: sourcePath }) });
      runIndexing();
    }
    hint.textContent = '';
    await renderSettings();
    stats = await api('/stats');
    await refreshCats();
    invalidateTree();
    renderNav();
    await runAutoExtClassify(true);
    await load(document.getElementById('q').value.trim());
    pollWatch();
  } catch (e) {
    hint.textContent = '失败：' + e.message;
    btn.disabled = false;
  }
}

document.getElementById('gear').onclick = function () { sheetOpen(true); };
document.getElementById('backToList').onclick = function () { showListPage(); };
document.getElementById('qaClear').onclick = function () { resetQaThread(); };
document.getElementById('modelState').onclick = function () {
  if (!llmInfo.configured) return sheetOpen(true, 'model');
  return testModelConnection();
};
document.getElementById('querySubmit').onclick = function () {
  executeQuery(document.getElementById('q').value.trim());
};
document.getElementById('askSubmit').onclick = function () {
  runAsk(document.getElementById('askQ').value);
};
document.getElementById('askQ').onkeydown = function (event) {
  if (event.key === 'Enter' && !event.shiftKey) {
    event.preventDefault();
    if (!document.getElementById('askSubmit').disabled) runAsk(event.target.value);
  }
};
document.getElementById('askQ').oninput = function (event) {
  // 输入框随内容自动长高，上限 140px
  var box = event.target;
  box.style.height = 'auto';
  box.style.height = Math.min(box.scrollHeight, 140) + 'px';
};
document.getElementById('btnClose').onclick = function () { sheetOpen(false); };
document.getElementById('sheet').onclick = function (e) {
  if (e.target.id === 'sheet') sheetOpen(false);   // 点遮罩关闭
};

async function addDirectorySource(nameHint) {
  const dir = await window.inktable.pickDirectory();
  if (!dir) return;
  const hint = document.getElementById('sheetHint');
  const base = dir.split(/[\\/]/).filter(Boolean).slice(-1)[0] || '所选目录';
  const source = { name: nameHint || base, path: dir };
  if (!await previewAndConfirmSource(source, hint)) return;
  hint.textContent = '正在扫描…';
  try {
    await api('/sources/add', { method: 'POST',
      body: JSON.stringify({ path: dir, name: nameHint || null }) });
    hint.textContent = '';
    await renderSettings();
    stats = await api('/stats');
    invalidateTree();
    renderNav();
    await runAutoExtClassify(true);
    await load('');
    runIndexing();
    pollWatch();
  } catch (e) {
    hint.textContent = '添加失败：' + e.message;
  }
}

document.getElementById('btnAdd').onclick = function () { addDirectorySource(null); };

document.getElementById('btnRescan').onclick = async function () {
  const hint = document.getElementById('sheetHint');
  hint.textContent = '正在查找…';
  try {
    const found = (await api('/sources/discover', { method: 'POST' })).sources;
    const known = new Set((await api('/sources')).sources.map(function (s) { return s.path; }));
    // 噪音抑制在后端发现阶段完成（工作应用/旧版路径需有文档才上报），
    // 这里只过滤已登记的 —— 下载/QQ 这类明确入口即使暂无文档也要能启用
    const fresh = found.filter(function (s) { return !known.has(s.path); });
    hint.textContent = '';
    // 发现结果不自动启用 —— §1 约束 4：用户没同意的目录不监听。
    // 没有新来源也要打开弹层：「全盘发现」在弹层里，入口不能堵死。
    sources = fresh;
    sheetOpen(false);
    document.getElementById('setup').style.display = 'flex';
    renderSetup();
    if (!fresh.length) {
      document.getElementById('setupSub').textContent =
        '没有发现新的固定盘。固定盘启用后，盘内目录会按真实路径展开。';
    }
  } catch (e) {
    hint.textContent = '查找失败：' + e.message;
  }
};

document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') {
    var sheetShown = document.getElementById('sheet').classList.contains('show');
    sheetOpen(false);
    // 设置面板没开时，Esc 从详情页退回文件列表
    if (!sheetShown && detailPageOpen) showListPage();
  }
  if ((e.metaKey || e.ctrlKey) && e.key === ',') { e.preventDefault(); sheetOpen(true); }
  if (e.key === 'Enter' && e.target && e.target.id === 'q') {
    e.preventDefault();
    executeQuery(e.target.value.trim());
  }
  if ((e.metaKey || e.ctrlKey) && e.key === 'f') {
    e.preventDefault();
    if (detailPageOpen) showListPage();
    document.getElementById('q').focus();
    document.getElementById('q').select();
  }
  // 抽屉开合。Ctrl+1/2 对应左右两栏，与顶栏按钮同一入口。
  if ((e.metaKey || e.ctrlKey) && (e.key === '1' || e.key === '2')) {
    if (typeof window.toggleDrawer === 'function') {
      e.preventDefault();
      window.toggleDrawer(e.key === '1' ? 'nav' : 'qa');
    }
  }
});

async function boot(skipSetup = false) {
  stats = await api('/stats');
  await refreshCats();
  try { updateModelState(await api('/settings/llm')); } catch (e) { updateModelState({ configured: false }); }
  // 启动即后台检测模型可用性（真实补全探测），不阻塞界面
  scheduleModelAutoCheck();
  if (stats.files === 0 && !skipSetup) {
    document.getElementById('setup').style.display = 'flex';
    sources = (await api('/sources/discover', { method: 'POST' })).sources;
    renderSetup();
    return { hasFiles: false };
  }
  document.getElementById('setup').style.display = 'none';
  await runAutoExtClassify(false);
  renderNav();
  updateWorkbenchChrome();
  const q = document.getElementById('q').value.trim();
  if (q) await executeQuery(q);
  else await load('');
  // 每周报告：本周还没有就后台生成一份（幂等，同周复用）
  api('/reports/weekly').then(function (r) {
    if (r && r.generated) toast('本周知识库报告已生成，见左栏「本周报告」');
  }).catch(function () {});
  return { hasFiles: true };
}

function requestApplicationResume(recovered) {
  applicationResumeRequested = true;
  recoveryNoticePending = recoveryNoticePending || recovered;
  if (applicationResumePromise) return applicationResumePromise;

  applicationResumePromise = (async function () {
    while (applicationResumeRequested && lastSidecarState === 'ready') {
      applicationResumeRequested = false;
      const showRecoveryNotice = recoveryNoticePending;
      recoveryNoticePending = false;

      try {
        const state = await boot();
        if (lastSidecarState !== 'ready') {
          applicationResumeRequested = true;
          return;
        }
        applicationStarted = true;

        // 恢复后重新挂上来源监听、重建轮询并续跑索引；后端接口均幂等。
        try { await api('/watch/start', { method: 'POST' }); } catch (e) {}
        if (state.hasFiles) {
          startWatchPolling();
          runIndexing(showRecoveryNotice);
        }
        if (showRecoveryNotice) toast('本地服务已恢复');
      } catch (e) {
        if (lastSidecarState === 'ready') {
          setSidecarStatus({ state: 'failed', error: e.message });
          document.getElementById('rows').innerHTML =
            '<div class="empty">启动失败：' + esc(e.message) + '</div>';
        }
        return;
      }
    }
  })().finally(function () {
    applicationResumePromise = null;
    if (applicationResumeRequested && lastSidecarState === 'ready') {
      requestApplicationResume(recoveryNoticePending);
    }
  });
  return applicationResumePromise;
}

// 启动即应用保存的界面偏好（缩放 / 主题）；旧 preload 没有这些桥则跳过
try {
  if (window.inktable.setZoom) {
    window.inktable.setZoom(parseFloat(localStorage.getItem('uiZoom') || '1') || 1);
  }
  applyTheme();
  // 跟随系统时，系统外观变化要当场重算家族成员（不必重启）。
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () {
    if (themeFollowsSystem()) applyTheme();
  });
} catch (e) { /* 界面偏好失败不影响主流程 */ }

// 恢复上次的问答会话
restoreQaThread();
initSplitters();

// 全局快捷键（⌥Space）呼出 → 回列表页并聚焦搜索框
if (window.inktable.onFocusSearch) {
  window.inktable.onFocusSearch(function () {
    if (detailPageOpen) showListPage();
    var q = document.getElementById('q');
    q.focus();
    q.select();
  });
}

if (window.inktable && typeof window.inktable.onSidecar === 'function') {
  window.inktable.onSidecar(handleSidecarStatus);
} else {
  // 开发/旧 preload 兼容：若能直接取得可用连接信息，仍可正常启动。
  window.inktable.getSidecarInfo().then(function (info) {
    handleSidecarStatus(info || { state: 'failed', error: 'sidecar 未就绪' });
  });
}
</script>
