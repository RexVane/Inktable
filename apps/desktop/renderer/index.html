<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src http://127.0.0.1:*; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'" />
<title>Inktable</title>
<style>
  /* 结构性 reset —— 全部视觉规则集中在 workbench.css，避免两处定义漂移 */
  * { box-sizing: border-box; }
  html { color-scheme: light dark; }
  body { margin: 0; height: 100vh; overflow: hidden; -webkit-user-select: none; }
</style>
<link rel="stylesheet" href="workbench.css" />
</head>
<body>
  <div class="main">
    <div class="topbar">
      <div class="topbar-brand" aria-label="Inktable 个人知识库">
        <span class="brand-mark" aria-hidden="true">墨</span>
        <div class="brand-copy"><div class="brand-name">Inktable</div><div class="brand-subtitle">个人知识库</div></div>
      </div>
      <div class="view-title"><span class="scope-name" id="topbarScope">全部内容</span></div>
      <div class="topbar-spacer"></div>
      <div class="status-cluster">
        <span class="live off" id="live" title=""><span class="dot"></span><span id="liveText"></span></span>
        <span class="sidecar-status starting" id="sidecarStatus" title="正在连接本地服务" aria-live="polite">
          <span class="dot"></span><span id="sidecarStatusText">正在连接…</span>
        </span>
        <button class="gear" id="gear" type="button" title="来源与设置" aria-label="来源与设置">⚙</button>
      </div>
    </div>
    <div class="workspace" id="workspace">
      <div class="content-layout">
        <section class="results-panel" aria-label="文件管理">
          <div class="panel-head"><span class="panel-title" id="resultsTitle">文件管理</span><span class="count" id="count"></span></div>
          <div class="file-search">
            <div class="query-controls">
              <input class="search" id="q" placeholder="搜索内容或文件名…" autocomplete="off" />
              <button class="query-submit" id="querySubmit" type="button" title="搜索" aria-label="搜索">→</button>
            </div>
          </div>
          <div class="nav" id="nav"></div>
          <div class="rows" id="rows"><div class="workbench-empty"><div><div class="empty-mark">⌕</div><div class="empty-title">正在载入内容</div></div></div></div>
        </section>
        <section class="evidence-panel" aria-label="文件详情">
          <div class="panel-head"><span class="panel-title">文件详情</span></div>
          <div class="evidence-content" id="evidence"><div class="evidence-empty"><div><div class="empty-mark">¶</div><div class="empty-title">选择一条结果</div><div class="empty-meta">在这里查看原文片段和定位信息</div></div></div></div>
        </section>
        <aside class="qa-panel" aria-label="知识问答">
          <div class="panel-head qa-head"><span class="panel-title">知识问答</span><button class="model-state" id="modelState" type="button">未配置模型</button></div>
          <div class="answer-rows" id="answerRows"><div class="qa-empty"><div><div class="empty-mark">?</div><div class="empty-title">询问你的知识库</div><div class="empty-meta">回答会附带可定位的原文引用</div></div></div></div>
          <div class="qa-composer">
            <textarea id="askQ" rows="2" placeholder="输入问题…"></textarea>
            <button id="askSubmit" class="qa-submit" type="button">提问</button>
          </div>
        </aside>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <div class="ctx" id="ctx"></div>

  <div class="sheet" id="sheet">
    <div class="sheet-box">
      <div class="sheet-head">
        <h2>文件来源</h2>
        <span class="sub" id="sheetSub"></span>
      </div>
      <div class="sheet-body" id="sheetBody"></div>
      <div class="sheet-foot">
        <button class="mini" id="btnAdd">添加目录…</button>
        <button class="mini" id="btnRescan">重新发现</button>
        <span class="hint" id="sheetHint" style="margin-left:auto"></span>
        <button class="mini" id="btnClose">完成</button>
      </div>
    </div>
  </div>

  <div class="setup" id="setup" style="display:none">
    <div class="drag"></div>
    <div class="body">
      <h1>发现文件来源</h1>
      <div class="sub" id="setupSub">正在扫描…</div>
      <div id="srcList"></div>
    </div>
    <div class="foot">
      <button id="btnEnable" disabled>启用并开始索引</button>
      <button class="ghost" id="btnSkip">全不选</button>
      <span class="hint" id="setupHint"></span>
    </div>
  </div>

<script>
const PAGE_SIZE = 300;
let sources = [], files = [], activeSource = null, stats = null;
let categories = { tree: [], unclassified: 0 };
let activeCategory = null;   // 数字=分类id, 'none'=未分类, null=不过滤
let books = [];
let activeBook = null;
let activeExt = null;        // null=不过滤，空字符串=无扩展名
let activeDuplicate = false;
let filesTotal = 0;
let currentQuery = '';
let loadVersion = 0;
let searchVersion = 0;
let llmInfo = { configured: false };
let selectedEvidence = null;
let detailVersion = 0;

function currentScopeLabel() {
  if (activeBook !== null) {
    var book = books.find(function (item) { return item.id === activeBook; });
    return book ? ('文件书 · ' + book.name) : '当前文件书';
  }
  if (activeSource !== null) return '来源 · ' + activeSource;
  if (activeCategory !== null) {
    if (activeCategory === 'none') return '未分类资料';
    var category = categories.tree.find(function (item) { return item.id === activeCategory; });
    return category ? ('分类 · ' + category.name) : '当前分类';
  }
  if (activeExt !== null) return '类型 · ' + (activeExt || '无扩展名');
  if (activeDuplicate) return '重复内容';
  return '全部内容';
}

function updateWorkbenchChrome() {
  var scope = currentScopeLabel();
  document.getElementById('topbarScope').textContent = scope;
  document.getElementById('q').placeholder = '搜索事实、片段或文件名…';
  document.getElementById('querySubmit').title = '搜索';
  document.getElementById('querySubmit').setAttribute('aria-label', '搜索');
}

function updateModelState(status) {
  llmInfo = status || { configured: false };
  var button = document.getElementById('modelState');
  var submit = document.getElementById('askSubmit');
  if (!button || !submit) return;
  if (llmInfo.available === true) {
    button.className = 'model-state ready';
    button.textContent = '模型可用';
    button.title = (llmInfo.model || '当前模型') + '连接正常';
    submit.disabled = false;
  } else if (llmInfo.available === false && llmInfo.configured) {
    button.className = 'model-state error';
    button.textContent = llmInfo.message || '模型不可用';
    button.title = '点击重新检测连接';
    submit.disabled = true;
  } else if (llmInfo.configured) {
    button.className = 'model-state pending';
    button.textContent = '检测模型';
    button.title = '已配置，点击检测连接';
    submit.disabled = true;
  } else {
    button.className = 'model-state off';
    button.textContent = '未配置模型';
    button.title = '点击打开模型设置';
    submit.disabled = true;
  }
}

async function testModelConnection(hint) {
  var button = document.getElementById('modelState');
  button.className = 'model-state checking';
  button.textContent = '检测中…';
  button.disabled = true;
  if (hint) hint.textContent = '正在检测模型连接…';
  try {
    var status = await api('/settings/llm/test', { method: 'POST' });
    updateModelState(status);
    if (hint) hint.textContent = status.message || (status.available ? '模型连接正常' : '模型不可用');
    return status;
  } catch (e) {
    var failed = { configured: llmInfo.configured, available: false, code: 'unreachable', message: '检测失败：' + e.message };
    updateModelState(failed);
    if (hint) hint.textContent = failed.message;
    return failed;
  } finally {
    button.disabled = false;
  }
}

function renderKnowledgeEmpty() {
  document.getElementById('count').textContent = '';
  document.getElementById('rows').innerHTML = '<div class="workbench-empty"><div><div class="empty-mark">⌕</div><div class="empty-title">没有内容</div></div></div>';
  clearEvidence();
}

function clearEvidence() {
  selectedEvidence = null;
  document.getElementById('evidence').innerHTML = '<div class="evidence-empty"><div><div class="empty-mark">¶</div><div class="empty-title">选择一条结果</div><div class="empty-meta">在这里查看原文片段和定位信息</div></div></div>';
}

function showEvidence(evidence) {
  if (!evidence) return clearEvidence();
  selectedEvidence = evidence;
  var location = evidence.page ? ('第 ' + evidence.page + ' 页') : (evidence.section_path || evidence.locator || '原文片段');
  var path = evidence.path || evidence.file_path || '';
  var fileId = evidence.file_id || null;
  document.getElementById('evidence').innerHTML = '<div class="evidence-document">' +
    '<div class="evidence-document-head"><div class="evidence-name">' + esc(evidence.name || evidence.file_name || '未命名文档') + '</div>' +
    '<div class="evidence-locator">' + esc(location) + '</div></div>' +
    '<div class="evidence-text">' + esc(evidence.text || evidence.snippet || '没有可显示的原文片段。') + '</div>' +
    ((path || fileId) ? '<div class="evidence-actions">' +
      (fileId ? '<button class="text-button" id="openEvidenceDetail" type="button">查看文件详情</button>' : '') +
      (path ? '<button class="text-button" id="revealEvidence" type="button">在 Finder 中显示</button>' : '') +
      '</div>' : '') +
    '</div>';
  var button = document.getElementById('revealEvidence');
  if (button) button.onclick = function () { window.inktable.revealInFinder(path); };
  var detailButton = document.getElementById('openEvidenceDetail');
  if (detailButton) detailButton.onclick = function () {
    showFileDetail({ file_id: fileId, name: evidence.file_name, path: path });
  };
}

function detailSectionHtml(section) {
  var location = section.page ? ('第 ' + section.page + ' 页') :
    (section.section_path || section.locator || section.title || '正文片段');
  return '<article class="detail-section">' +
    '<div class="detail-section-locator">' + esc(location) + '</div>' +
    '<div class="detail-section-text">' + esc(section.text || '没有可显示的正文。') + '</div>' +
    '</article>';
}

function renderFileDetail(detail) {
  var file = detail.file || {};
  var documentInfo = detail.document || {};
  var path = file.preserved_path || file.path || '';
  var meta = [file.ext || file.mime, fmtSize(file.size), file.source && file.source.name, fmtDate(file.mtime)]
    .filter(Boolean).join(' · ');
  var sections = Array.isArray(detail.sections) ? detail.sections : [];
  document.getElementById('evidence').innerHTML = '<div class="file-detail">' +
    '<div class="file-detail-head"><div class="evidence-name">' + esc(file.name || documentInfo.title || '未命名文档') + '</div>' +
    '<div class="file-detail-meta">' + esc(meta || '文件详情') + '</div>' +
    (path ? '<div class="file-detail-path">' + esc(path) + '</div>' : '') +
    ((documentInfo.summary_text || documentInfo.summary) ? '<div class="file-summary">' + esc(documentInfo.summary_text || documentInfo.summary) + '</div>' : '') +
    (path ? '<button class="text-button" id="revealEvidence" type="button">在 Finder 中显示</button>' : '') + '</div>' +
    '<div class="detail-sections">' +
      (sections.length ? sections.map(detailSectionHtml).join('') : '<div class="detail-empty">该文件还没有可展示的索引正文</div>') +
      (detail.truncated ? '<div class="detail-more">仅显示前 ' + esc(sections.length) + ' 个片段</div>' : '') +
    '</div></div>';
  var button = document.getElementById('revealEvidence');
  if (button) button.onclick = function () { window.inktable.revealInFinder(path); };
}

async function showFileDetail(file) {
  if (!file) return clearEvidence();
  var fileId = file.file_id || file.id;
  if (!fileId) return showEvidence({ name: file.name, text: file.path || '', path: openPathForFile(file) });
  var version = ++detailVersion;
  document.getElementById('evidence').innerHTML = '<div class="detail-loading">正在读取文件详情…</div>';
  try {
    var detail = await api('/files/' + encodeURIComponent(fileId) + '/detail');
    if (version === detailVersion) renderFileDetail(detail);
  } catch (e) {
    if (version === detailVersion) {
      document.getElementById('evidence').innerHTML = '<div class="detail-error">文件详情加载失败：' + esc(e.message) + '</div>';
    }
  }
}

function showSearchFileDetail(file) {
  detailVersion += 1;
  var snippets = Array.isArray(file.snippets) ? file.snippets : [];
  var path = file.path || '';
  document.getElementById('evidence').innerHTML = '<div class="file-detail">' +
    '<div class="file-detail-head"><div class="evidence-name">' + esc(file.name || '未命名文档') + '</div>' +
    '<div class="file-detail-meta">' + esc([file.ext, file.source_name].filter(Boolean).join(' · ') || '检索命中') + '</div>' +
    (path ? '<div class="file-detail-path">' + esc(path) + '</div><button class="text-button" id="revealEvidence" type="button">在 Finder 中显示</button>' : '') + '</div>' +
    '<div class="detail-sections">' + (snippets.length ? snippets.map(detailSectionHtml).join('') : '<div class="detail-empty">没有可显示的命中片段</div>') + '</div></div>';
  var button = document.getElementById('revealEvidence');
  if (button) button.onclick = function () { window.inktable.revealInFinder(path); };
}

async function api(path, opts = {}) {
  const info = await window.inktable.getSidecarInfo();
  if (!info) throw new Error('sidecar 未就绪');
  const r = await fetch('http://127.0.0.1' + ':' + info.port + path, {
    ...opts,
    headers: { 'Content-Type': 'application/json',
               Authorization: 'Bearer ' + info.token, ...(opts.headers || {}) },
  });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

function fmtSize(b) {
  if (!b) return '';
  if (b < 1024) return b + ' B';
  if (b < 1048576) return (b / 1024).toFixed(0) + ' KB';
  if (b < 1073741824) return (b / 1048576).toFixed(1) + ' MB';
  return (b / 1073741824).toFixed(1) + ' GB';
}
function fmtDate(ts) {
  if (!ts) return '';
  const days = Math.floor((Date.now() / 1000 - ts) / 86400);
  if (days <= 0) return '今天';
  if (days === 1) return '昨天';
  if (days < 7) return days + ' 天前';
  const d = new Date(ts * 1000);
  return (d.getMonth() + 1) + '月' + d.getDate() + '日';
}

function renderNav() {
  const el = document.getElementById('nav');
  const unfiltered = activeSource === null && activeCategory === null &&
    activeBook === null && activeExt === null && !activeDuplicate;
  let h = '<div class="nav-group">范围</div>';
  h += '<div class="nav-item' + (unfiltered ? ' on' : '') + '" data-src="">' +
       '<span class="label">全部文件</span><span class="n">' + esc(stats ? stats.files : '') + '</span></div>';
  if (stats && stats.deduped > 0) {
    h += '<div class="nav-item' + (activeDuplicate ? ' on' : '') + '" data-dup="1"><span class="label">重复内容</span>' +
         '<span class="n">' + esc(stats.deduped) + '</span></div>';
  }
  h += '<div class="nav-group">分类 <span class="nav-add" id="catAdd" title="新建分类">＋</span></div>';
  h += '<div id="catInputWrap"></div>';
  categories.tree.forEach(function (c) {
    var pad = 8 + safeNumber(c.depth) * 14;
    h += '<div class="nav-item' + (activeCategory === c.id ? ' on' : '') + '" data-cat="' + esc(c.id) +
         '" style="padding-left:' + pad + 'px">' +
         '<span class="label">' + esc(c.name) + '</span>' +
         '<span class="n">' + esc(c.total_count || '') + '</span></div>';
  });
  h += '<div class="nav-item' + (activeCategory === 'none' ? ' on' : '') + '" data-cat="none">' +
       '<span class="label">未分类</span><span class="n">' + esc(categories.unclassified) + '</span></div>';

  h += '<div class="nav-group">文件书 <span class="nav-add" id="bookAdd" title="新建文件书">＋</span></div>';
  h += '<div id="bookInputWrap"></div>';
  books.forEach(function (b) {
    h += '<div class="nav-item' + (activeBook === b.id ? ' on' : '') + '" data-book="' + esc(b.id) + '">' +
         '<span class="label">' + esc(b.name) + '</span><span class="n">' + esc(b.n || '') + '</span></div>';
  });

  if (stats && stats.by_source.length) {
    h += '<div class="nav-group">来源</div>';
    stats.by_source.forEach(function (s) {
      h += '<div class="nav-item' + (activeSource === s.name ? ' on' : '') + '" data-src="' + esc(s.name) + '">' +
           '<span class="label">' + esc(s.name) + '</span><span class="n">' + esc(s.c) + '</span></div>';
    });
  }
  if (stats && stats.by_ext.length) {
    h += '<div class="nav-group">类型</div>';
    stats.by_ext.slice(0, 6).forEach(function (e) {
      const ext = e.ext || '';
      h += '<div class="nav-item' + (activeExt === ext ? ' on' : '') + '" data-ext="' + esc(ext) + '">' +
           '<span class="label">' + esc(e.ext || '无扩展名') + '</span><span class="n">' + esc(e.c) + '</span></div>';
    });
  }
  el.innerHTML = h;
  el.querySelectorAll('.nav-item').forEach(function (it) {
    it.onclick = function () {
      activeSource = null; activeCategory = null; activeBook = null;
      activeExt = null; activeDuplicate = false;
      if (it.dataset.book !== undefined) {
        activeBook = +it.dataset.book;
      } else if (it.dataset.cat !== undefined) {
        var v = it.dataset.cat;
        activeCategory = (v === 'none') ? 'none' : +v;
      } else if (it.dataset.dup !== undefined) {
        activeDuplicate = true;
      } else if (it.dataset.ext !== undefined) {
        activeExt = it.dataset.ext;
      } else {
        activeSource = it.dataset.src || null;
      }
      renderNav();
      updateWorkbenchChrome();
      document.getElementById('q').value = '';
      load('');
    };
  });
  bindBookAdd();
  var addBtn = document.getElementById('catAdd');
  if (addBtn) addBtn.onclick = function (e) {
    e.stopPropagation();
    var wrap = document.getElementById('catInputWrap');
    wrap.innerHTML = '<input class="nav-input" id="catInput" placeholder="分类名，回车创建">';
    var inp = document.getElementById('catInput');
    inp.focus();
    inp.onkeydown = async function (ev) {
      if (ev.key === 'Escape') { wrap.innerHTML = ''; return; }
      if (ev.key !== 'Enter') return;
      var name = inp.value.trim();
      if (!name) { wrap.innerHTML = ''; return; }
      try {
        await api('/categories', { method: 'POST', body: JSON.stringify({ name: name }) });
        wrap.innerHTML = '';
        await refreshCats();
        renderNav();
      } catch (e2) { inp.value = ''; inp.placeholder = '创建失败：' + e2.message; }
    };
  };
}

async function refreshCats() {
  try { categories = await api('/categories'); } catch (e) {}
  try { books = (await api('/books')).books; } catch (e) {}
}

function bindBookAdd() {
  var b = document.getElementById('bookAdd');
  if (!b) return;
  b.onclick = function (e) {
    e.stopPropagation();
    var wrap = document.getElementById('bookInputWrap');
    wrap.innerHTML = '<input class="nav-input" id="bookInput" placeholder="书名，回车创建">';
    var inp = document.getElementById('bookInput');
    inp.focus();
    inp.onkeydown = async function (ev) {
      if (ev.key === 'Escape') { wrap.innerHTML = ''; return; }
      if (ev.key !== 'Enter') return;
      var name = inp.value.trim();
      if (!name) { wrap.innerHTML = ''; return; }
      try {
        await api('/books', { method: 'POST', body: JSON.stringify({ name: name }) });
        wrap.innerHTML = '';
        await refreshCats(); renderNav();
      } catch (e2) { inp.value = ''; inp.placeholder = '创建失败'; }
    };
  };
}

function renderRows() {
  const el = document.getElementById('rows');
  if (!files.length) {
    el.innerHTML = '<div class="empty">没有匹配的文件</div>';
    return;
  }
  const rows = files.map(function (f) {
    // 原件没了但有副本 → 双击落到副本（保全存在的意义）
    var openPath = f.path;
    if (f.state === 'missing' && f.preserved_path) openPath = f.preserved_path;
    var gone = f.state === 'missing' && !f.preserved_path;
    var kind = String(f.ext || '').replace('.', '').toLowerCase();
    return '<div class="row' + (gone ? ' gone' : '') + '" data-path="' + encodedData(openPath) + '" data-index="' + encodedData(f.id) + '">' +
      '<span class="icon t-' + esc(kind) + '">' + esc((kind || '·').slice(0, 4).toUpperCase()) + '</span>' +
      '<span class="fname">' + esc(f.name) +
        (f.state === 'missing' ? ' <span class="tag' + (f.preserved_path ? '' : ' gone') + '">' +
          (f.preserved_path ? '已保全' : '原文件已消失') + '</span>' : '') +
      '</span>' +
      '<span class="fsrc' + (f.volatile ? ' vol' : '') + '">' + esc(f.source_name || '') + '</span>' +
      '<span class="fsize">' + esc(fmtSize(f.size)) + '</span>' +
      '<span class="fdate">' + esc(fmtDate(f.mtime)) + '</span>' +
    '</div>';
  }).join('');
  const more = files.length < filesTotal
    ? '<div class="load-more"><button id="loadMore">加载更多</button>' +
      '<span>已显示 ' + esc(files.length) + ' / ' + esc(filesTotal) + '</span></div>'
    : '';
  el.innerHTML = rows + more;
  el.querySelectorAll('.row').forEach(function (r, idx) {
    r.onclick = function () {
      el.querySelectorAll('.row.on').forEach(function (item) { item.classList.remove('on'); });
      r.classList.add('on');
      showFileDetail(files[idx]);
    };
    r.ondblclick = function () {
      window.inktable.revealInFinder(decodeURIComponent(r.dataset.path));
    };
    r.oncontextmenu = function (e) {
      e.preventDefault();
      openCtxMenu(e.clientX, e.clientY, files[idx]);
    };
  });
  const moreBtn = document.getElementById('loadMore');
  if (moreBtn) moreBtn.onclick = async function () {
    moreBtn.disabled = true;
    moreBtn.textContent = '加载中…';
    try {
      await load(currentQuery, true);
    } catch (e) {
      moreBtn.disabled = false;
      moreBtn.textContent = '重试加载';
      toast('加载失败：' + e.message);
    }
  };
}

function openPathForFile(file) {
  return file && file.state === 'missing' && file.preserved_path ? file.preserved_path : (file && file.path ? file.path : '');
}

/* 右键归类：列出分类树，点即归；底部可勾"同类型以后自动归" */
function openCtxMenu(x, y, file) {
  var el = document.getElementById('ctx');
  var h = '<div class="ci dim">归类「' + esc(String(file.name || '').slice(0, 18)) + '」到…</div>';
  categories.tree.forEach(function (c) {

async function load(q, append = false) {
  const query = String(q || '').trim();
  document.getElementById('resultsTitle').textContent = query ? '文件搜索' : '文件管理';
  if (!append) {
    searchVersion += 1;  // 列表导航使尚未返回的全文搜索失效
    currentQuery = query;
    files = [];
    filesTotal = 0;
  } else if (query !== currentQuery) {
    return load(query, false);
  }
  const version = append ? loadVersion : ++loadVersion;
  const params = new URLSearchParams({
    limit: String(PAGE_SIZE),
    offset: String(append ? files.length : 0),
  });
  if (query) params.set('q', query);
  if (activeCategory === 'none') params.set('unclassified', 'true');
  else if (activeCategory !== null) params.set('category_id', String(activeCategory));
  if (activeBook !== null) params.set('book_id', String(activeBook));
  if (activeSource !== null) params.set('source', activeSource);
  if (activeExt !== null) params.set('ext', activeExt);
  if (activeDuplicate) params.set('duplicate', 'true');
  const d = await api('/files?' + params);
  if (version !== loadVersion) return;
  const page = Array.isArray(d.files) ? d.files : [];
  files = append ? files.concat(page) : page;
  filesTotal = Math.max(0, safeNumber(d.total));
  document.getElementById('count').textContent = filesTotal + ' 个文件';
  renderRows();
}

/* 全文搜索：搜内容而非文件名。文件名匹配与内容匹配合并展示 */
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}
function encodedData(value) {
  return esc(encodeURIComponent(String(value == null ? '' : value)));
}
function safeNumber(value) {
  const n = Number(value);
  return Number.isFinite(n) ? n : 0;
}
function highlight(text, q) {
  const safe = esc(text);
  if (!q) return safe;
  // 逐字符高亮：中文没有词边界，按查询串里的字符片段匹配
  const terms = q.split(/\s+/).filter(Boolean).map(esc);
  let out = safe;
  terms.forEach(function (t) {
    if (t.length < 1) return;
    out = out.split(t).join('<em>' + t + '</em>');
  });
  return out;
}

function renderHits(result, q) {
  const el = document.getElementById('rows');
  document.getElementById('resultsTitle').textContent = '检索结果';
  if (!result.files.length) {
    el.innerHTML = '<div class="workbench-empty"><div><div class="empty-mark">⌕</div><div class="empty-title">没有找到匹配内容</div>' +
      '<div class="empty-meta">试试其他关键词，或检查文档是否已完成索引</div></div></div>';
    clearEvidence();
    return;
  }
  let h = '<div class="mode">全文搜索 · 命中 ' + esc(result.total) + ' 个文件' +
          (result.routes && result.routes.vector ? ' · 含语义匹配' : '') + '</div>';
  if (result.hedge) {
    h += '<div class="mode" style="color:var(--warn)">⚠ ' + esc(result.hedge) + '</div>';
  }
  h += result.files.map(function (f, index) {
    const snips = f.snippets.map(function (s) {
      const loc = s.page ? ('第 ' + s.page + ' 页')
                : (s.section_path ? s.section_path.split(' › ').slice(-1)[0] : '');
      return '<div class="snip">' + (loc ? '<span class="loc">' + esc(loc) + '</span>' : '') +
             highlight(s.text, q) + '</div>';
    }).join('');
    var kind = String(f.ext || '').replace('.', '').toLowerCase();
    return '<div class="hit" data-path="' + encodedData(f.path) + '" data-hit="' + esc(index) + '" tabindex="0">' +
      '<div class="hit-head">' +
        '<span class="icon t-' + esc(kind) + '">' + esc((kind || '·').slice(0, 4).toUpperCase()) + '</span>' +
        '<span class="hit-name">' + esc(f.name) + '</span>' +
        '<span class="hit-meta' + (f.volatile ? ' vol' : '') + '">' +
          esc(f.source_name || '') + '</span>' +
      '</div>' + snips + '</div>';
  }).join('');
  el.innerHTML = h;
  el.querySelectorAll('.hit').forEach(function (r, index) {
    r.onclick = function () {
      var file = result.files[index];
      el.querySelectorAll('.hit.on').forEach(function (item) { item.classList.remove('on'); });
      r.classList.add('on');
      showSearchFileDetail(file);
    };
    r.onkeydown = function (event) {
      if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); r.onclick(); }
    };
    r.ondblclick = function () {
      window.inktable.revealInFinder(decodeURIComponent(r.dataset.path));
    };
  });
}

/* ---------- AI 问答（B6） ---------- */
async function runAsk(q) {
  const question = String(q || '').trim();
  if (!question) return;
  const el = document.getElementById('answerRows');
  el.innerHTML = qaHistoryHtml() +
    '<div class="qa-q">' + esc(question) + '</div>' +
    '<div class="ans"><div class="atext" style="color:var(--text-secondary)">' +
    '正在依据文件库作答…</div></div>';
  bindQaThread(el);
  el.scrollTop = el.scrollHeight;
  document.getElementById('askSubmit').disabled = true;
  try {
    const a = await api('/ask', { method: 'POST', body: JSON.stringify({
      question: question, book_id: activeBook }) });
    renderAnswer(a, question);
    var box = document.getElementById('askQ');
    if (box) box.value = '';
  } catch (e) {
    qaHistory.push({ question: question,
                     html: '<div class="ans"><div class="ahedge">提问失败：' + esc(e.message) + '</div></div>' });
    qaAnswers.push(null);
    renderQaThread();
  } finally {
    document.getElementById('askSubmit').disabled = llmInfo.available !== true;
  }
}

/* 问答历史：右栏保留本会话全部问答；引用绑定按卡片索引回查各自的
   citations，避免旧回答的引用点开后跳到新回答的证据 */
let qaHistory = [];   // [{ question, html }]
let qaAnswers = [];   // 与 qaHistory 对齐的 answer 对象（失败卡为 null）

function qaHistoryHtml() {
  return qaHistory.map(function (item) {
    return '<div class="qa-q">' + esc(item.question) + '</div>' + item.html;
  }).join('');
}

function renderQaThread() {
  const el = document.getElementById('answerRows');
  el.innerHTML = qaHistoryHtml();
  bindQaThread(el);
  el.scrollTop = el.scrollHeight;
}

function bindQaThread(el) {
  el.querySelectorAll('.ref').forEach(function (r) {
    r.onclick = function () {
      var a = qaAnswers[+r.dataset.ans];
      if (!a) return;
      var citationList = a.citations && a.citations.length ? a.citations : (a.retrieved || []);
      var citation = citationList.find(function (item) { return item.tag === r.dataset.tag; });
      if (citation) showEvidence(citation);
    };
    r.ondblclick = function () {
      window.inktable.revealInFinder(decodeURIComponent(r.dataset.path));
    };
  });
  el.querySelectorAll('.cite-chip').forEach(function (c) {
    c.onclick = function () {
      var ref = Array.from(el.querySelectorAll('.ref')).find(function (r) {
        return r.dataset.ans === c.dataset.ans && r.dataset.tag === c.dataset.tag;
      });
      if (ref) { ref.scrollIntoView({ block: 'center' }); ref.onclick(); ref.style.background = 'var(--ink-active)';
                 setTimeout(function () { ref.style.background = ''; }, 900); }
    };
  });
}

function renderAnswer(a, q) {
  const el = document.getElementById('answerRows');

  if (a.status === 'not_configured') {
    el.innerHTML = qaHistoryHtml() +
      '<div class="ans"><div class="atext" style="color:var(--text-secondary)">还没有配置模型服务。' +
      '</div><div class="askbar" id="openSet" style="border:none;padding:8px 0 0">' +
      '打开设置 → AI 问答</div></div>';
    bindQaThread(el);
    document.getElementById('openSet').onclick = function () { sheetOpen(true); };
    return;
  }

  var index = qaAnswers.length;
  let h = '<div class="ans">';
  if (a.hedge) h += '<div class="ahedge">⚠ ' + esc(a.hedge) + '</div>';

  if (a.status === 'answered') {
    var body = esc(a.answer).replace(/\[C(\d{1,2})\]/g, function (_m, n) {
      return '<span class="cite-chip" data-ans="' + index + '" data-tag="C' + n + '">C' + n + '</span>';
    });
    h += '<div class="atext">' + body + '</div>';
    h += '<div class="refs">' + a.citations.map(function (c) {
      return refHtml(c, index);
    }).join('') + '</div>';
  } else if (a.status === 'refused') {
    h += '<div class="atext" style="color:var(--text-secondary)">' + esc(a.answer) + '</div>';
  } else if (a.status === 'fallback') {
    h += '<div class="refs">' + (a.retrieved || []).map(function (c) {
      return refHtml(c, index);
    }).join('') + '</div>';
  }
  h += '</div>';

  qaHistory.push({ question: q, html: h });
  qaAnswers.push(a);
  renderQaThread();
}

function refHtml(c, ansIndex) {
  var loc = c.page ? ('第 ' + c.page + ' 页')
          : (c.section_path ? c.section_path.split(' › ').slice(-1)[0] : '');
  return '<div class="ref" data-ans="' + esc(ansIndex == null ? '' : ansIndex) +
    '" data-tag="' + esc(c.tag) + '" data-path="' + encodedData(c.file_path) + '">' +
    '<span class="rtag">[' + esc(c.tag) + ']</span>' +
    '<span class="rname">' + esc(c.file_name) + (loc ? ' · ' + esc(loc) : '') + '</span>' +
    '<span class="rsnip">' + esc(c.snippet || '') + '</span></div>';
}

async function doSearch(q) {
  if (!q) { await load(''); return; }
  const version = ++searchVersion;
  loadVersion += 1;  // 搜索开始后，忽略尚未返回的文件列表请求
  document.getElementById('count').textContent = '搜索中…';
  let r = null;
  try {
    r = await api('/search', { method: 'POST', body: JSON.stringify({
      q: q, limit: 40, book_id: activeBook,
    }) });
  } catch (e) { /* 全文搜索失败时退回文件名搜索 */ }
  if (version !== searchVersion) return;
  if (r && r.total > 0) {
    document.getElementById('count').textContent = r.total + ' 个文件';
    renderHits(r, q);
    return;
  }
  await load(q);   // 内容没命中就按文件名找
}

function executeQuery(q) {
  clearTimeout(timer);
  timer = null;
  var query = String(q || '').trim();
  if (!query) return load('');
  return doSearch(query);
}

let timer;
document.getElementById('q').oninput = function (e) {
  clearTimeout(timer);
  const v = e.target.value.trim();
  timer = setTimeout(function () { executeQuery(v); }, 220);
};

function updateSetupHint() {

async function previewAndConfirmSource(source, hintEl) {
  if (hintEl) hintEl.textContent = '正在预扫描…';
  let p;
  try {
    p = await api('/sources/preview', { method: 'POST', body: JSON.stringify({
      path: source.path,
    }) });
  } catch (e) {
    if (hintEl) hintEl.textContent = '预扫描失败：' + e.message;
    return false;
  }

  const total = p.truncated ? ('至少 ' + safeNumber(p.total_files)) : safeNumber(p.total_files);
  const ok = confirm(
    '准备启用「' + (source.name || '所选目录') + '」\n\n' +
    source.path + '\n\n' +
    '预计文件：' + total + '\n' +
    '可收录文件：' + safeNumber(p.will_index) + '\n' +
    '按类型忽略：' + safeNumber(p.ignored_by_ext) + '\n' +
    '排除目录：' + safeNumber(p.excluded_dirs) + '\n\n' +
    '继续启用并扫描？'
  );
  if (!ok && hintEl) hintEl.textContent = '已取消启用';
  return ok;
}

document.getElementById('btnEnable').onclick = async function () {
  const btn = this;
  btn.disabled = true;
  const hint = document.getElementById('setupHint');
  const chosen = [].slice.call(document.querySelectorAll('.src input:checked'))
    .map(function (cb) { return sources[cb.dataset.i]; });
  let enabled = 0;
  let skipped = 0;
  const failures = [];
  for (let i = 0; i < chosen.length; i++) {
    const s = chosen[i];
    btn.textContent = '正在预扫描 ' + (i + 1) + '/' + chosen.length + '…';
    if (!await previewAndConfirmSource(s, hint)) {
      skipped += 1;
      if (hint.textContent.startsWith('预扫描失败')) failures.push(hint.textContent);
      continue;
    }
    btn.textContent = '正在扫描 ' + (i + 1) + '/' + chosen.length + '…';
    try {
      await api('/sources/enable', { method: 'POST', body: JSON.stringify({
        name: s.name, path: s.path, kind: s.kind,
        discovered_by: s.discovered_by, volatile: s.volatile }) });
      enabled += 1;
    } catch (e) {
      skipped += 1;
      const message = '启用「' + String(s.name || '') + '」失败：' + e.message;
      failures.push(message);
      hint.textContent = message;
    }
  }
  if (!enabled) {
    btn.textContent = '启用并开始索引';
    updateSetupHint();
    hint.textContent = failures.length
      ? failures[failures.length - 1]
      : (skipped ? '没有启用来源，可重新选择后再试' : '');
    return;
  }
  // 扫描只登记文件，正文索引另起一步 —— 让用户先看到文件列表
  btn.textContent = '正在解析文档内容…';
  document.getElementById('setup').style.display = 'none';
  await boot();
  try { await api('/watch/start', { method: 'POST' }); } catch (e) {}
  startWatchPolling();
  runIndexing();
};

/* 后台索引：解析正文并建全文索引，完成前顶部显示进度 */
let indexingPromise = null;
let indexingRerunRequested = false;

function runIndexing(forceAfterCurrent = false) {
  if (indexingPromise) {
    indexingRerunRequested = indexingRerunRequested || forceAfterCurrent;
    return indexingPromise;
  }
  indexingPromise = drainIndexQueue().finally(function () {
    const rerun = indexingRerunRequested;
    indexingRerunRequested = false;
    indexingPromise = null;
    if (rerun && lastSidecarState === 'ready') runIndexing();
  });
  return indexingPromise;
}

async function drainIndexQueue() {
  const countEl = document.getElementById('count');
  try {
    let st = await api('/index/status');
    let completed = 0;
    while (safeNumber(st.pending) > 0) {
      const pendingBefore = safeNumber(st.pending);
      countEl.textContent = '正在解析 ' + pendingBefore + ' 个文档…';
      const r = await api('/index/run', { method: 'POST', body: JSON.stringify({ limit: 2000 }) });
      completed += safeNumber(r.total);
      const next = await api('/index/status');
      const pendingAfter = safeNumber(next.pending);
      if (pendingAfter >= pendingBefore) {
        countEl.textContent = '索引已暂停：仍有 ' + pendingAfter + ' 个文档待处理';
        toast('索引没有进展，已停止重试');
        return;
      }
      st = next;
    }
    if (!completed) return;
    countEl.textContent = '已处理 ' + completed + ' 个文档，可搜索内容了';
    setTimeout(function () {
      if (!document.getElementById('q').value) load('');
    }, 2500);
  } catch (e) {
    countEl.textContent = '索引暂停，可稍后重试';
    toast('索引失败：' + e.message);
  }
}

/* ---------- 实时监听 ----------
   后端 watcher 在文件落地后自动入库索引（§11.1）。前端做两件事：
   ① 让"它在盯着"这件事可见 —— 顶栏一个常驻小圆点
   ② 新文件进来时刷新列表，并提示一句，不打断当前操作
*/
let liveSeen = 0;          // 上次看到的已入库计数
let livePollTimer = null;
let lastSidecarState = 'starting';
let lastSidecarRevision = -1;
let applicationStarted = false;
let applicationResumePromise = null;
let applicationResumeRequested = false;
let recoveryNoticePending = false;

function setLive(state, text, title) {
  const el = document.getElementById('live');
  el.className = 'live' + (state ? ' ' + state : '');
  document.getElementById('liveText').textContent = text || '';
  el.title = title || '';
}

function setSidecarStatus(info) {
  const el = document.getElementById('sidecarStatus');
  const textEl = document.getElementById('sidecarStatusText');

  // 兼容旧 preload 首次直接给 sidecar:info（{ port, token }）的形式；
  // 新版首次回调来自主进程缓存的 sidecar 状态。
  let state = 'starting';
  if (info && Number.isInteger(Number(info.port)) && Number(info.port) > 0) {
    state = 'ready';
  } else if (info && typeof info.state === 'string') {
    state = info.state;
  }

  const attempt = safeNumber(info && info.attempt);
  const labels = {
    starting: ['正在连接…', '正在启动本地服务'],
    restarting: [attempt > 0 ? ('正在重启（第 ' + attempt + ' 次）…') : '正在重启…', '本地服务正在重启'],
    ready: ['服务已连接', '本地服务运行正常'],
    stopped: ['服务已停止', '本地服务已停止，正在尝试恢复'],
    failed: ['服务不可用', String((info && info.error) || '本地服务启动失败')],
  };
  const entry = labels[state] || ['服务状态未知', '无法识别本地服务状态'];
  const classState = labels[state] ? state : 'stopped';
  if (!el || !textEl) return classState;
  el.className = 'sidecar-status ' + classState;
  textEl.textContent = entry[0];
  el.title = entry[1];
  el.setAttribute('aria-label', entry[1]);
  return classState;
}

function handleSidecarStatus(info) {
  const revision = safeNumber(info && info.revision);
  if (revision > 0 && revision < lastSidecarRevision) return;
  if (revision > 0) lastSidecarRevision = revision;

  const previous = lastSidecarState;
  const state = setSidecarStatus(info);
  lastSidecarState = state;

  if (state === 'ready') {
    if (previous !== 'ready' || (!applicationStarted && !applicationResumePromise)) {
      const recovering = applicationStarted ||
        previous === 'restarting' || previous === 'stopped' || previous === 'failed';
      requestApplicationResume(recovering);
    }
    return;
  }

  // 旧 sidecar 的请求结果不能在断线后覆盖界面；恢复后 boot() 会重新取数。
  loadVersion += 1;
  searchVersion += 1;
  stopWatchPolling();
  liveSeen = 0;
  setLive('off', state === 'starting' ? '等待服务' : '服务中断',
          state === 'failed' ? '本地服务不可用' : '等待本地服务恢复');
}

let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { el.classList.remove('show'); }, 3200);
}

async function pollWatch() {
  try {
    const st = await api('/watch/status');
    const n = st.watched.length;
    if (!st.running || !n) {
      setLive('off', '未监听', '没有已启用的来源');
    } else {
      setLive('', '监听中', n + ' 个目录 · 已自动入库 ' + st.counters.indexed + ' 个文件');
    }

    const done = st.counters.indexed;
    if (liveSeen !== 0 && done > liveSeen) {
      // 有新文件被自动索引了 —— 刷新当前视图并提示
      const latest = st.activity[0];
      const added = done - liveSeen;
      toast(latest && added === 1
        ? '已收录「' + latest.name + '」'
        : '已收录 ' + added + ' 个新文件');

      stats = await api('/stats');
      renderNav();
      const q = document.getElementById('q').value.trim();
      if (q) { doSearch(q); } else { load(''); }
    }
    liveSeen = done;
  } catch (e) {
    setLive('off', '', '监听状态获取失败');
  }
}

function startWatchPolling() {
  if (livePollTimer) return;
  pollWatch();
  livePollTimer = setInterval(pollWatch, 3000);
}

function stopWatchPolling() {
  if (!livePollTimer) return;
  clearInterval(livePollTimer);
  livePollTimer = null;
}

/* ---------- 设置：来源管理 ---------- */
function sheetOpen(on) {
  document.getElementById('sheet').classList.toggle('show', on);
  if (on) renderSources();
}

async function renderSources() {
  const body = document.getElementById('sheetBody');
  body.innerHTML = '<div class="empty" style="padding:30px">加载中…</div>';
  let list;
  try {
    list = (await api('/sources')).sources;
  } catch (e) {
    body.innerHTML = '<div class="empty" style="padding:30px">加载失败：' + esc(e.message) + '</div>';
    return;
  }

  const on = list.filter(function (s) { return s.enabled; }).length;
  document.getElementById('sheetSub').textContent =
    list.length + ' 个来源 · ' + on + ' 个正在监听';

  if (!list.length) {
    body.innerHTML = '<div class="empty" style="padding:30px">还没有来源<br>' +
      '<span style="font-size:11px">点「重新发现」自动查找，或手动添加目录</span></div>';
  } else {
    body.innerHTML = list.map(function (s) {
      const tags = [];
      if (!s.exists) tags.push('<span class="tag gone">目录不存在</span>');
      else if (s.watching) tags.push('<span class="tag live">监听中</span>');
      else if (s.enabled) tags.push('<span class="tag">已启用</span>');
      else tags.push('<span class="tag">已停用</span>');
      if (s.volatile) tags.push('<span class="badge">易失</span>');

      const preserveBtns = s.volatile && s.enabled
        ? '<button class="mini" data-act="autopreserve" data-id="' + esc(s.id) + '" data-on="' + (s.auto_preserve ? 1 : 0) + '">' +
            (s.auto_preserve ? '自动保全:开' : '自动保全:关') + '</button>' +
          '<button class="mini" data-act="preserveall" data-id="' + esc(s.id) + '">立即保全</button>'
        : '';
      const acts = preserveBtns + (s.enabled
        ? '<button class="mini" data-act="disable" data-id="' + esc(s.id) + '">停用</button>'
        : '<button class="mini" data-act="enable" data-id="' + esc(s.id) +
          '" data-path="' + encodedData(s.path) + '" data-name="' + esc(s.name) + '">启用</button>');

      return '<div class="srow">' +
        '<div class="info">' +
          '<div class="nm">' + esc(s.name) + tags.join('') + '</div>' +
          '<div class="pth">' + esc(String(s.path || '').replace(new RegExp('^/Users/[^/]+'), '~')) +
            ' · ' + esc(s.file_count) + ' 个文件</div>' +
        '</div>' +
        '<div class="acts">' + acts +
          '<button class="mini danger" data-act="remove" data-id="' + esc(s.id) +
          '" data-name="' + esc(s.name) + '">移除</button>' +
        '</div></div>';
    }).join('');
  }

  body.querySelectorAll('button[data-act]').forEach(function (b) {
    b.onclick = function () { onSourceAction(b); };
  });

  // AI 问答配置（密钥经主进程 safeStorage 加密，渲染进程只见"已保存"）
  var saved = await window.inktable.llmGet();
  body.insertAdjacentHTML('afterbegin',
    '<div class="llm-form"><div class="lf-title">AI 问答（OpenAI 兼容接口）</div>' +
    '<input id="llmEp" placeholder="接口地址，如 https://api.xxx.com/v1" value="' + esc(saved.endpoint) + '">' +
    '<input id="llmModel" placeholder="模型名" value="' + esc(saved.model) + '">' +
    '<input id="llmKey" type="password" placeholder="' +
      (saved.has_key ? 'API 密钥（已保存，留空表示不变）' : 'API 密钥') + '">' +
    '<div style="display:flex;gap:8px;align-items:center">' +
    '<button class="mini" id="llmSave">保存</button>' +
    '<button class="mini" id="llmTest">检测连接</button>' +
    (llmInfo.configured ? '<button class="mini" id="llmClassify">AI 归类未分类文件</button>' : '') +
    '<button class="mini danger" id="llmClear">清除</button>' +
    '<span class="hint" id="llmHint">' +
      (llmInfo.configured ? '已保存，检测后即可确认模型可用' : '未配置时问答不可用，其余功能不受影响') +
    '</span></div></div>');

  document.getElementById('llmSave').onclick = async function () {
    var hint = document.getElementById('llmHint');
    hint.textContent = '保存中…';
    await window.inktable.llmSet({
      endpoint: document.getElementById('llmEp').value,
      model: document.getElementById('llmModel').value,
      api_key: document.getElementById('llmKey').value,
    });
    try { updateModelState(await api('/settings/llm')); } catch (e) {}
    hint.textContent = llmInfo.configured ? '已保存，请检测连接' : '配置不完整（三项都要填）';
  };
  document.getElementById('llmTest').onclick = function () {
    return testModelConnection(document.getElementById('llmHint'));
  };
  var lc = document.getElementById('llmClassify');
  if (lc) lc.onclick = async function () {
    var hint = document.getElementById('llmHint');
    hint.textContent = '模型归类中…（发送文件名与正文开头）';
    try {
      var r = await api('/classify/llm', { method: 'POST' });
      hint.textContent = r.error ? r.error : ('已归类 ' + r.classified + ' 个，跳过 ' + r.skipped + ' 个');
      await refreshCats(); renderNav();
      await load(document.getElementById('q').value.trim());
    } catch (e) { hint.textContent = '失败：' + e.message; }
  };
  document.getElementById('llmClear').onclick = async function () {
    await window.inktable.llmSet({ clear: true });
    try { updateModelState(await api('/settings/llm')); } catch (e) {}
    await renderSources();
  };
}

async function onSourceAction(btn) {
  const act = btn.dataset.act;
  const hint = document.getElementById('sheetHint');
  let sourcePath = null;

  if (act === 'remove') {
    // 破坏性操作要说清后果：会清索引，但不会动磁盘上的文件
    const ok = confirm('移除「' + btn.dataset.name + '」？\n\n' +
      '将清除它的文件记录与搜索索引。\n磁盘上的原文件不会被删除。');
    if (!ok) return;
  }

  btn.disabled = true;
  if (act === 'enable') {
    sourcePath = decodeURIComponent(btn.dataset.path);
    const ok = await previewAndConfirmSource({ name: btn.dataset.name, path: sourcePath }, hint);
    if (!ok) {
      btn.disabled = false;
      return;
    }
  }
  hint.textContent = '处理中…';
  try {
    if (act === 'autopreserve') {
      await api('/sources/auto_preserve', { method: 'POST', body: JSON.stringify({
        source_id: +btn.dataset.id, enabled: btn.dataset.on !== '1' }) });
      hint.textContent = '';
      await renderSources();
      return;
    } else if (act === 'preserveall') {
      hint.textContent = '正在复制…';
      const r = await api('/sources/preserve_all', { method: 'POST', body: JSON.stringify({
        source_id: +btn.dataset.id }) });
      hint.textContent = '已保全 ' + r.preserved + ' 个' + (r.failed ? '，失败 ' + r.failed : '');
      btn.disabled = false;
      return;
    } else if (act === 'disable') {
      await api('/sources/disable', { method: 'POST', body: JSON.stringify({ source_id: +btn.dataset.id }) });
    } else if (act === 'remove') {
      await api('/sources/remove', { method: 'POST', body: JSON.stringify({ source_id: +btn.dataset.id }) });
    } else if (act === 'enable') {
      await api('/sources/enable', { method: 'POST', body: JSON.stringify({
        name: btn.dataset.name, path: sourcePath }) });
      runIndexing();
    }
    hint.textContent = '';
    await renderSources();
    stats = await api('/stats');
    renderNav();
    await load(document.getElementById('q').value.trim());
    pollWatch();
  } catch (e) {
    hint.textContent = '失败：' + e.message;
    btn.disabled = false;
  }
}

document.getElementById('gear').onclick = function () { sheetOpen(true); };
document.getElementById('modelState').onclick = function () {
  if (!llmInfo.configured) return sheetOpen(true);
  return testModelConnection();
};
document.getElementById('querySubmit').onclick = function () {
  executeQuery(document.getElementById('q').value.trim());
};
document.getElementById('askSubmit').onclick = function () {
  runAsk(document.getElementById('askQ').value);
};
document.getElementById('askQ').onkeydown = function (event) {
  if (event.key === 'Enter' && !event.shiftKey) {
    event.preventDefault();
    if (!document.getElementById('askSubmit').disabled) runAsk(event.target.value);
  }
};
document.getElementById('btnClose').onclick = function () { sheetOpen(false); };
document.getElementById('sheet').onclick = function (e) {
  if (e.target.id === 'sheet') sheetOpen(false);   // 点遮罩关闭
};

document.getElementById('btnAdd').onclick = async function () {
  const dir = await window.inktable.pickDirectory();
  if (!dir) return;
  const hint = document.getElementById('sheetHint');
  const source = { name: dir.split('/').filter(Boolean).slice(-1)[0] || '所选目录', path: dir };
  if (!await previewAndConfirmSource(source, hint)) return;
  hint.textContent = '正在扫描…';
  try {
    await api('/sources/add', { method: 'POST', body: JSON.stringify({ path: dir }) });
    hint.textContent = '';
    await renderSources();
    stats = await api('/stats');
    renderNav();
    await load('');
    runIndexing();
    pollWatch();
  } catch (e) {
    hint.textContent = '添加失败：' + e.message;
  }
};

document.getElementById('btnRescan').onclick = async function () {
  const hint = document.getElementById('sheetHint');
  hint.textContent = '正在查找…';
  try {
    const found = (await api('/sources/discover', { method: 'POST' })).sources;
    const known = new Set((await api('/sources')).sources.map(function (s) { return s.path; }));
    const fresh = found.filter(function (s) { return !known.has(s.path) && s.doc_count > 0; });
    if (!fresh.length) {
      hint.textContent = '没有发现新来源';
      return;
    }
    // 发现结果不自动启用 —— §1 约束 4：用户没同意的目录不监听
    sources = fresh;
    sheetOpen(false);
    document.getElementById('setup').style.display = 'flex';
    renderSetup();
  } catch (e) {
    hint.textContent = '查找失败：' + e.message;
  }
};

document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') sheetOpen(false);
  if ((e.metaKey || e.ctrlKey) && e.key === ',') { e.preventDefault(); sheetOpen(true); }
  if (e.key === 'Enter' && e.target && e.target.id === 'q') {
    e.preventDefault();
    executeQuery(e.target.value.trim());
  }
  if ((e.metaKey || e.ctrlKey) && e.key === 'f') {
    e.preventDefault();
    document.getElementById('q').focus();
    document.getElementById('q').select();
  }
});

async function boot() {
  stats = await api('/stats');
  await refreshCats();
  try { updateModelState(await api('/settings/llm')); } catch (e) { updateModelState({ configured: false }); }
  if (stats.files === 0) {
    document.getElementById('setup').style.display = 'flex';
    sources = (await api('/sources/discover', { method: 'POST' })).sources;
    renderSetup();
    return { hasFiles: false };
  }
  document.getElementById('setup').style.display = 'none';
  renderNav();
  updateWorkbenchChrome();
  const q = document.getElementById('q').value.trim();
  if (q) await executeQuery(q);
  else await load('');
  return { hasFiles: true };
}

function requestApplicationResume(recovered) {
  applicationResumeRequested = true;
  recoveryNoticePending = recoveryNoticePending || recovered;
  if (applicationResumePromise) return applicationResumePromise;

  applicationResumePromise = (async function () {
    while (applicationResumeRequested && lastSidecarState === 'ready') {
      applicationResumeRequested = false;
      const showRecoveryNotice = recoveryNoticePending;
      recoveryNoticePending = false;

      try {
        const state = await boot();
        if (lastSidecarState !== 'ready') {
          applicationResumeRequested = true;
          return;
        }
        applicationStarted = true;

        // 恢复后重新挂上来源监听、重建轮询并续跑索引；后端接口均幂等。
        try { await api('/watch/start', { method: 'POST' }); } catch (e) {}
        if (state.hasFiles) {
          startWatchPolling();
          runIndexing(showRecoveryNotice);
        }
        if (showRecoveryNotice) toast('本地服务已恢复');
      } catch (e) {
        if (lastSidecarState === 'ready') {
          setSidecarStatus({ state: 'failed', error: e.message });
          document.getElementById('rows').innerHTML =
            '<div class="empty">启动失败：' + esc(e.message) + '</div>';
        }
        return;
      }
    }
  })().finally(function () {
    applicationResumePromise = null;
    if (applicationResumeRequested && lastSidecarState === 'ready') {
      requestApplicationResume(recoveryNoticePending);
    }
  });
  return applicationResumePromise;
}

if (window.inktable && typeof window.inktable.onSidecar === 'function') {
  window.inktable.onSidecar(handleSidecarStatus);
} else {
  // 开发/旧 preload 兼容：若能直接取得可用连接信息，仍可正常启动。
  window.inktable.getSidecarInfo().then(function (info) {
    handleSidecarStatus(info || { state: 'failed', error: 'sidecar 未就绪' });
  });
}
</script>
