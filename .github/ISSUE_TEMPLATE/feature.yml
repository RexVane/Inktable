name: Feature request / 功能建议
description: A concrete change you want / 想要的具体改动
title: "[feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / 要解决什么
      description: What is painful or missing today. / 现在缺什么、哪里别扭。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal / 建议
      description: A small, specific change. Ordo does not move user files by default. / 请给一个小而具体的改动。Ordo 默认不移动用户文件。
    validations:
      required: true
