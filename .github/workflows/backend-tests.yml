name: Inktable tests

on:
  push:
    branches: [main]
    paths:
      - "services/api/**"
      - "apps/desktop/**"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    paths:
      - "services/api/**"
      - "apps/desktop/**"
      - ".github/workflows/backend-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inktable-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    # 必须两个平台都跑：产品在 Windows 上用、代码在 macOS 上写，而这条缝里
    # 藏着的问题只在 Windows 上现形（内联脚本 CSP 哈希、CRLF、保留端口段、
    # 平台专属 API 静默返回空值）。只测 Linux 等于这一整类问题没有防线。
    name: Python 3.12 · pytest · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    defaults:
      run:
        working-directory: services/api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: services/api/uv.lock

      - name: Install locked dependencies
        # 缓存与目标常不同盘，硬链接不可用时退化为整拷（否则只是 warning，
        # 但 Windows 上会拖慢每次安装）
        env:
          UV_LINK_MODE: copy
        run: uv sync --frozen --group dev

      - name: Run Ruff correctness checks
        run: uv run ruff check .

      - name: Compile application modules
        run: uv run python -m compileall -q app

      - name: Run backend tests
        env:
          PYTHONHASHSEED: "0"
          # 打到保证没人听的口：探测逻辑遇到显式 env 就不再探活，测试保持封闭
          INKTABLE_OLLAMA_URL: "http://127.0.0.1:9"
          # 不设这个就会落到 ~/Library/Application Support/Inktable ——
          # 在开发机上那正是用户的真实库
          INKTABLE_DB: ${{ runner.temp }}/inktable-ci.db
        run: uv run pytest -q

  platform-paths:
    name: ${{ matrix.os }} · path and CLI smoke
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    defaults:
      run:
        working-directory: services/api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: services/api/uv.lock

      - name: Install locked dependencies
        run: uv sync --frozen --group dev

      - name: Run cross-platform path and CLI contracts
        run: >-
          uv run pytest -q
          tests/test_sources.py::test_windows_discovery_returns_fixed_drive_roots
          tests/test_cli.py
          tests/test_database.py::test_single_instance_lock_can_be_reacquired_after_release

  desktop:
    name: Node 22 · desktop tests · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    defaults:
      run:
        working-directory: apps/desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Run desktop tests
        run: npm test

      # 渲染层的内联脚本由 CSP sha256 白名单钉住，改了内容不重算就会被
      # Chromium 静默拦掉**整块**前端 JS —— 界面照常渲染，但什么都不工作。
      # desktop 测试里已有一条双向比对；这一步在它失败时把实测哈希打出来。
      # 不用 `|| echo`：Windows runner 的 PowerShell 5.1 没有 `||`，自己会红。
      - name: Report CSP hash drift
        if: failure()
        continue-on-error: true
        run: node scripts/csp-hash.js
